<html lang="pt-BR">
<head>

<title>Vitrine de Demos · Gustavo Guimarães</title>

<meta property="og:title" content="Vitrine de Demos · Gustavo Guimarães">

<style>
/* ── Tokens ─────────────────────────────────────────────────── */
:root{
  --green:#00c46e; --green-br:#25e07f; --green-dk:#0a6b3f;
  --bg:#080f0b; --bg-2:#0d1712; --card:#111d17; --card-2:#16261e;
  --line:#1e332a; --ink:#eef4f0; --muted:#93a69c; --muted-2:#6d8478;
  --radius:14px; --shadow:0 4px 24px rgba(0,0,0,.4);
  --hero:radial-gradient(120% 130% at 18% 8%,#0e3a26 0%,#0a1a13 46%,#060d0a 100%);
}
[data-theme="light"]{
  --bg:#f4f6f7; --bg-2:#ffffff; --card:#ffffff; --card-2:#eef2f0;
  --line:#dfe6e2; --ink:#14202b; --muted:#5d6b77; --muted-2:#7d8b96;
  --shadow:0 2px 16px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Roboto',sans-serif;background:var(--bg);color:var(--ink);
  min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.display{font-family:'Work Sans',sans-serif;letter-spacing:-0.02em}
a{color:inherit;text-decoration:none}

/* ── Faixa de demo ──────────────────────────────────────────── */
.faixa-demo{background:#f6c453;color:#4a3100;text-align:center;
  font-family:'Work Sans',sans-serif;font-weight:700;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;padding:7px 16px}

/* ── Cabeçalho ──────────────────────────────────────────────── */
header{position:sticky;top:0;z-index:30;background:rgba(8,15,11,.88);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
[data-theme="light"] header{background:rgba(255,255,255,.9)}
.header-in{max-width:1180px;margin:0 auto;padding:12px 22px;
  display:flex;align-items:center;gap:14px}
.marca{display:flex;align-items:center;gap:11px;flex-shrink:0}
.marca-mark{width:34px;height:34px;border-radius:9px;background:var(--green);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-family:'Work Sans',sans-serif;font-weight:800;font-size:16px;color:#0a1a13}
.marca-txt{line-height:1.15}
.marca-nome{font-family:'Work Sans',sans-serif;font-weight:700;font-size:14.5px}
.marca-sub{font-size:10px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--green);margin-top:2px}
.header-acoes{margin-left:auto;display:flex;align-items:center;gap:9px}

.interruptor-idioma{display:flex;background:var(--card-2);border:1px solid var(--line);
  border-radius:10px;padding:2px;flex-shrink:0}
.interruptor-idioma button{background:none;border:none;border-radius:8px;padding:6px 10px;
  font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--muted-2);
  transition:all .15s;cursor:pointer;font-family:'Work Sans',sans-serif}
.interruptor-idioma button.ativo{background:var(--card);color:var(--green);
  box-shadow:0 2px 8px rgba(0,0,0,.22)}
.btn-icone{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  background:var(--card-2);color:var(--muted);cursor:pointer;display:flex;
  align-items:center;justify-content:center;transition:all .18s}
.btn-icone:hover{color:var(--ink);border-color:var(--green)}
.oculto{display:none}

/* ── Hero ───────────────────────────────────────────────────── */
.hero{background:var(--hero);border-bottom:1px solid var(--line);padding:56px 22px 52px}
[data-theme="light"] .hero{background:linear-gradient(150deg,#0e3a26,#0a1a13 70%)}
.hero-in{max-width:1180px;margin:0 auto}
.hero-tag{display:inline-block;font-family:'Work Sans',sans-serif;font-weight:700;
  font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--green);
  border:1px solid rgba(0,196,110,.34);border-radius:20px;padding:5px 13px;margin-bottom:20px}
.hero h1{font-size:42px;font-weight:300;line-height:1.12;color:#fff;max-width:27ch}
.hero h1 b{display:block;font-weight:800;color:var(--green)}
.hero p{margin-top:18px;max-width:56ch;font-size:15.5px;line-height:1.62;color:#a9bdb2}
.hero-meta{margin-top:26px;display:flex;flex-wrap:wrap;gap:26px}
.hero-meta div{min-width:78px}
.hero-meta .n{font-family:'Work Sans',sans-serif;font-weight:800;font-size:25px;color:#fff}
.hero-meta .l{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted-2);margin-top:3px;font-weight:600}

/* ── Controles ──────────────────────────────────────────────── */
.controles{max-width:1180px;margin:0 auto;padding:32px 22px 0;
  display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.busca{position:relative;flex:1;min-width:250px}
.busca svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted-2)}
.busca input{width:100%;height:46px;padding:0 16px 0 42px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  font-family:'Roboto',sans-serif;font-size:14px;outline:none;transition:all .18s}
.busca input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,196,110,.14)}
.busca input::placeholder{color:var(--muted-2)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:20px;padding:8px 15px;font-family:'Work Sans',sans-serif;font-weight:600;
  font-size:12px;cursor:pointer;transition:all .18s;white-space:nowrap}
.chip:hover{color:var(--ink);border-color:var(--muted-2)}
.chip.ativo{background:var(--green);border-color:var(--green);color:#0a1a13;font-weight:700}

.contagem{max-width:1180px;margin:0 auto;padding:20px 22px 0;
  font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  font-family:'Work Sans',sans-serif;font-weight:600;color:var(--muted-2)}

/* ── Grade ──────────────────────────────────────────────────── */
.grade{max-width:1180px;margin:0 auto;padding:18px 22px 72px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px}
.cartao{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;transition:all .22s;
  box-shadow:var(--shadow)}
.cartao:hover{transform:translateY(-3px);border-color:rgba(0,196,110,.5)}
.cartao-img{position:relative;aspect-ratio:16/9;background:var(--card-2);overflow:hidden;
  border-bottom:1px solid var(--line)}
.cartao-img img{width:100%;height:100%;object-fit:cover;object-position:top center;
  display:block;transition:transform .5s ease}
.cartao:hover .cartao-img img{transform:scale(1.03)}
.cartao-num{position:absolute;top:11px;left:11px;background:rgba(6,13,10,.82);
  color:var(--green);font-family:'Work Sans',sans-serif;font-weight:800;font-size:11px;
  letter-spacing:.08em;padding:4px 10px;border-radius:20px;backdrop-filter:blur(4px)}
.cartao-corpo{padding:20px 20px 22px;display:flex;flex-direction:column;flex:1}
.cartao h3{font-size:19px;font-weight:700;margin-bottom:4px}
.cartao .sub{font-size:11px;letter-spacing:.11em;text-transform:uppercase;
  font-family:'Work Sans',sans-serif;font-weight:600;color:var(--green);margin-bottom:11px}
.cartao p{font-size:13.5px;line-height:1.6;color:var(--muted);flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:15px}
.tag{font-size:10.5px;font-family:'Work Sans',sans-serif;font-weight:600;
  letter-spacing:.05em;color:var(--muted-2);background:var(--card-2);
  border:1px solid var(--line);border-radius:6px;padding:4px 9px}
.cartao-rodape{margin-top:17px;display:flex;align-items:center;gap:10px}
.btn-abrir{flex:1;height:42px;border-radius:10px;background:var(--green);color:#0a1a13;
  font-family:'Work Sans',sans-serif;font-weight:700;font-size:13.5px;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:all .18s}
.btn-abrir:hover{background:var(--green-br)}
.btn-nova{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);
  background:var(--card-2);color:var(--muted);display:flex;align-items:center;
  justify-content:center;transition:all .18s;flex-shrink:0}
.btn-nova:hover{color:var(--green);border-color:var(--green)}

.vazio{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted-2)}
.vazio b{display:block;font-family:'Work Sans',sans-serif;font-size:17px;
  color:var(--ink);margin-bottom:7px;font-weight:600}

/* ── Rodapé ─────────────────────────────────────────────────── */
footer{border-top:1px solid var(--line);background:var(--bg-2);padding:34px 22px}
.footer-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;
  gap:16px;align-items:center;justify-content:space-between}
footer p{font-size:12.5px;color:var(--muted-2);line-height:1.6}
footer .aviso{font-family:'Work Sans',sans-serif;font-weight:600;color:var(--muted)}

@media(max-width:640px){
  .hero{padding:44px 20px 40px}
  .hero h1{font-size:33px}
  .grade{grid-template-columns:1fr;gap:18px}
  .marca-sub{display:none}
}
</style>
</head>
<body>

<div class="faixa-demo" data-i18n="faixaDemo"></div>

<header>
  <div class="header-in">
    <a class="marca" href="#topo">
      <div class="marca-mark">G</div>
      <div class="marca-txt">
        <div class="marca-nome" data-i18n="marcaNome"></div>
        <div class="marca-sub">Gustavo Guimarães</div>
      </div>
    </a>
    <div class="header-acoes">
      <div class="interruptor-idioma" role="group" id="grupoIdioma">
        <button id="btnPT" onclick="definirIdioma('pt')">PT</button>
        <button id="btnEN" onclick="definirIdioma('en')">EN</button>
      </div>
      <button class="btn-icone" id="btnTema" onclick="alternarTema()">
        <svg id="iconeSol" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg id="iconeLua" class="oculto" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </div>
</header>

<section class="hero" id="topo">
  <div class="hero-in">
    <h1><span data-i18n="heroT1"></span><b data-i18n="heroT2"></b></h1>
    <p data-i18n="heroSub"></p>
    <div class="hero-meta">
      <div><div class="n" id="metaTotal"></div><div class="l" data-i18n="metaFerramentas"></div></div>
      <div><div class="n">PT · EN</div><div class="l" data-i18n="metaIdiomas"></div></div>
      <div><div class="n">100%</div><div class="l" data-i18n="metaDados"></div></div>
    </div>
  </div>
</section>

<div class="controles">
  <div class="busca">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="text" id="campoBusca" oninput="filtrar()">
  </div>
  <div class="chips" id="chips"></div>
</div>

<div class="contagem" id="contagem"></div>
<main class="grade" id="grade"></main>

<footer>
  <div class="footer-in">
    <p class="aviso" data-i18n="rodapeAviso"></p>
    <p data-i18n="rodapeNota"></p>
  </div>
</footer>

<script>
/* =====================================================================
   1. TEXTOS DA INTERFACE (PT / EN)
   ===================================================================== */
var TEXTOS = {
  pt: {
    tituloPagina:'Vitrine de Demos · Gustavo Guimarães',
    faixaDemo:'Versão demonstrativa · dados fictícios · nenhuma informação real',
    marcaNome:'Vitrine de Demos',
    heroT1:'Ferramentas e ',
    heroT2:'Dashboards de Marketing.',
    heroSub:'Demonstrações navegáveis das ferramentas que o time de marketing usa no dia a dia: busca de recursos, rateio de mídia paga, calendário de eventos, captação e funil de leads, e padronização de UTM. Tudo roda no navegador, sem instalação e sem login.',
    metaFerramentas:'Ferramentas',
    metaIdiomas:'Idiomas',
    metaDados:'Dados fictícios',
    buscaPh:'Buscar por nome, função ou palavra-chave',
    chipTodos:'Todos',
    contagem:function (n, total) {
      return n === total ? (total + ' ferramentas') : (n + ' de ' + total + ' ferramentas');
    },
    btnAbrir:'Abrir demonstração',
    tituloNovaAba:'Abrir em nova aba',
    tituloTema:'Alternar tema claro/escuro',
    ariaIdioma:'Escolher o idioma da página',
    vazioTitulo:'Nenhuma ferramenta encontrada',
    vazioTexto:'Tente outro termo ou volte para "Todos".',

    /* ── Cartões ── */
    n1:'Central de Links',  s1:'Busca e governança de recursos',
    d1:'Portal único de busca para todos os recursos digitais da empresa: painéis, planilhas, documentos, apresentações, formulários e sistemas. A busca tolera erro de digitação e o menu hierárquico se constrói sozinho a partir dos dados. Cadastre um recurso numa área nova e ela aparece no menu na hora.',
    n2:'Central de Pagamentos', s2:'Rateio de mídia paga',
    d2:'Automatiza a preparação de lançamentos de mídia paga para o Financeiro. Importa boleto, nota fiscal, fatura e relatório de campanhas, gera a tabela de rateio já classificada por natureza contábil e centro de resultado, força o fechamento contra o valor oficial e entrega o e-mail de lançamento pronto.',

    d5:'Assistente de 7 etapas que monta links UTM seguindo a taxonomia oficial, com 14 campos validados por dropdown e ajuda em cada um. Gera até 10 links por sessão, replica campos entre eles e entrega a URL final com cada parâmetro separado e pronto para copiar.',

    marcaNome:'Demo Showcase',
    heroT1:'Marketing ',
    heroT2:'Tools and Dashboards.',
    heroSub:'Interactive demos of the tools a marketing team uses every day: resource search, paid media cost allocation, event calendar, lead capture and funnel, and UTM standardisation. Everything runs in the browser, with no install and no login.',
    metaFerramentas:'Tools',
    metaIdiomas:'Languages',
    metaDados:'Fictional data',
    buscaPh:'Search by name, purpose or keyword',
    chipTodos:'All',
    contagem:function (n, total) {
      return n === total

    },
    btnAbrir:'Open demo',
    tituloNovaAba:'Open in a new tab',
    tituloTema:'Toggle light/dark theme',
    ariaIdioma:'Choose the page language',
    vazioTitulo:'No tool found',

    d6:'A mobile-first 5-step form to register the lead right at the booth. It qualifies the contact by interest, role in the decision and temperature, and the conversation summary can be typed or recorded as audio straight from the browser, with no app and no install.'

};

var IDIOMA = 'pt';
function t(chave) {
  var v = (TEXTOS[IDIOMA] || TEXTOS.pt)[chave];
  if (v === undefined) v = TEXTOS.pt[chave];
  return v === undefined ? '' : v;
}

/* =====================================================================

/* =====================================================================
   3. UTILITÁRIOS
   ===================================================================== */
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// Minúsculas e sem acento, para comparar buscas
function norm(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
}
function nome(f) { return t('n' + f.k); }
function sub(f)  { return t('s' + f.k); }
function desc(f) { return t('d' + f.k); }
function tags(f) { return f.tags[IDIOMA] || f.tags.pt; }

/* =====================================================================
   4. RENDERIZAÇÃO
   ===================================================================== */
function montarChips() {
  document.getElementById('chips').innerHTML = CATEGORIAS.map(function (c) {
    return '<button class="chip' + (ESTADO.cat === c.id ? ' ativo' : '') +
      '" onclick="definirCategoria(\'' + c.id + '\')">' + esc(c[IDIOMA] || c.pt) + '</button>';
  }).join('');
}

function definirCategoria(id) { ESTADO.cat = id; montarChips(); filtrar(); }

function filtrar() {
  var campo = document.getElementById('campoBusca');
  ESTADO.termo = campo ? campo.value : '';
  var termo = norm(ESTADO.termo).trim();

  var lista = FERRAMENTAS.filter(function (f) {
    if (ESTADO.cat !== 'todos' && f.cats.indexOf(ESTADO.cat) === -1) return false;
    if (!termo) return true;
    var alvo = norm([nome(f), sub(f), desc(f), tags(f).join(' ')].join(' '));
    return termo.split(/\s+/).every(function (p) { return alvo.indexOf(p) !== -1; });
  });

  document.getElementById('contagem').textContent =
    t('contagem')(lista.length, FERRAMENTAS.length);
  desenharGrade(lista);
}

function desenharGrade(lista) {
  var grade = document.getElementById('grade');
  if (!lista.length) {
    grade.innerHTML = '<div class="vazio"><b>' + esc(t('vazioTitulo')) + '</b>' +
      esc(t('vazioTexto')) + '</div>';
    return;
  }
  grade.innerHTML = lista.map(function (f) {
    return '' +
      '<article class="cartao">' +
        '<a class="cartao-img" href="' + f.arq + '">' +
          '<img src="' + f.img + '" alt="' + esc(nome(f)) + '" loading="lazy">' +
          '<span class="cartao-num">0' + f.k + '</span>' +
        '</a>' +
        '<div class="cartao-corpo">' +
          '<h3>' + esc(nome(f)) + '</h3>' +
          '<div class="sub">' + esc(sub(f)) + '</div>' +
          '<p>' + esc(desc(f)) + '</p>' +
          '<div class="tags">' +
            tags(f).map(function (g) { return '<span class="tag">' + esc(g) + '</span>'; }).join('') +
          '</div>' +
          '<div class="cartao-rodape">' +
            '<a class="btn-abrir" href="' + f.arq + '">' + esc(t('btnAbrir')) +
              ' <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>' +
            '<a class="btn-nova" href="' + f.arq + '" target="_blank" rel="noopener" title="' +
              esc(t('tituloNovaAba')) + '" aria-label="' + esc(t('tituloNovaAba')) + '">' +
              '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>' +
            '</a>' +
          '</div>' +
        '</div>' +
      '</article>';
  }).join('');
}

/* =====================================================================
   5. IDIOMA E TEMA
   ===================================================================== */
function aplicarTextos() {
  document.title = t('tituloPagina');
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    el.textContent = t(el.dataset.i18n);
  });
  document.getElementById('metaTotal').textContent = FERRAMENTAS.length;
  document.getElementById('campoBusca').placeholder = t('buscaPh');
  document.getElementById('btnTema').title = t('tituloTema');
  document.getElementById('grupoIdioma').setAttribute('aria-label', t('ariaIdioma'));
}

function marcarBotoesIdioma() {
  document.getElementById('btnPT').classList.toggle('ativo', IDIOMA === 'pt');
  document.getElementById('btnEN').classList.toggle('ativo', IDIOMA === 'en');
}

// Troca o idioma e redesenha tudo que depende de texto.
function definirIdioma(idioma) {
  IDIOMA = idioma;
  try { localStorage.setItem('demo_idioma', idioma); } catch (e) {}
  document.documentElement.lang = (idioma === 'pt' ? 'pt-BR' : 'en');
  marcarBotoesIdioma();
  aplicarTextos();
  montarChips();
  filtrar();
}

// Primeiro carregamento: usa o salvo; sem escolha, detecta o idioma do navegador.
function iniciarIdioma() {
  var idioma = 'pt';
  try {
    idioma = localStorage.getItem('demo_idioma') ||
      ((navigator.language || 'pt').toLowerCase().indexOf('pt') === 0 ? 'pt' : 'en');
  } catch (e) {}
  IDIOMA = (idioma === 'en' ? 'en' : 'pt');
  document.documentElement.lang = (IDIOMA === 'pt' ? 'pt-BR' : 'en');
  marcarBotoesIdioma();
}

function aplicarTema(tema) {
  document.documentElement.setAttribute('data-theme', tema);
  document.getElementById('iconeSol').classList.toggle('oculto', tema === 'light');
  document.getElementById('iconeLua').classList.toggle('oculto', tema !== 'light');
}

function alternarTema() {
  var atual = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  var novo = atual === 'light' ? 'dark' : 'light';
  aplicarTema(novo);
  try { localStorage.setItem('demo_tema', novo); } catch (e) {}
}

function iniciarTema() {
  var tema = 'dark';
  try { tema = localStorage.getItem('demo_tema') || 'dark'; } catch (e) {}
  aplicarTema(tema === 'light' ? 'light' : 'dark');
}

/* =====================================================================
   6. INÍCIO
   ===================================================================== */
(function iniciar() {
  iniciarTema();
  iniciarIdioma();
  aplicarTextos();
  montarChips();
  filtrar();
})();
</script>
</body>
</html>
