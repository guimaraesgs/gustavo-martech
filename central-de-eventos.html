<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Central de Eventos · Empresa ABC — Demo</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Work+Sans:wght@300;400;500;600;700;800&display=swap');

:root {
  --green: #00c46e;
  --green-bright: #25e07f;
  --green-deep: #0a6b3f;
  --green-darker: #053c24;
  --navy: #16232f;
  --teal: #2b8f9c;
  --pink: #d9657f;
  --gold: #f0c040;
  --muted: #5d6b77;
  --muted-2: #8b97a1;
  --card: #111814;
  --card-2: #0a100d;
  --line: #1d2b25;
  --line-2: #1a2620;
  --display: 'Work Sans', system-ui, sans-serif;
  --body: 'Roboto', system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: #0a0f0d;
  color: #e7edf2;
  font-family: var(--body);
  min-height: 100vh;
  scroll-behavior: smooth;
}

h1, h2, h3, h4 { font-family: var(--display); margin: 0; }

.container { max-width: 1280px; margin: 0 auto; padding: 0 56px; width: 100%; }
.hidden { display: none !important; }

/* ============ CABEÇALHO FIXO ============ */
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1000;
  background: rgba(10, 15, 13, 0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 14px 56px;
  display: grid;
  grid-template-columns: auto auto 1fr;
  align-items: center;
  gap: 24px;
}
.brand { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; justify-self: start; cursor: default; user-select: none; }
.brand-logo { height: 24px; display: block; }
.brand-sub {
  font-family: var(--display);
  font-weight: 600;
  font-size: 10.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--green-bright);
  white-space: nowrap;
}

.topnav { display: flex; gap: 2.2rem; justify-self: start; margin-left: 56px; align-items: center; }
.nav-link {
  color: #aeb9c4;
  text-decoration: none;
  font-family: var(--display);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding-bottom: 2px;
  border-bottom: 2px solid transparent;
  transition: color .2s;
}
.nav-link:hover { color: #fff; }
.nav-link.active { color: var(--green-bright); border-bottom-color: var(--green); }
.nav-link.disabled { opacity: .45; cursor: default; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 22px;
  border-radius: 8px;
  font-family: var(--display);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.04em;
  cursor: pointer;
  border: none;
  text-transform: uppercase;
  transition: transform .2s;
  justify-self: end;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--green); color: #0a140d; }
.btn-outline {
  background: transparent;
  color: var(--green-bright);
  border: 1px solid var(--green);
}
.btn-outline:hover { background: rgba(0,196,110,.1); }
.top-actions .btn { white-space: nowrap; }

/* --- Dropdown do menu Início --- */
.nav-drop { position: relative; }
.nav-caret { font-style: normal; font-size: 9px; color: var(--muted-2); }
.nav-panel {
  display: none;
  position: absolute;
  top: calc(100% + 10px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 1200;
  min-width: 190px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px;
  box-shadow: 0 16px 40px rgba(0,0,0,.45);
}
.nav-drop:hover .nav-panel, .nav-drop.open .nav-panel { display: block; }
.nav-panel::before { /* ponte invisível p/ não fechar no caminho do mouse */
  content: '';
  position: absolute;
  top: -12px; left: 0; right: 0; height: 12px;
}
.nav-panel a {
  display: block;
  padding: 9px 13px;
  border-radius: 8px;
  color: #cfe0d6;
  text-decoration: none;
  font-family: var(--display);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.nav-panel a:hover { background: rgba(0,196,110,.1); color: var(--green-bright); }

/* Âncoras com folga do cabeçalho fixo */
#calendario, #indicadores, #mapa, #todos-eventos { scroll-margin-top: 84px; }

/* ============ INTRODUÇÃO (home) ============ */
.home-hero {
  background: radial-gradient(130% 120% at 22% 12%, #0e3a26 0%, #0a1a13 48%, transparent 100%);
  padding: 64px 0 44px;
}
.hero-sub { color: #cfe8da; font-size: 16.5px; margin: 20px 0 28px; max-width: 520px; line-height: 1.6; }
.hero-acoes { display: flex; gap: 12px; flex-wrap: wrap; }

/* ============ PRIMEIRA DOBRA ============ */
main { padding-top: 66px; }

.fold {
  padding-top: 40px;
  padding-bottom: 10px;
}
#calendario.fold {
  background: radial-gradient(130% 120% at 22% 12%, #0e3a26 0%, #0a1a13 48%, transparent 100%);
  max-width: none;
}
#calendario .cal-card { max-width: 1280px; margin: 0 auto; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 28px;
}

/* --- Calendário --- */
.cal-card { padding: 36px 40px; }
.cal-head { display: flex; align-items: center; gap: 18px; margin-bottom: 24px; }
.cal-head h4 { color: #fff; font-size: 23px; font-weight: 800; text-transform: capitalize; }
.cal-nav {
  background: none; border: 1px solid var(--line);
  border-radius: 8px; color: #fff; cursor: pointer;
  width: 36px; height: 36px; font-size: 14px;
}
.cal-nav:hover { border-color: var(--green); color: var(--green-bright); }

.cal-body { display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; }

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
  text-align: center;
}
.cal-grid .wd { font-size: 12px; font-weight: 600; color: var(--muted); padding-bottom: 8px; }
.cal-grid .day {
  padding: 13px 0;
  border-radius: 9px;
  font-size: 14.5px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all .15s;
  color: #fff;
}
.cal-grid .day:hover { background: rgba(255,255,255,.08); }
.cal-grid .day.has-event { background: rgba(0,196,110,.1); color: var(--green-bright); border-color: var(--green); font-weight: 600; }
.cal-grid .day.holiday { background: rgba(217,101,127,.15); color: var(--pink); font-weight: 600; }
.cal-grid .day.today { background: rgba(255,255,255,.15); font-weight: 800; }
.cal-grid .day.selected { background: var(--green); color: #0a140d; font-weight: 800; border-color: var(--green); }

.cal-legend { display: flex; gap: 14px; margin-top: 16px; font-size: 11px; color: var(--muted-2); flex-wrap: wrap; }
.cal-legend > span { display: flex; align-items: center; gap: 5px; }
.cal-legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

/* --- Filtros de categoria do calendário --- */
.cal-cats {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--line-2);
}
.cal-cat {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--card-2);
  border: 1px solid var(--line-2);
  border-radius: 999px;
  padding: 8px 16px;
  color: #cfe0d6;
  font-family: var(--display);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .2s;
}
.cal-cat:hover { border-color: var(--muted); }
.cal-cat .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* --- Painel lateral do dia --- */
.day-panel {
  border-left: 1px solid var(--line-2);
  padding-left: 28px;
  max-height: 560px;
  overflow-y: auto;
}
.day-panel::-webkit-scrollbar { width: 6px; }
.day-panel::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
.day-panel-empty {
  height: 100%;
  min-height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
}
.day-panel h4 { color: #fff; font-size: 15px; margin-bottom: 14px; }
.day-panel h4 .dt { color: var(--green-bright); }
.day-panel .clear-day {
  background: none; border: none; color: var(--muted);
  cursor: pointer; font-size: 12px; float: right; font-family: var(--body);
}
.mini-event {
  background: var(--card-2);
  border: 1px solid var(--line-2);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: border-color .2s;
}
.mini-event:hover { border-color: var(--green); }
.mini-event .t { font-family: var(--display); font-size: 13.5px; font-weight: 600; color: #fff; margin-bottom: 3px; }
.mini-event .m { font-size: 11.5px; color: var(--muted-2); }

/* ============ SEÇÕES ============ */
.sec-head {
  display: flex;
  align-items: baseline;
  gap: 24px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 22px;
  margin-bottom: 44px;
  margin-top: 84px;
}
.sec-head .num {
  font-family: var(--display);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.2em;
  color: var(--green);
  width: 54px;
  flex-shrink: 0;
}
.sec-head h2 {
  font-weight: 700;
  text-transform: uppercase;
  font-size: 34px;
  letter-spacing: -0.01em;
  color: #fff;
}
.sec-head .desc { margin-left: auto; color: var(--muted-2); font-size: 15px; text-align: right; }

/* ============ INDICADORES ============ */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.stat-card {
  border-radius: 36px;
  border: 1.5px solid rgba(255,255,255,0.85);
  background: linear-gradient(180deg, #0a1712, #060f0b);
  padding: 34px 24px;
  text-align: center;
  min-width: 0;
}
.stat-card .v {
  font-family: var(--display);
  font-weight: 800;
  font-size: 64px;
  background: linear-gradient(180deg, #6cf396, #18c06a 46%, #0a8048);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  line-height: 1;
  margin-bottom: 10px;
}
.stat-card .l {
  font-family: var(--display);
  font-size: 14.5px;
  color: #fff;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.stat-card .pct {
  color: var(--green-bright);
  font-weight: 700;
  margin-top: 10px;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stat-card .pct.clicavel { cursor: pointer; }
.stat-card .pct.expandido {
  white-space: normal;
  overflow: visible;
  text-overflow: clip;
  line-height: 1.5;
}

/* --- Quebra por tipo --- */
.type-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 18px;
  margin-top: 26px;
}
.type-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px 22px;
  min-width: 0;
}
.type-card .th {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--display);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #cfe0d6;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.type-card .th .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.type-card .tv {
  font-family: var(--display);
  font-weight: 800;
  font-size: 34px;
  color: #fff;
  line-height: 1;
  margin: 12px 0 10px;
}
.type-card .bar {
  height: 5px;
  border-radius: 3px;
  background: var(--line-2);
  overflow: hidden;
  margin-bottom: 8px;
}
.type-card .bar i { display: block; height: 100%; border-radius: 3px; }
.type-card .ts { font-size: 11.5px; color: var(--muted-2); }

/* ============ FILTROS ============ */
.filters { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 30px; }
.filter { position: relative; }
.filter-btn {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: #cfe0d6;
  padding: 10px 18px;
  font-family: var(--display);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
}
.filter-btn:hover, .filter.open .filter-btn { border-color: var(--green); }
.filter-btn .fcount { color: var(--green-bright); font-size: 11px; }
.filter-btn i { font-style: normal; font-size: 10px; color: var(--muted-2); }

.filter-panel {
  display: none;
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  z-index: 500;
  min-width: 260px;
  max-height: 340px;
  overflow-y: auto;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  box-shadow: 0 16px 40px rgba(0,0,0,.5);
}
.filter.open .filter-panel { display: block; }
.filter-panel::-webkit-scrollbar { width: 6px; }
.filter-panel::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

.filter-actions { display: flex; gap: 8px; margin-bottom: 10px; }
.filter-actions button {
  flex: 1;
  background: var(--card-2);
  border: 1px solid var(--line-2);
  border-radius: 7px;
  color: var(--green-bright);
  font-family: var(--display);
  font-size: 11px;
  font-weight: 600;
  padding: 7px 4px;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.filter-actions button:hover { border-color: var(--green); }

.filter-opt {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 8px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 13.5px;
  color: #cfe0d6;
}
.filter-opt:hover { background: rgba(255,255,255,.05); }
.filter-opt input { accent-color: var(--green); cursor: pointer; }

/* ============ LISTA DE EVENTOS ============ */
.events-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.event-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 16px 22px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  cursor: pointer;
  transition: border-color .2s;
}
.event-row:hover { border-color: var(--green); }
.event-row .left { display: flex; gap: 20px; align-items: center; min-width: 0; }
.event-row .date-block { text-align: center; color: var(--green); min-width: 44px; }
.event-row .date-block .d { font-family: var(--display); font-size: 22px; font-weight: 800; line-height: 1; }
.event-row .date-block .m { font-size: 10px; font-weight: 600; }
.event-row h4 { font-size: 15px; color: #fff; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.event-row .meta { font-size: 12px; color: var(--muted); }
.events-empty {
  grid-column: 1 / -1;
  padding: 40px;
  text-align: center;
  color: var(--muted);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
}

/* --- Badges por tipo --- */
.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-family: var(--display);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  white-space: nowrap;
}
.badge.b-tipo3 { background: rgba(0,196,110,.1); color: var(--green-bright); border: 1px solid rgba(0,196,110,.3); }
.badge.b-tipo2    { background: rgba(108,243,150,.08); color: #6cf396; border: 1px solid rgba(108,243,150,.3); }
.badge.b-tipo1   { background: rgba(43,143,156,.1); color: #58c2cf; border: 1px solid rgba(43,143,156,.35); }
.badge.b-nacional { background: rgba(194,103,204,.1); color: #c267cc; border: 1px solid rgba(194,103,204,.3); }
.badge.b-regional { background: rgba(163,194,220,.08); color: #a3c2dc; border: 1px solid rgba(163,194,220,.3); }
.badge.b-interno  { background: rgba(139,151,161,.1); color: var(--muted-2); border: 1px solid rgba(139,151,161,.3); }
.badge.b-proprio  { background: rgba(240,192,64,.08); color: var(--gold); border: 1px solid rgba(240,192,64,.3); }
.badge.b-feriado  { background: rgba(217,101,127,.1); color: var(--pink); border: 1px solid rgba(217,101,127,.3); }
.badge.b-outros   { background: rgba(255,255,255,.06); color: #cfe0d6; border: 1px solid rgba(255,255,255,.15); }

/* ============ MAPA DE EVENTOS ============ */
.map-grid {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 28px;
  align-items: stretch;
}
.map-card { display: flex; align-items: center; justify-content: center; }
#map { width: 100%; max-width: 560px; height: auto; display: block; }

#map .state { cursor: pointer; outline: none; text-decoration: none; }
#map .state .shape {
  fill: #16241d;
  stroke: #1d2b25;
  stroke-width: 0.6;
  transition: fill .25s ease-in-out;
}
#map .state .icon_state { fill: #1a2620; transition: fill .25s ease-in-out; }
#map .state .label_icon_state {
  fill: var(--muted);
  font-family: var(--display);
  font-size: 10px;
  font-weight: 600;
  pointer-events: none;
  transition: fill .25s ease-in-out;
}
#map .state .label_state {
  display: none;
  fill: #cfe8da;
  font-family: var(--display);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
#map .state:hover .label_state { display: block; }

/* Estados com eventos */
#map .state.st-has .shape { fill: rgba(0, 196, 110, 0.22); }
#map .state.st-has .icon_state { fill: rgba(0, 196, 110, 0.30); }
#map .state.st-has .label_icon_state { fill: var(--green-bright); }

/* Hover e selecionado */
#map .state:hover .shape, #map .state.st-sel .shape { fill: var(--green); }
#map .state:hover .icon_state, #map .state.st-sel .icon_state { fill: var(--green); }
#map .state:hover .label_icon_state, #map .state.st-sel .label_icon_state { fill: #0a140d; }

/* Painel lateral do mapa */
.map-panel { display: flex; flex-direction: column; min-height: 420px; }
.map-panel-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px; }
.map-panel-head h3 {
  font-family: var(--display);
  font-weight: 700;
  font-size: 22px;
  text-transform: uppercase;
  color: #fff;
}
.map-panel-head .total {
  font-family: var(--display);
  font-weight: 800;
  font-size: 22px;
  color: var(--green-bright);
}
.map-panel-head .voltar {
  margin-left: auto;
  background: none;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--muted-2);
  font-family: var(--display);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 6px 12px;
  cursor: pointer;
}
.map-panel-head .voltar:hover { border-color: var(--green); color: var(--green-bright); }
.map-panel-sub { font-size: 12.5px; color: var(--muted-2); margin-bottom: 14px; }

.map-cities { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.city-chip {
  font-family: var(--display);
  font-size: 11.5px;
  font-weight: 600;
  color: #cfe8da;
  background: var(--card-2);
  border: 1px solid var(--line-2);
  border-radius: 999px;
  padding: 5px 12px;
}
.city-chip b { color: var(--green-bright); }

.map-events {
  flex: 1;
  overflow-y: auto;
  max-height: 420px;
  padding-right: 6px;
}
.map-events::-webkit-scrollbar { width: 6px; }
.map-events::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

/* ============ MODAL ============ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
}
.modal-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 40px;
  max-width: 520px;
  width: 100%;
  position: relative;
  max-height: 84vh;
  overflow-y: auto;
}
.modal-close {
  position: absolute;
  top: 14px; right: 16px;
  background: none; border: none;
  color: var(--muted);
  font-size: 26px;
  cursor: pointer;
  line-height: 1;
}
.modal-card h2 { color: #fff; font-size: 23px; margin: 14px 0 24px; }
.modal-field { display: flex; gap: 10px; margin-bottom: 13px; }
.modal-field .k { color: var(--green); font-weight: 600; width: 105px; font-size: 13px; flex-shrink: 0; }
.modal-field .w { color: #cfe0d6; font-size: 14px; }

/* ============ FOOTER ============ */
.footer { border-top: 1px solid var(--line); padding: 3rem 0; margin-top: 90px; background: #060d0a; }
.footer-inner { display: flex; justify-content: space-between; align-items: center; color: var(--muted-2); font-size: 13px; }
.footer p { margin: 4px 0 0; }
.foot-logo { height: 26px; display: block; opacity: .9; }
.foot-right { text-align: right; }

/* ============ LOADING ============ */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(6, 13, 10, .85);
  z-index: 3000;
  display: flex;
  align-items: center;
  justify-content: center;
}
.loading-box { display: flex; flex-direction: column; align-items: center; gap: 16px; color: var(--muted-2); font-size: 14px; }
.spinner {
  width: 42px; height: 42px;
  border: 3px solid var(--line);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============ SOLICITAR EVENTO ============ */
.title-pattern {
  font-family: var(--display);
  text-transform: uppercase;
  font-size: 56px;
  line-height: 1.06;
  letter-spacing: -0.02em;
  margin: 0;
}
.title-pattern .wt { font-weight: 300; color: #fff; }
.title-pattern .hv { font-weight: 800; color: #fff; }
.title-pattern .gr { font-weight: 800; color: var(--green); }

.sol-hero {
  background: radial-gradient(130% 120% at 22% 12%, #0e3a26 0%, #0a1a13 48%, transparent 100%);
  padding: 48px 0 36px;
}
.sol-sub { color: #cfe8da; font-size: 16px; margin: 18px 0 0; max-width: 560px; }

.sol-grid {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 28px;
  align-items: start;
  margin-top: 26px;
}
.sol-form-card { padding: 32px 36px; }
.sol-right { display: flex; flex-direction: column; gap: 20px; position: sticky; top: 84px; }
.sol-cal-card { padding: 24px; }
.sol-cal .day { padding: 8px 0; font-size: 13px; border-radius: 7px; }
.sol-day-card { padding: 20px 22px; font-size: 13.5px; color: #cfe0d6; }
.sol-day-card > b { font-family: var(--display); font-size: 13px; color: #fff; display: block; margin-bottom: 12px; }
.sol-day-empty { color: var(--muted); font-size: 13px; }
#sol-day-list { max-height: 300px; overflow-y: auto; }
#sol-day-list::-webkit-scrollbar { width: 6px; }
#sol-day-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
.sol-day-use {
  width: 100%;
  margin-top: 4px;
  background: rgba(0,196,110,.08);
  border: 1px solid rgba(0,196,110,.35);
  border-radius: 8px;
  color: var(--green-bright);
  font-family: var(--display);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .05em;
  text-transform: uppercase;
  padding: 8px;
  cursor: pointer;
}
.sol-day-use:hover { background: rgba(0,196,110,.16); }

/* --- Stepper --- */
.stepper { display: flex; gap: 8px; margin-bottom: 20px; }
.step-dot {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border-radius: 10px;
  border: 1px solid var(--line-2);
  background: var(--card-2);
  color: var(--muted-2);
  font-family: var(--display);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .05em;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
}
.step-dot .num-passo {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--line-2);
  color: #cfe0d6;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  flex-shrink: 0;
}
.step-dot.active { border-color: var(--green); color: var(--green-bright); }
.step-dot.active .num-passo { background: var(--green); color: #0a140d; }
.step-dot.done { color: #cfe0d6; }
.step-dot.done .num-passo { background: rgba(0,196,110,.3); color: var(--green-bright); }

.sla-info {
  background: var(--card-2);
  border: 1px solid var(--line-2);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 24px;
}
.sla-title {
  font-family: var(--display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted-2);
  margin-bottom: 10px;
}
.sla-row {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: #cfe0d6;
  padding: 4px 0;
}
.sla-pill {
  font-family: var(--display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  border-radius: 999px;
  padding: 5px 12px;
  white-space: nowrap;
  flex-shrink: 0;
  min-width: 200px;
  text-align: center;
}
.sla-pill.p45 { background: rgba(0,196,110,.1); border: 1px solid rgba(0,196,110,.35); color: var(--green-bright); }
.sla-pill.p90 { background: rgba(217,101,127,.08); border: 1px solid rgba(217,101,127,.4); color: var(--pink); }

/* --- Campos --- */
.frm-sec {
  font-family: var(--display);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--green);
  border-bottom: 1px solid var(--line-2);
  padding-bottom: 8px;
  margin: 26px 0 18px;
}
.frm-step > .frm-sec:first-child { margin-top: 0; }
.frm-step {
  background: #151f19;
  border: 1px solid var(--line-2);
  border-radius: 14px;
  padding: 24px;
  animation: stepIn .35s ease;
}
@keyframes stepIn {
  from { opacity: 0; transform: translateX(18px); }
  to   { opacity: 1; transform: none; }
}

/* Cada etapa tem um tom próprio — a troca fica evidente */
#frm-step-1 { background: #141f19; border-color: #1d2b25; }
#frm-step-2 { background: #121d20; border-color: #1c3034; }
#frm-step-3 { background: #171b23; border-color: #262e3f; }
body.light #frm-step-1 { background: #f4faf6; border-color: #d9e8de; }
body.light #frm-step-2 { background: #eff7f8; border-color: #d5e7ea; }
body.light #frm-step-3 { background: #f1f2fa; border-color: #dcdff0; }

/* --- Combo com busca (clique abre a lista) --- */
.combo-wrap { position: relative; }
.combo-panel {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  z-index: 700;
  margin-top: 4px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  max-height: 230px;
  overflow-y: auto;
  box-shadow: 0 16px 40px rgba(0,0,0,.45);
}
.combo-panel::-webkit-scrollbar { width: 6px; }
.combo-panel::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
.combo-opt {
  padding: 9px 14px;
  font-size: 13.5px;
  color: #cfe0d6;
  cursor: pointer;
}
.combo-opt:hover { background: rgba(0,196,110,.1); color: var(--green-bright); }
.combo-vazio { padding: 12px 14px; color: var(--muted); font-size: 12.5px; }
body.light .combo-opt { color: #3c4a56; }
body.light .combo-panel { box-shadow: 0 16px 40px rgba(22,35,47,.18); }
.frm-group { margin-bottom: 16px; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.frm-label {
  display: block;
  font-family: var(--display);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--green-bright);
  margin-bottom: 7px;
}
.lbl-obs { color: var(--muted-2); font-weight: 400; text-transform: none; letter-spacing: 0; }
.input {
  width: 100%;
  background: var(--card-2);
  border: 1px solid var(--line-2);
  border-radius: 10px;
  padding: 11px 14px;
  color: #e7edf2;
  font-family: var(--body);
  font-size: 14px;
}
.input:focus { outline: none; border-color: var(--green); }
.input.invalid { border-color: var(--pink); }
select.input { cursor: pointer; }
select.input option, select.input optgroup { background: #101812; color: #e7edf2; }
textarea.input { resize: vertical; min-height: 90px; }
input[type="date"].input, input[type="time"].input { color-scheme: dark; }
.frm-hint { font-size: 12px; color: var(--muted-2); margin-top: 6px; line-height: 1.5; }
.frm-hint b { color: var(--green-bright); font-weight: 600; }

/* --- Botões de tipo --- */
.tipo-btns { display: flex; flex-wrap: wrap; gap: 10px; }
.tipo-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--card-2);
  border: 1px solid var(--line-2);
  border-radius: 12px;
  padding: 11px 18px;
  color: #cfe0d6;
  font-family: var(--display);
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: .05em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .2s;
}
.tipo-btn:hover { border-color: var(--muted); }
.tipo-btn.sel { background: rgba(0,196,110,.14); border-color: var(--green); color: var(--green-bright); }
.tipo-btn .sla-tag { font-size: 10px; color: var(--muted-2); font-weight: 400; letter-spacing: 0; }
.tipo-btn.sel .sla-tag { color: var(--green-bright); opacity: .8; }

/* --- Checkboxes em chips --- */
.chk-group { display: flex; flex-wrap: wrap; gap: 9px; }
.chk-group.invalid {
  border: 1px solid var(--pink);
  border-radius: 12px;
  padding: 8px;
}
.chk {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--card-2);
  border: 1px solid var(--line-2);
  border-radius: 999px;
  padding: 8px 15px;
  color: #cfe0d6;
  font-size: 13px;
  cursor: pointer;
  transition: all .2s;
  user-select: none;
}
.chk input { accent-color: var(--green); cursor: pointer; margin: 0; }
.chk.on { border-color: var(--green); color: var(--green-bright); background: rgba(0,196,110,.08); }

/* --- Responsáveis extras --- */
.resp-row { display: grid; grid-template-columns: 1fr 1fr 38px; gap: 10px; margin-bottom: 10px; }
.resp-row .rm {
  background: none;
  border: 1px solid var(--line-2);
  border-radius: 10px;
  color: var(--muted-2);
  font-size: 16px;
  cursor: pointer;
}
.resp-row .rm:hover { border-color: var(--pink); color: var(--pink); }
.btn-ghost {
  background: none;
  border: 1px dashed var(--line);
  border-radius: 10px;
  color: var(--green-bright);
  font-family: var(--display);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .05em;
  text-transform: uppercase;
  padding: 9px 16px;
  cursor: pointer;
  margin-bottom: 16px;
}
.btn-ghost:hover { border-color: var(--green); }

/* --- Selo de SLA --- */
.sla-badge {
  border-radius: 10px;
  padding: 11px 16px;
  font-size: 13px;
  font-weight: 500;
  margin: -4px 0 16px;
  line-height: 1.5;
}
.sla-badge.ok { background: rgba(0,196,110,.08); border: 1px solid rgba(0,196,110,.35); color: var(--green-bright); }
.sla-badge.bad { background: rgba(217,101,127,.08); border: 1px solid rgba(217,101,127,.4); color: var(--pink); }

/* --- Navegação do formulário --- */
.frm-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 26px; }
.frm-nav .btn { min-width: 150px; }
.frm-nav .btn:only-child { margin-left: auto; }
.frm-erro {
  background: rgba(217,101,127,.08);
  border: 1px solid rgba(217,101,127,.4);
  border-radius: 10px;
  color: var(--pink);
  font-size: 13px;
  padding: 11px 16px;
  margin-top: 18px;
}

/* --- Resumo (confirmação) --- */
.sum-block {
  background: var(--card-2);
  border: 1px solid var(--line-2);
  border-radius: 14px;
  padding: 18px 22px;
  margin-bottom: 14px;
}
.sum-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sum-head h4 {
  font-family: var(--display);
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--green);
}
.sum-head button {
  background: none;
  border: none;
  color: var(--muted-2);
  font-size: 12px;
  cursor: pointer;
  text-decoration: underline;
}
.sum-head button:hover { color: var(--green-bright); }
.sum-item { display: flex; gap: 10px; padding: 4px 0; font-size: 13.5px; }
.sum-item .k { color: var(--muted-2); width: 170px; flex-shrink: 0; }
.sum-item .w { color: #e7edf2; }

/* --- Selo de SLA: aviso âmbar (fora do território) --- */
.sla-badge.warn { background: rgba(240,192,64,.08); border: 1px solid rgba(240,192,64,.45); color: var(--gold); }

/* --- Consulta de status --- */
.top-actions { display: flex; gap: 10px; justify-self: end; align-items: center; }

/* --- Interruptor de idioma PT | EN --- */
.interruptor-idioma {
  display: flex; background: rgba(255,255,255,.06); border: 1px solid var(--line);
  border-radius: 10px; padding: 2px; flex-shrink: 0;
}
.interruptor-idioma button {
  background: none; border: none; border-radius: 8px; padding: 6px 10px;
  font-size: 11.5px; font-weight: 800; letter-spacing: .06em; color: var(--muted-2);
  transition: all .15s; cursor: pointer; font-family: var(--display);
}
.interruptor-idioma button:hover { color: #fff; }
.interruptor-idioma button.ativo {
  background: rgba(0,196,110,.16); color: var(--green-bright);
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
}
body.light .interruptor-idioma { border-color: #2a4358; }
body.light .interruptor-idioma button.ativo { color: #25e07f; }
.consulta-titulo { color: #fff; font-size: 20px; margin-bottom: 10px; font-family: var(--display); }
.consulta-intro { color: var(--muted-2); font-size: 13px; line-height: 1.55; margin: 0 0 16px; }
.consulta-intro b { color: #fff; }
.consulta-busca { display: flex; gap: 10px; margin-bottom: 18px; }
.consulta-busca .btn { flex-shrink: 0; }
.consulta-loading { color: var(--muted-2); font-size: 13px; padding: 14px 0; }
.consulta-vazio {
  background: var(--card-2);
  border: 1px solid var(--line-2);
  border-radius: 10px;
  color: var(--muted);
  font-size: 13px;
  padding: 16px;
  text-align: center;
}
.consulta-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  background: var(--card-2);
  border: 1px solid var(--line-2);
  border-radius: 12px;
  padding: 13px 16px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: border-color .2s;
}
.consulta-item:hover { border-color: var(--green); }
.consulta-item .ci-prot { font-family: var(--display); font-weight: 800; font-size: 15px; color: var(--green-bright); }
.consulta-item .ci-tema { font-size: 13px; color: #fff; margin-top: 2px; }
.consulta-item .ci-meta { font-size: 11.5px; color: var(--muted-2); margin-top: 2px; }
.status-pill {
  display: inline-block;
  font-family: var(--display);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  border-radius: 999px;
  padding: 5px 12px;
  white-space: nowrap;
  border: 1px solid;
}
.consulta-desc {
  border-radius: 10px;
  border: 1px solid;
  padding: 12px 16px;
  font-size: 13px;
  line-height: 1.55;
  margin: 14px 0 16px;
}
.consulta-voltar {
  background: none;
  border: none;
  color: var(--muted-2);
  font-size: 12.5px;
  cursor: pointer;
  text-decoration: underline;
  padding: 0;
  margin-bottom: 12px;
}
.consulta-voltar:hover { color: var(--green-bright); }
.consulta-det-campos { max-height: 320px; overflow-y: auto; padding-right: 6px; }
.consulta-det-campos::-webkit-scrollbar { width: 6px; }
.consulta-det-campos::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

/* --- Sucesso --- */
.sol-success { text-align: center; padding: 30px 10px; }
.protocolo-box {
  display: inline-block;
  background: rgba(0,196,110,.08);
  border: 1px solid rgba(0,196,110,.4);
  border-radius: 12px;
  padding: 12px 28px;
  margin-bottom: 16px;
}
.protocolo-box span {
  display: block;
  font-family: var(--display);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted-2);
  margin-bottom: 4px;
}
.protocolo-box b {
  font-family: var(--display);
  font-size: 28px;
  font-weight: 800;
  letter-spacing: .06em;
  color: var(--green-bright);
}
.sol-success .ok-ic {
  width: 64px; height: 64px;
  margin: 0 auto 18px;
  border-radius: 50%;
  background: rgba(0,196,110,.12);
  border: 2px solid var(--green);
  color: var(--green-bright);
  font-size: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.sol-success h3 { color: #fff; font-size: 22px; margin-bottom: 10px; }
.sol-success p { color: var(--muted-2); font-size: 14px; max-width: 400px; margin: 0 auto 24px; line-height: 1.6; }

/* ============================================================
   TEMA CLARO — hierarquia: fundo paper, cartões brancos,
   texto ink/navy, verde como acento (tons escurecidos p/ texto).
   O cabeçalho e os heros continuam escuros (momentos de marca,
   preservam a logo branca e o contraste).
   ============================================================ */
body.light {
  --card: #ffffff;
  --card-2: #f4f6f7;
  --line: #e0e4e7;
  --line-2: #e6eae8;
  --muted: #5d6b77;
  --muted-2: #8b97a1;
  --green-bright: #0a8a51; /* acento de TEXTO escurecido p/ contraste no claro */
  --gold: #a07514;
  background: #f4f6f7;
  color: #14202b;
}
body.light main { background: #f4f6f7; }

/* Cabeçalho permanece escuro (logo branca) — só o painel do menu clareia */
body.light .nav-panel { background: #16232f; border-color: #2a4358; }

/* Heros: mantêm o mundo escuro, mas com fechamento SÓLIDO (sem fade cinza) */
body.light .home-hero,
body.light .sol-hero {
  background: radial-gradient(130% 120% at 22% 12%, #0e3a26 0%, #0c1f15 55%, #0a1a13 100%);
}
body.light #calendario.fold { background: transparent; }

/* Controles sobre superfícies escuras (topbar e heros) seguem com verde claro */
body.light .topbar .btn-outline,
body.light .home-hero .btn-outline {
  color: #25e07f;
  border-color: var(--green);
}
body.light .topbar .btn-outline:hover,
body.light .home-hero .btn-outline:hover { background: rgba(0,196,110,.14); }
body.light .footer { background: #16232f; }

body.light h2, body.light h3, body.light h4 { color: #16232f; }
body.light .sec-head h2 { color: #16232f; }
body.light .sec-head { border-bottom-color: var(--line); }

/* Calendário */
body.light .cal-head h4 { color: #16232f; }
body.light .cal-nav { color: #16232f; border-color: var(--line); }
body.light .cal-grid .day { color: #14202b; }
body.light .cal-grid .day:hover { background: rgba(22,35,47,.06); }
body.light .cal-grid .day.today { background: rgba(22,35,47,.12); color: #14202b; }
body.light .cal-grid .day.selected { background: var(--green); color: #0a140d; }
body.light .day-panel h4 { color: #16232f; }
body.light .mini-event .t { color: #16232f; }
body.light .cal-cat { color: #3c4a56; }
body.light .chk { color: #3c4a56; }

/* Indicadores */
body.light .stat-card {
  background: #ffffff;
  border: 1.5px solid #dfe5e2;
}
body.light .stat-card .l { color: #16232f; }
body.light .stat-card .v {
  background: linear-gradient(180deg, #18c06a, #0a8048 55%, #053c24);
  -webkit-background-clip: text;
  background-clip: text;
}
body.light .type-card .tv { color: #16232f; }
body.light .type-card .th { color: #3c4a56; }

/* Lista de eventos e filtros */
body.light .event-row h4 { color: #16232f; }
body.light .filter-btn { color: #3c4a56; }
body.light .filter-panel { box-shadow: 0 16px 40px rgba(22,35,47,.15); }
body.light .filter-opt { color: #3c4a56; }

/* Mapa */
body.light #map .state .shape { fill: #e3e8e5; stroke: #cfd5da; }
body.light #map .state .icon_state { fill: #d6dcd9; }
body.light #map .state .label_icon_state { fill: #5d6b77; }
body.light #map .state .label_state { fill: #16232f; }

var IDIOMA = 'pt';

function t(chave) {
  var v = (TEXTOS[IDIOMA] || TEXTOS.pt)[chave];
  if (v === undefined) v = TEXTOS.pt[chave];
  return v === undefined ? '' : v;
}

/** Locale ativo, para ordenação e formatação. */
function localeAtivo() { return IDIOMA === 'pt' ? 'pt-BR' : 'en-US'; }

/** Data ISO (AAAA-MM-DD) no formato do idioma: PT DD/MM/AAAA · EN MM/DD/AAAA. */
function fmtDataISO(iso) {
  if (!iso) return '';
  var p = String(iso).split('-');
  if (p.length !== 3) return String(iso);
  return IDIOMA === 'pt' ? p[2] + '/' + p[1] + '/' + p[0] : p[1] + '/' + p[2] + '/' + p[0];
}

/** Data já em DD/MM/AAAA (formato de armazenamento) exibida no idioma ativo. */
function fmtDataBR(br) {
  if (!br) return '';
  var p = String(br).split('/');
  if (p.length !== 3) return String(br);
  return IDIOMA === 'pt' ? br : p[1] + '/' + p[0] + '/' + p[2];
}

/** Dia e mês (sem ano) no formato do idioma. */
function fmtDiaMes(dia, mes) {
  return IDIOMA === 'pt' ? dia + '/' + mes : mes + '/' + dia;
}

// Valor canônico usado quando o registro não traz unidade/BU
var SEM_INFO = '(sem informação)';

// BUs do formulário: nomes próprios fictícios (não traduzidos) + a opção coringa
var BUS_SOL = [
  { v: 'BU Alfa' }, { v: 'BU Beta' }, { v: 'BU Gama' }, { v: 'BU Delta' },
  { v: 'A definir', chave: 'opcaoADefinir' }
];

/** Título exibido do evento — nomes fictícios e feriados vêm do dicionário. */
function tituloEvento(e) {
  if (!e) return '';
  if (e.chaveTitulo) return t(e.chaveTitulo);
  if (typeof e.nomeIdx === 'number') {
    var lista = (t('nomesEventos') || {})[e.type];
    if (lista && lista[e.nomeIdx]) return lista[e.nomeIdx] + (e.sufixo || '');
  }
  return e.title || '';
}

/** Campos exibidos no detalhe de uma solicitação demonstrativa. */
function camposSolicitacao(s) {
  return [
    [t('campoProtocolo'), s.protocolo],
    [t('campoEnviadoEm'), fmtDataHoraBR(s.enviadoEm)],
    [t('campoStatus'), rotuloStatus(s.status)],
    [t('campoSolicitante'), s.solicitante],
    [t('campoEmail'), s.email],
    [t('campoUnidade'), s.unidade],
    [t('resumoTipo'), t(s.chaveTipo)],
    [t('campoBU'), s.bu],
    [t('campoTema'), s.chaveTema ? t(s.chaveTema) : ''],
    [t('campoDataSugerida'), fmtDataBR(s.dataSugerida)],
    [t('campoHorario'), s.horario],
    [t('campoEstado'), s.estado],
    [t('campoCidade'), s.cidade],
    [t('campoParticipantes'), s.participantes],
    [t('campoCusto'), fmtValorDemo(s.custo)]
  ];
}

/** Valor em reais gravado como "R$ 8.000,00" exibido conforme o idioma. */
function fmtValorDemo(v) {
  if (!v || IDIOMA === 'pt') return v || '';
  return v.replace(/\./g, '\u0000').replace(/,/g, '.').replace(/\u0000/g, ',');
}

/** Data com hora ("DD/MM/AAAA HH:MM") exibida no idioma ativo. */
function fmtDataHoraBR(v) {
  if (!v) return '';
  var partes = String(v).split(' ');
  return (fmtDataBR(partes[0]) + ' ' + (partes[1] || '')).trim();
}

/* ---------------- CARGA DE DADOS ---------------- */

function loadData() {
  document.getElementById('loading').classList.remove('hidden');

    .withSuccessHandler(onData)
    .withFailureHandler(onError)
    .getEvents();
}

function onData(evts) {
  EVENTS = evts || [];

}

function onError(err) {
  document.getElementById('loading').classList.add('hidden');

    String(err && err.message ? err.message : err)) + '</div>';

/* ---------------- HELPERS ---------------- */

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function isEvento(e) { return NAO_EVENTO.indexOf(e.type) === -1; }

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth()+1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}

function badgeClass(type) {
  switch (type) {
    case 'EVENTO TIPO 1': return 'b-tipo1';
    case 'EVENTO TIPO 2': return 'b-tipo2';
    case 'EVENTO TIPO 3': return 'b-tipo3';
    case 'NACIONAL':      return 'b-nacional';
    case 'REGIONAL':      return 'b-regional';
    case 'WEBINAR':       return 'b-proprio';
    case 'FERIADO':       return 'b-feriado';
    default:              return 'b-outros';
  }
}

var DOT_COLORS = {
  'EVENTO TIPO 1': '#58c2cf', 'EVENTO TIPO 2': '#6cf396', 'EVENTO TIPO 3': '#25e07f',
  'NACIONAL': '#c267cc', 'REGIONAL': '#a3c2dc', 'WEBINAR': '#f0c040'
};

// Chave de tradução de cada categoria (o valor bruto é dado, o rótulo é traduzido)
var CAT_CHAVES = {
  'EVENTO TIPO 1': 'catTipo1', 'EVENTO TIPO 2': 'catTipo2', 'EVENTO TIPO 3': 'catTipo3',
  'NACIONAL': 'catNacional', 'REGIONAL': 'catRegional', 'WEBINAR': 'catWebinar',
  'FERIADO': 'catFeriado'
};

/** Rótulo traduzido de uma categoria de evento. */
function rotuloCat(tipo) {
  var c = CAT_CHAVES[tipo];
  return c ? t(c) : tipo;
}

function firstDate(e) { return e.dates && e.dates.length ? e.dates.slice().sort()[0] : null; }

function dateBlock(e) {
  var f = firstDate(e);
  if (!f) return { d: '—', m: '' };
  var p = f.split('-');
  return { d: p[2], m: mesesAbrev()[parseInt(p[1], 10) - 1] };
}

/* ---------------- CALENDÁRIO ---------------- */

function mudarMes(delta) {
  calMonth += delta;
  if (calMonth < 0)  { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0;  calYear++; }
  selectedDay = null;
  renderCalendar();
  renderDayPanel();
}

function renderCalendar() {
  document.getElementById('cal-title').textContent = mesesNome()[calMonth] + ' ' + calYear;

  var grid = document.getElementById('cal-grid');
  var html = '';
  var wds = t('diasSemanaAbrev');
  for (var w = 0; w < 7; w++) html += '<div class="wd">' + wds[w] + '</div>';

  var firstDow = new Date(calYear, calMonth, 1).getDay();
  var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  var hoje = todayStr();

  for (var i = 0; i < firstDow; i++) html += '<div></div>';

  for (var d = 1; d <= daysInMonth; d++) {
    var dateStr = calYear + '-' + ('0' + (calMonth+1)).slice(-2) + '-' + ('0' + d).slice(-2);
    var dayEvents = EVENTS.filter(function (e) { return e.dates.indexOf(dateStr) !== -1; });
    var cls = 'day';
    var estilo = '';

    if (activeCat) {
      // Modo filtro: destaca só os dias com a categoria escolhida, na cor dela
      var temCat = dayEvents.some(function (e) { return e.type === activeCat; });
      if (dateStr === selectedDay) cls += ' selected';
      else if (temCat) {
        var cor = DOT_COLORS[activeCat] || '#8b97a1';
        estilo = 'background:' + hexToRgba(cor, 0.14) + ';border-color:' + cor + ';color:' + corTexto(cor) + ';font-weight:600';
      }
      else if (dayEvents.some(function (e) { return e.type === 'FERIADO'; })) cls += ' holiday';
      else if (dateStr === hoje) cls += ' today';
    } else {
      if (dayEvents.some(function (e) { return e.type === 'FERIADO'; })) cls += ' holiday';
      if (dayEvents.some(isEvento)) cls += ' has-event';
      if (dateStr === hoje) cls += ' today';
      if (dateStr === selectedDay) cls += ' selected';
    }

    var titles = dayEvents.map(function (e) { return tituloEvento(e); }).join(', ');
    html += '<div class="' + cls + '"' + (estilo ? ' style="' + estilo + '"' : '') +
      ' title="' + escapeHtml(titles) + '" onclick="selecionarDia(\'' + dateStr + '\')">' + d + '</div>';
  }
  grid.innerHTML = html;
}

function selecionarDia(dateStr) {
  selectedDay = (selectedDay === dateStr) ? null : dateStr;
  renderCalendar();
  renderDayPanel();
}

function limparDia() {
  selectedDay = null;
  renderCalendar();
  renderDayPanel();
}

function renderDayPanel() {
  var panel = document.getElementById('day-panel');
  var mesPrefix = calYear + '-' + ('0' + (calMonth + 1)).slice(-2);
  var mesLabel = t('mesAno')(mesesNome()[calMonth], calYear);
  var corCat = activeCat ? (DOT_COLORS[activeCat] || '#8b97a1') : null;
  var html, evts;

  if (selectedDay) {
    // ----- Eventos do dia selecionado (respeita o filtro de categoria) -----
    evts = EVENTS.filter(function (e) { return e.dates.indexOf(selectedDay) !== -1; });
    if (activeCat) evts = evts.filter(function (e) { return e.type === activeCat; });

    html = '<h4><button class="clear-day" onclick="limparDia()">' + escapeHtml(t('btnLimpar')) + '</button>' +
           t('eventosEmData')(fmtDataISO(selectedDay)) + '</h4>';

    if (!evts.length) {
      var catHtml = activeCat ? '<b style="color:' + corCat + '">' + escapeHtml(rotuloCat(activeCat)) + '</b>' : '';
      html += '<div class="mini-event" style="cursor:default;color:var(--muted)">' +
        t('nenhumEventoDia')(catHtml) + '</div>';
    } else {
      evts.forEach(function (e) {
        var idx = EVENTS.indexOf(e);
        html += '<div class="mini-event" onclick="abrirModal(' + idx + ')">' +
          '<div class="t">' + escapeHtml(tituloEvento(e)) + '</div>' +
          '<div class="m">' + escapeHtml([e.city, e.unit].filter(Boolean).join(' · ') || e.type) + '</div>' +
          '<span class="badge ' + badgeClass(e.type) + '" style="margin-top:8px">' + escapeHtml(rotuloCat(e.type)) + '</span>' +
          '</div>';
      });
    }
    panel.innerHTML = html;
    return;
  }

  // ----- Sem dia selecionado: eventos do mês (da categoria, se filtrada) -----
  evts = EVENTS.filter(isEvento).filter(function (e) {
    return e.dates.some(function (d) { return d.indexOf(mesPrefix) === 0; });
  });
  if (activeCat) evts = evts.filter(function (e) { return e.type === activeCat; });
  evts.sort(function (a, b) {
    return String(firstDate(a) || '9999').localeCompare(String(firstDate(b) || '9999'));
  });

  if (activeCat) {
    html = '<h4>' + t('eventosDaCatNoMes')('<span style="color:' + corCat + '">' +
           escapeHtml(rotuloCat(activeCat)) + '</span>', mesLabel) + '</h4>';
  } else {
    html = '<h4>' + escapeHtml(t('eventosDoMes')(mesLabel)) + '</h4>';
  }

  if (!evts.length) {
    html += '<div class="mini-event" style="cursor:default;color:var(--muted)">' +
      escapeHtml(t('nenhumEventoMes')(!!activeCat)) + '</div>';
  } else {
    evts.forEach(function (e) {
      var idx = EVENTS.indexOf(e);
      var diaMes = '';
      for (var i = 0; i < e.dates.length; i++) {
        if (e.dates[i].indexOf(mesPrefix) === 0) { var dp = e.dates[i].split('-'); diaMes = fmtDiaMes(dp[2], dp[1]); break; }
      }
      html += '<div class="mini-event" onclick="abrirModal(' + idx + ')">' +
        '<div class="t">' + escapeHtml(tituloEvento(e)) + '</div>' +
        '<div class="m">' + escapeHtml([diaMes, e.city, e.unit].filter(Boolean).join(' · ')) + '</div>' +
        '<span class="badge ' + badgeClass(e.type) + '" style="margin-top:8px">' + escapeHtml(rotuloCat(e.type)) + '</span>' +
        '</div>';
    });
  }
  panel.innerHTML = html;
}

function hexToRgba(hex, a) {
  var n = parseInt(hex.replace('#', ''), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

// Ordem preferida da quebra por tipo; tipos novos da base entram no fim
var TIPOS_ORDEM = ['EVENTO TIPO 1', 'EVENTO TIPO 2', 'EVENTO TIPO 3', 'NACIONAL', 'REGIONAL', 'WEBINAR'];

/* --- Contagem animada dos números --- */

var statsVistos = false;

function animarNumero(elm, fim, dur) {
  if (!elm) return;
  var inicio = null;
  function frame(t) {
    if (inicio === null) inicio = t;
    var p = Math.min(1, (t - inicio) / dur);
    var suave = 1 - Math.pow(1 - p, 3); // ease-out
    elm.textContent = Math.round(fim * suave);
    if (p < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function setStat(id, valor) {
  var e = document.getElementById(id);
  e.dataset.alvo = valor;
  if (statsVistos) animarNumero(e, valor, 800);
  else e.textContent = '0';
}

function animarStats() {
  ['stat-total', 'stat-done', 'stat-upcoming', 'stat-units'].forEach(function (id) {
    var e = document.getElementById(id);
    animarNumero(e, parseInt(e.dataset.alvo || '0', 10), 900);
  });
}

function initStatsAnim() {
  var grid = document.querySelector('.stats-grid');
  if (!grid) return;
  if ('IntersectionObserver' in window) {
    var obs = new IntersectionObserver(function (entradas) {
      if (entradas[0].isIntersecting) {
        statsVistos = true;
        animarStats();
        obs.disconnect();
      }
    }, { threshold: 0.3 });
    obs.observe(grid);
  } else {
    statsVistos = true;
  }
  // Passar o mouse reanima a contagem do card
  document.querySelectorAll('.stat-card').forEach(function (card) {
    card.addEventListener('mouseenter', function () {
      var v = card.querySelector('.v');
      if (v && v.dataset.alvo) animarNumero(v, parseInt(v.dataset.alvo, 10), 800);
    });
  });
}

function lastDate(e) {
  return e.dates && e.dates.length ? e.dates.slice().sort()[e.dates.length - 1] : null;
}

function renderStats() {
  var eventos = EVENTS.filter(isEvento);
  var hoje = todayStr();

  // Realizados = última data já passou; sem data legível conta como previsto
  var realizados = eventos.filter(function (e) {
    var ult = lastDate(e);
    return ult && ult < hoje;
  });
  var previstos = eventos.filter(function (e) {
    var ult = lastDate(e);
    return !ult || ult >= hoje;
  });

  var unidades = {};
  eventos.forEach(function (e) { if (e.unit) unidades[e.unit] = true; });

  setStat('stat-total', eventos.length);
  setStat('stat-done', realizados.length);
  setStat('stat-upcoming', previstos.length);
  setStat('stat-units', Object.keys(unidades).length);

  var pct = eventos.length ? Math.round(realizados.length / eventos.length * 100) : 0;
  document.getElementById('stat-done-pct').textContent = t('pctAnoConcluido')(pct);

  // Próximo evento: menor primeira data a partir de hoje (ou em andamento)
  var proximo = null, menorData = null;
  previstos.forEach(function (e) {
    var ini = firstDate(e);
    if (!ini) return;
    var ref = ini >= hoje ? ini : hoje; // em andamento conta como hoje
    if (menorData === null || ref < menorData) { menorData = ref; proximo = e; }
  });
  var elNext = document.getElementById('stat-next');
  if (proximo) {
    var dias = Math.round((new Date(menorData + 'T00:00:00') - new Date(hoje + 'T00:00:00')) / 864e5);
    elNext.textContent = t('proximoEvento')(tituloEvento(proximo), dias);
    elNext.title = t('cliqueTextoCompleto');
    // Clique alterna entre texto cortado e completo
    elNext.classList.add('clicavel');
    elNext.onclick = function () { this.classList.toggle('expandido'); };
  } else {
    elNext.textContent = t('nenhumEventoPrevisto');
    elNext.classList.remove('clicavel', 'expandido');
    elNext.onclick = null;
  }

  renderTypeBreakdown(eventos, hoje);

/** Quebra por tipo — só renderiza categorias com pelo menos 1 evento na base. */
function renderTypeBreakdown(eventos, hoje) {
  var wrap = document.getElementById('stats-types');
  if (!wrap) return;

  var porTipo = {};
  eventos.forEach(function (e) {
    (porTipo[e.type] = porTipo[e.type] || []).push(e);
  });

  var tipos = TIPOS_ORDEM.filter(function (x) { return porTipo[x]; });
  Object.keys(porTipo).sort().forEach(function (x) {
    if (tipos.indexOf(x) === -1) tipos.push(x); // tipos novos da base
  });

  wrap.innerHTML = tipos.map(function (tipo) {
    var lista = porTipo[tipo];
    var feitos = lista.filter(function (e) {
      var ult = lastDate(e);
      return ult && ult < hoje;
    }).length;
    var cor = DOT_COLORS[tipo] || '#f0c040';
    var pctBar = Math.round(feitos / lista.length * 100);
    return '<div class="type-card">' +
      '<div class="th"><span class="dot" style="background:' + cor + '"></span>' + escapeHtml(rotuloCat(tipo)) + '</div>' +
      '<div class="tv">' + lista.length + '</div>' +
      '<div class="bar"><i style="width:' + pctBar + '%;background:' + cor + '"></i></div>' +
      '<div class="ts">' + escapeHtml(t('realizadosPrevistos')(feitos, lista.length - feitos)) + '</div>' +
      '</div>';
  }).join('');
}

/* ---------------- FILTROS ---------------- */

function buildFilters() {
  var eventos = EVENTS.filter(isEvento);

  var unidades = [];
  var bus = [];
  eventos.forEach(function (e) {
    var u = e.unit || SEM_INFO;
    var b = e.bu || SEM_INFO;
    if (unidades.indexOf(u) === -1) unidades.push(u);
    if (bus.indexOf(b) === -1) bus.push(b);
  });
  var loc = localeAtivo();
  unidades.sort(function (a, b) { return a.localeCompare(b, loc); });
  bus.sort(function (a, b) { return a.localeCompare(b, loc); });

  var tipos = TIPOS_FILTRO.filter(function (x) {
    return eventos.some(function (e) { return e.type === x; });
  });

  var rotuloValor = function (v) { return v === SEM_INFO ? t('naoInformada') : v; };
  var defs = {
    periodo: mesesNome().map(function (n, i) { return { value: String(i + 1), label: n }; }),
    tipo:    tipos.map(function (x) { return { value: x, label: rotuloCat(x) }; }),
    unidade: unidades.map(function (u) { return { value: u, label: rotuloValor(u) }; }),
    bu:      bus.map(function (b) { return { value: b, label: rotuloValor(b) }; })
  };

  Object.keys(defs).forEach(function (key) {
    var wrap = document.querySelector('.filter[data-key="' + key + '"]');
    var panel = wrap.querySelector('.filter-panel');
    filters[key] = new Set(defs[key].map(function (o) { return o.value; }));

    var html = '<div class="filter-actions">' +
      '<button onclick="filterAll(\'' + key + '\', true)">' + escapeHtml(t('selecionarTodos')) + '</button>' +
      '<button onclick="filterAll(\'' + key + '\', false)">' + escapeHtml(t('desmarcarTodos')) + '</button>' +
      '</div>';
    defs[key].forEach(function (o) {
      html += '<label class="filter-opt">' +
        '<input type="checkbox" checked value="' + escapeHtml(o.value) + '" ' +
        'onchange="filterChange(\'' + key + '\', this)">' +
        '<span>' + escapeHtml(o.label) + '</span></label>';
    });
    panel.innerHTML = html;
    updateFilterCount(key);
  });
}

function toggleFilter(btn) {
  var wrap = btn.closest('.filter');
  var wasOpen = wrap.classList.contains('open');
  document.querySelectorAll('.filter.open').forEach(function (f) { f.classList.remove('open'); });
  if (!wasOpen) wrap.classList.add('open');
}

// Fecha dropdowns ao clicar fora
document.addEventListener('click', function (ev) {
  if (!ev.target.closest('.filter')) {
    document.querySelectorAll('.filter.open').forEach(function (f) { f.classList.remove('open'); });
  }
});

function filterChange(key, input) {
  if (input.checked) filters[key].add(input.value);
  else filters[key].delete(input.value);
  updateFilterCount(key);
  renderEventsList();
}

function filterAll(key, marcar) {
  var wrap = document.querySelector('.filter[data-key="' + key + '"]');
  wrap.querySelectorAll('.filter-opt input').forEach(function (input) {
    input.checked = marcar;
    if (marcar) filters[key].add(input.value);
    else filters[key].delete(input.value);
  });
  updateFilterCount(key);
  renderEventsList();
}

function updateFilterCount(key) {
  var wrap = document.querySelector('.filter[data-key="' + key + '"]');
  var total = wrap.querySelectorAll('.filter-opt input').length;
  var sel = filters[key].size;
  wrap.querySelector('.fcount').textContent = sel === total ? t('todosSel') : '(' + sel + '/' + total + ')';
}

/* ---------------- TODOS OS EVENTOS ---------------- */

function filtrarEventos() {
  return EVENTS.filter(isEvento).filter(function (e) {
    // Tipo
    if (!filters.tipo.has(e.type)) return false;
    // Unidade
    if (!filters.unidade.has(e.unit || SEM_INFO)) return false;
    // BU
    if (!filters.bu.has(e.bu || SEM_INFO)) return false;
    // Período (mês de qualquer data do evento)
    if (e.dates.length) {
      var meses = e.dates.map(function (d) { return String(parseInt(d.split('-')[1], 10)); });
      if (!meses.some(function (m) { return filters.periodo.has(m); })) return false;
    } else if (filters.periodo.size !== 12) {
      return false; // sem data legível: só aparece com todos os meses marcados
    }
    return true;
  });
}

function renderEventsList() {
  var list = document.getElementById('events-list');
  var evts = filtrarEventos().sort(function (a, b) {
    return String(firstDate(a) || '9999').localeCompare(String(firstDate(b) || '9999'));

  document.getElementById('events-count').textContent = t('nEventosEncontrados')(evts.length);

  if (!evts.length) {
    list.innerHTML = '<div class="events-empty">' + escapeHtml(t('semEventosFiltro')) + '</div>';

  list.innerHTML = evts.map(function (e) {

        '<div style="min-width:0"><h4>' + escapeHtml(tituloEvento(e)) + '</h4>' +

}

var selectedUF = null;

function normalizarCidade(c) {
  return String(c).toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/\s+/g, ' ').trim();
}

function ufDoEvento(e) {
  if (!e.city) return null;
  var c = normalizarCidade(e.city);
  if (c === 'nacional') return null;
  // UF explícita no texto: "Anápolis - GO", "Bento Gonçalves/ RS"
  var m = c.match(/[\/\-]\s*([a-z]{2})\s*$/);
  if (m && UF_NOMES[m[1]]) return m[1];
  c = c.replace(/\s*[\/\-]\s*[a-z]{2}\s*$/, '').trim();
  return CIDADE_UF[c] || null;
}

function escurecerCor(hex, fator) {
  var n = parseInt(hex.replace('#', ''), 16);
  var r = Math.round(((n >> 16) & 255) * (1 - fator));
  var g = Math.round(((n >> 8) & 255) * (1 - fator));
  var b = Math.round((n & 255) * (1 - fator));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/** Cor para TEXTO: no tema claro devolve a versão escurecida (contraste). */
function corTexto(hex) { return temaClaro() ? escurecerCor(hex, 0.45) : hex; }

/** Traduz para exibição uma lista de valores canônicos separados por vírgula. */

// Opções atuais dos combos (clique abre a lista; digitação filtra)
var OPCOES_UNIDADES = [];
var OPCOES_CIDADES = [];

function buildUnidadeSelect(sugeridas) {
  // Sugeridas da região vêm primeiro; depois Filiais, BPs e demais (ordem alfabética).
  var lista = [];
  (sugeridas || []).forEach(function (u) { if (lista.indexOf(u) === -1) lista.push(u); });
  UNIDADES_FILIAIS.concat(UNIDADES_BPS, UNIDADES_OUTRAS).forEach(function (u) {
    if (lista.indexOf(u) === -1) lista.push(u);
  });
  OPCOES_UNIDADES = lista;
}

/**
 * Combo com busca: abre a lista completa no clique/foco e filtra ao digitar.
 * fonte() devolve as opções do momento; aoMudar roda após escolher/alterar.
 */
function initCombo(inputId, fonte, aoMudar, msgVazio) {
  var input = el(inputId);
  if (!input) return;
  var wrap = input.parentElement;
  wrap.classList.add('combo-wrap');
  var painel = document.createElement('div');
  painel.className = 'combo-panel hidden';
  wrap.appendChild(painel);

  function render() {
    var termo = normalizarCidade(input.value);
    var opcoes = fonte() || [];
    var lista = opcoes.filter(function (o) {
      return !termo || normalizarCidade(o).indexOf(termo) !== -1;
    }).slice(0, 300);
    if (!lista.length) {
      painel.innerHTML = '<div class="combo-vazio">' +
        escapeHtml(opcoes.length ? t('comboSemResultado') : (msgVazio ? t(msgVazio) : t('comboSemOpcoes'))) + '</div>';
      return;
    }
    painel.innerHTML = lista.map(function (o) {
      return '<div class="combo-opt">' + escapeHtml(o) + '</div>';
    }).join('');
  }

  function abrir() { render(); painel.classList.remove('hidden'); }
  function fechar() { painel.classList.add('hidden'); }

  input.addEventListener('focus', abrir);
  input.addEventListener('click', abrir);
  input.addEventListener('input', function () { abrir(); if (aoMudar) aoMudar(); });
  input.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' || ev.key === 'Tab') fechar(); });
  input.addEventListener('blur', function () {
    setTimeout(function () { fechar(); if (aoMudar) aoMudar(); }, 150);
  });
  painel.addEventListener('mousedown', function (ev) {
    var opt = ev.target.closest('.combo-opt');
    if (!opt) return;
    ev.preventDefault(); // não deixa o blur atropelar a escolha
    input.value = opt.textContent;
    fechar();
    if (aoMudar) aoMudar();
  });
}

/** Devolve o nome oficial da unidade se o texto digitado corresponder a uma da lista. */
function unidadeOficial(texto) {
  if (!texto) return null;
  var alvo = normalizarCidade(texto);
  var todas = UNIDADES_FILIAIS.concat(UNIDADES_BPS, UNIDADES_OUTRAS);
  for (var i = 0; i < todas.length; i++) {
    if (normalizarCidade(todas[i]) === alvo) return todas[i];
  }
  return null;
}

function buildEstadoSelect() {
  var sel = el('f-estado');
  var atual = sel.value;
  var unidade = el('f-unidade').value;
  var loc = localeAtivo();
  var siglas = Object.keys(UF_NOMES).sort(function (a, b) {
    return UF_NOMES[a].localeCompare(UF_NOMES[b], loc);
  });
  var territorio = (unidade && TERR.ufsPorUnidade[unidade]) ? Object.keys(TERR.ufsPorUnidade[unidade]) : [];
  territorio.sort(function (a, b) { return UF_NOMES[a].localeCompare(UF_NOMES[b], loc); });

  var opt = function (s) { return '<option value="' + s + '">' + UF_NOMES[s] + '</option>'; };
  var html = '<option value="">' + escapeHtml(t('optSelecione')) + '</option>';
  if (territorio.length) {
    html += '<optgroup label="' + escapeHtml(t('optgTerritorio')) + '">' + territorio.map(opt).join('') + '</optgroup>';
    html += '<optgroup label="' + escapeHtml(t('optgOutros')) + '">' + siglas.filter(function (s) {
      return territorio.indexOf(s) === -1;
    }).map(opt).join('') + '</optgroup>';
  } else {
    html += siglas.map(opt).join('');
  }
  sel.innerHTML = html;
  if (atual) sel.value = atual;
  // Território com um único estado e nada escolhido → já sugere preenchido
  if (!sel.value && territorio.length === 1) {
    sel.value = territorio[0];
    estadoMudou();
  }
}

/* ---------------- Interações preditivas (nada bloqueia) ---------------- */

function unidadeMudou() {
  var campo = el('f-unidade');
  var oficial = unidadeOficial(campo.value);
  if (oficial) campo.value = oficial; // ajusta para a grafia oficial da lista
  var unidade = oficial || '';

      .sort(function (a, b) { return a.localeCompare(b, localeAtivo()); });
    hint.innerHTML = t('hintTerritorio')(escapeHtml(nomes.join(', ')));
    hint.classList.remove('hidden');

    hint.classList.add('hidden');
  }
  buildEstadoSelect();

function estadoMudou() {

function buildCidadeDatalist() {

  doTerritorio.forEach(function (c) { if (!vistos[c]) { vistos[c] = 1; lista.push(c); } });
  todas.forEach(function (c) { if (!vistos[c]) { vistos[c] = 1; lista.push(c); } });

}

function sugerirUnidades() {
  var uf = el('f-estado').value;
  var cidade = el('f-cidade').value.trim();
  var hint = el('cidade-hint');

  if (uf && cidade) {
    unidades = TERR.grupoPorCidade[uf + '|' + cidade.toLowerCase()] || [];
  }
  if (unidades.length) {
    hint.innerHTML = t('hintUnidadesRegiao')(escapeHtml(unidades.join(', ')));
    hint.classList.remove('hidden');
  } else if (uf && cidade) {
    hint.innerHTML = escapeHtml(t('hintAreaLivre'));
    hint.classList.remove('hidden');
  } else {
    hint.classList.add('hidden');
  }
  // Reordena o select de unidade com as sugeridas no topo (sem travar nada)
  if (!el('f-unidade').value) buildUnidadeSelect(unidades);
}

/* ---------------- Máscara de moeda (R$ 1.234,56) ---------------- */

function mascaraMoeda(input) {
  var digitos = input.value.replace(/\D/g, '');
  if (!digitos) { input.value = ''; return; }
  digitos = digitos.replace(/^0+(?=\d)/, '');
  while (digitos.length < 3) digitos = '0' + digitos;
  // A moeda continua sendo o real; só os separadores seguem o idioma
  var milhar = IDIOMA === 'pt' ? '.' : ',';
  var decimal = IDIOMA === 'pt' ? ',' : '.';
  var centavos = digitos.slice(-2);
  var inteiro = digitos.slice(0, -2).replace(/\B(?=(\d{3})+(?!\d))/g, milhar);
  input.value = 'R$ ' + inteiro + decimal + centavos;
}

/* ---------------- SLA (apenas aviso — não bloqueia) ---------------- */

function calcSLA() {
  var data = el('f-data').value;
  if (!solTipo || !data) return null;
  var hoje = new Date(todayStr() + 'T00:00:00');
  var alvo = new Date(data + 'T00:00:00');
  var dias = Math.round((alvo - hoje) / 864e5);
  var porte = solTipo.porte;
  var porteLabel = porte === 45 ? t('porte45') : t('porte90');
  var rotuloTipo = t(solTipo.chave);
  return {
    dias: dias,
    dentro: dias >= porte,
    texto: dias >= porte
      ? t('slaDentro')(dias, rotuloTipo, porteLabel)
      : t('slaFora')(dias, rotuloTipo, porte, porteLabel),
    situacao: t('slaSituacao')(dias >= porte, porteLabel)
  };
}

function atualizarSLA() {
  var badge = el('sla-badge');
  var sla = calcSLA();
  if (!sla) { badge.classList.add('hidden'); return; }
  badge.textContent = sla.texto;
  badge.classList.remove('hidden');
  badge.classList.toggle('ok', sla.dentro);
  badge.classList.toggle('bad', !sla.dentro);
  // Calendário lateral acompanha a data escolhida
  var data = el('f-data').value;
  if (data) {
    var p = data.split('-');
    solYear = parseInt(p[0], 10);
    solMonth = parseInt(p[1], 10) - 1;
    solSelectedDay = data;
    renderSolCal();
    listarDiaSol();
  }
}

/* ---------------- Etapas ---------------- */

function marcarInvalido(id, invalido) {
  el(id).classList.toggle('invalid', invalido);
  return invalido;
}

function grupoInvalido(idGrupo, invalido) {
  el(idGrupo).classList.toggle('invalid', invalido);
  return invalido;
}

function validarEtapa(n) {
  var erros = [];
  if (n === 1) {
    if (marcarInvalido('f-nome', !el('f-nome').value.trim())) erros.push(t('campoNomeSolicitante'));
    if (marcarInvalido('f-email', !/^\S+@\S+\.\S+$/.test(el('f-email').value.trim()))) erros.push(t('campoEmailValido'));
    if (marcarInvalido('f-unidade', !unidadeOficial(el('f-unidade').value))) erros.push(t('campoUnidadeLista'));
    if (!solTipo) erros.push(t('campoTipoEvento'));
    if (solTipo && solTipo.v === 'Outro' && marcarInvalido('f-tipo-outro', !el('f-tipo-outro').value.trim())) erros.push(t('campoTipoOutroDesc'));
    if (grupoInvalido('obj-group', !valoresChk('obj-group', 'f-obj-outro'))) erros.push(t('campoObjetivos'));
    if (marcarInvalido('f-bu', !el('f-bu').value)) erros.push(t('campoBUMin'));
    if (grupoInvalido('prod-group', !valoresChk('prod-group', null))) erros.push(t('campoProdutoMin'));
    if (marcarInvalido('f-tema', !el('f-tema').value.trim())) erros.push(t('campoTemaMin'));
    if (marcarInvalido('f-data', !el('f-data').value)) erros.push(t('campoDataMin'));
    if (marcarInvalido('f-horario', !el('f-horario').value.trim())) erros.push(t('campoHorarioMin'));
    if (marcarInvalido('f-estado', !el('f-estado').value)) erros.push(t('campoEstadoMin'));
    if (marcarInvalido('f-cidade', !el('f-cidade').value.trim())) erros.push(t('campoCidadeMin'));
    if (marcarInvalido('f-local', !el('f-local').value.trim())) erros.push(t('campoLocalMin'));
  }
  if (n === 2) {
    if (marcarInvalido('f-participantes', !el('f-participantes').value.trim())) erros.push(t('campoParticipantesMin'));
    if (grupoInvalido('seg-group', !valoresChk('seg-group', 'f-seg-outro'))) erros.push(t('campoSegmentosMin'));
    if (grupoInvalido('perfil-group', !valoresChk('perfil-group', null))) erros.push(t('campoPerfilMin'));
    if (marcarInvalido('f-justificativa', !el('f-justificativa').value.trim())) erros.push(t('campoJustificativaMin'));
    if (marcarInvalido('f-custo', !el('f-custo').value.trim())) erros.push(t('campoCustoMin'));
  }
  var caixa = el('frm-erro');
  if (erros.length) {
    caixa.textContent = t('validacaoPreencha')(erros.join(', '));
    caixa.classList.remove('hidden');
    return false;
  }
  caixa.classList.add('hidden');
  return true;
}

function irParaEtapa(n, semRolar) {
  solStep = n;
  [1, 2, 3].forEach(function (i) {
    el('frm-step-' + i).classList.toggle('hidden', i !== n);
  });
  el('frm-success').classList.add('hidden');
  el('frm-nav').classList.remove('hidden');
  document.querySelectorAll('.step-dot').forEach(function (d) {
    var s = parseInt(d.getAttribute('data-step'), 10);
    d.classList.toggle('active', s === n);
    d.classList.toggle('done', s < n);
  });
  el('btn-voltar').classList.toggle('hidden', n === 1);
  el('btn-voltar').textContent = t('btnVoltar');
  el('btn-avancar').textContent = n === 1 ? t('btnContinuar') : n === 2 ? t('btnRevisar') : t('btnEnviarSolicitacao');
  el('frm-erro').classList.add('hidden');
  if (!semRolar) window.scrollTo(0, 0);
  if (n === 3) montarResumo();
}

function proximoPasso() {
  if (solStep === 1) { if (validarEtapa(1)) irParaEtapa(2); return; }
  if (solStep === 2) { if (validarEtapa(2)) irParaEtapa(3); return; }
  enviarFormulario();
}

function passoAnterior() {
  if (solStep > 1) irParaEtapa(solStep - 1);
}

/* ---------------- Resumo e envio ---------------- */

function coletarPayload() {
  var sla = calcSLA();
  var dataBr = '';
  if (el('f-data').value) {
    var p = el('f-data').value.split('-');
    dataBr = p[2] + '/' + p[1] + '/' + p[0]; // formato canônico de armazenamento
  }
  return {
    solicitanteNome: el('f-nome').value.trim(),
    solicitanteEmail: el('f-email').value.trim(),
    responsaveis: coletarResponsaveis(),
    unidade: unidadeOficial(el('f-unidade').value) || el('f-unidade').value.trim(),
    tipo: solTipo ? solTipo.v : '',
    tipoOutro: solTipo && solTipo.v === 'Outro' ? el('f-tipo-outro').value.trim() : '',
    objetivos: valoresChk('obj-group', 'f-obj-outro'),
    bu: el('f-bu').value,
    produto: valoresChk('prod-group', null),
    tema: el('f-tema').value.trim(),
    dataSugerida: dataBr,
    horario: el('f-horario').value.trim(),
    estado: el('f-estado').value ? UF_NOMES[el('f-estado').value] : '',
    cidade: el('f-cidade').value.trim(),
    local: el('f-local').value.trim(),
    slaDias: sla ? sla.dias : '',
    slaSituacao: sla ? sla.situacao : '',
    participantes: el('f-participantes').value.trim(),
    segmentos: valoresChk('seg-group', 'f-seg-outro'),
    perfilPublico: valoresChk('perfil-group', null),
    materiais: el('f-materiais').value.trim(),
    justificativa: el('f-justificativa').value.trim(),
    midiaKit: el('f-midiakit').value.trim(),
    contatoOrganizador: el('f-organizador').value.trim(),
    custoEstimado: el('f-custo').value.trim(),
    alertaPrazo: alertaPrazoTexto(sla),
    alertaTerritorio: alertaTerritorioTexto()
  };
}

/** Texto do alerta de prazo enviado junto da solicitação. */
function alertaPrazoTexto(sla) {
  if (!sla) return '';
  if (sla.dentro) return t('alertaPrazoOk');
  return t('alertaPrazoRuim')(sla.dias, solTipo ? solTipo.porte : '', solTipo ? t(solTipo.chave) : '');
}

/** Texto do alerta de território enviado junto da solicitação. */
function alertaTerritorioTexto() {
  var fora = foraDoTerritorio();
  if (fora) {
    return t('alertaTerritorioRuim')(fora.donos.join(', '));
  }
  return t('alertaTerritorioOk');
}

function montarResumo() {
  var d = coletarPayload();
  var sla = calcSLA();
  var item = function (k, w) {
    return w ? '<div class="sum-item"><span class="k">' + escapeHtml(k) + '</span><span class="w">' + escapeHtml(w) + '</span></div>' : '';
  };
  var bloco = function (titulo, etapa, corpo) {
    return '<div class="sum-block"><div class="sum-head"><h4>' + escapeHtml(titulo) + '</h4>' +
      '<button type="button" onclick="irParaEtapa(' + etapa + ')">' + escapeHtml(t('btnEditar')) + '</button></div>' + corpo + '</div>';
  };

  var html = '';
  html += bloco(t('secQuemSolicita'), 1,
    item(t('resumoSolicitante'), d.solicitanteNome) +
    item(t('resumoEmail'), d.solicitanteEmail) +
    item(t('resumoResponsaveis'), d.responsaveis) +
    item(t('campoUnidade'), d.unidade));
  html += bloco(t('secOEvento'), 1,
    item(t('resumoTipo'), (solTipo ? t(solTipo.chave) : d.tipo) + (d.tipoOutro ? ' — ' + d.tipoOutro : '')) +
    item(t('resumoObjetivos'), traduzirValores(d.objetivos)) +
    item(t('campoBU'), traduzirValores(d.bu)) +
    item(t('lblProduto').replace(' *', ''), traduzirValores(d.produto)) +
    item(t('resumoTema'), d.tema) +
    item(t('resumoDataSugerida'), fmtDataBR(d.dataSugerida) || t('opcaoADefinir')) +
    item(t('resumoHorario'), d.horario) +
    item(t('resumoCidadeUF'), d.cidade && d.estado ? d.cidade + ' · ' + d.estado : (d.cidade || d.estado)) +
    item(t('resumoLocal'), d.local));
  html += bloco(t('passo2'), 2,
    item(t('resumoParticipantes'), d.participantes) +
    item(t('resumoSegmentos'), traduzirValores(d.segmentos)) +
    item(t('resumoPerfil'), traduzirValores(d.perfilPublico)) +
    item(t('resumoMateriais'), d.materiais) +
    item(t('resumoJustificativa'), d.justificativa) +
    item(t('resumoMidiaKit'), d.midiaKit) +
    item(t('resumoOrganizador'), d.contatoOrganizador) +
    item(t('resumoCusto'), d.custoEstimado));

  if (sla) {
    html += '<div class="sla-badge ' + (sla.dentro ? 'ok' : 'bad') + '">' + escapeHtml(sla.texto) + '</div>';
  }

  // Aviso de limite territorial (não bloqueia o envio)

  if (fora) {

/* ---------------- Registro de acessos ---------------- */

var ACESSO = {
  linha: null,
  inicio: Date.now(),
  id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
  nav: '',
  disp: ''
};

function detectarNavegador() {
  var ua = navigator.userAgent;
  if (ua.indexOf('Edg/') !== -1) return 'Edge';
  if (ua.indexOf('OPR/') !== -1 || ua.indexOf('Opera') !== -1) return 'Opera';
  if (ua.indexOf('Chrome/') !== -1) return 'Chrome';
  if (ua.indexOf('Firefox/') !== -1) return 'Firefox';
  if (ua.indexOf('Safari/') !== -1) return 'Safari';
  return 'Outro';
}

function detectarDispositivo() {
  var ua = navigator.userAgent;
  var so = ua.indexOf('Windows') !== -1 ? 'Windows'
    : ua.indexOf('Android') !== -1 ? 'Android'
    : (ua.indexOf('iPhone') !== -1 || ua.indexOf('iPad') !== -1) ? 'iOS'
    : ua.indexOf('Mac') !== -1 ? 'macOS'
    : ua.indexOf('Linux') !== -1 ? 'Linux' : 'Outro';
  var tipo = /Android|iPhone|iPad|Mobile/.test(ua) ? 'Celular/Tablet' : 'Computador';
  return tipo + ' · ' + so;
}

/* Identificação lembrada no navegador: pré-preenche para contas de fora do
   domínio (o Google não revela o e-mail delas) e enriquece o registro. */
function identSalva() {
  try { return JSON.parse(localStorage.getItem('ce-ident') || '{}') || {}; } catch (e) { return {}; }
}
function salvarIdent(nome, email) {
  try {
    var atual = identSalva();
    if (nome) atual.nome = nome;
    if (email) atual.email = email;
    localStorage.setItem('ce-ident', JSON.stringify(atual));
  } catch (e) {}
}

/** Grava um evento no Registro de Acessos (nunca interfere na navegação). */
function registrarEvento(tipo) {
  try {
    // parâmetros primitivos: atravessam o google.script.run sem risco de perda
    google.script.run
      .withSuccessHandler(function (l) { if (tipo === 'Acesso') ACESSO.linha = l; })
      .withFailureHandler(function () {})
      .registrarAcesso(ACESSO.id, tipo, ACESSO.nav, ACESSO.disp, identSalva().email || '');
  } catch (e) {}
}

function enviarHeartbeat(status) {
  if (!ACESSO.linha) return;
  try {
    google.script.run.withFailureHandler(function () {})
      .atualizarSessao(ACESSO.linha, (Date.now() - ACESSO.inicio) / 1000, status);
  } catch (e) {}
}

function iniciarRegistroAcesso() {
  ACESSO.nav = detectarNavegador();
  ACESSO.disp = detectarDispositivo();
  registrarEvento('Acesso');

  // Duração: primeiro pulso rápido (15s) e depois a cada 60s
  setTimeout(function () { enviarHeartbeat('Ativa'); }, 15000);
  setInterval(function () { enviarHeartbeat('Ativa'); }, 60000);

  // Saiu da aba/minimizou → melhor esforço de marcar Encerrada (voltou → Ativa)
  document.addEventListener('visibilitychange', function () {
    enviarHeartbeat(document.hidden ? 'Encerrada' : 'Ativa');
  });
  // Fechamento da aba/janela: o beacon é o canal mais confiável nesse momento
  window.addEventListener('pagehide', function () {
    try {
      if (navigator.sendBeacon && typeof URL_WEBAPP !== 'undefined' && URL_WEBAPP && ACESSO.linha) {
        navigator.sendBeacon(URL_WEBAPP, JSON.stringify({
          tipoBeacon: 'fim_sessao',
          linha: ACESSO.linha,
          segundos: (Date.now() - ACESSO.inicio) / 1000
        }));
      }
    } catch (e) {}
    enviarHeartbeat('Encerrada'); // segundo canal, melhor esforço
  });
}

// O valor do status é dado; rótulo e descrição vêm do dicionário.
var STATUS_INFO = {
  'Pendente':     { cor: '#f0c040', chave: 'statusPendente',    chaveDesc: 'descPendente' },
  'Em análise':   { cor: '#58c2cf', chave: 'statusEmAnalise',   chaveDesc: 'descEmAnalise' },
  'Em andamento': { cor: '#25e07f', chave: 'statusEmAndamento', chaveDesc: 'descEmAndamento' },
  'Reprovado':    { cor: '#d9657f', chave: 'statusReprovado',   chaveDesc: 'descReprovado' },
  'Concluído':    { cor: '#8b97a1', chave: 'statusConcluido',   chaveDesc: 'descConcluido' }
};

/** Rótulo traduzido de um status. */
function rotuloStatus(st) {
  var i = STATUS_INFO[st];
  return i && i.chave ? t(i.chave) : st;
}
/** Descrição traduzida de um status. */
function descStatus(st) {
  var i = STATUS_INFO[st];
  return i && i.chaveDesc ? t(i.chaveDesc) : '';
}

var CONSULTA_RES = [];

function statusPill(status) {
  var info = STATUS_INFO[status] || { cor: '#8b97a1' };
  return '<span class="status-pill" style="color:' + corTexto(info.cor) + ';border-color:' + info.cor + ';background:' +
    hexToRgba(info.cor, 0.1) + '">' + escapeHtml(rotuloStatus(status)) + '</span>';
}

function abrirConsulta() {

function buscarConsulta() {

function renderConsultaLista(termo) {
  var out = el('consulta-out');

    out.innerHTML = '<div class="consulta-vazio">' + t('consultaVazia')(escapeHtml(termo)) + '</div>';
