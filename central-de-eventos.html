  out.innerHTML = CONSULTA_RES.map(function (s, i) {
    return '<div class="consulta-item" onclick="renderConsultaDetalhe(' + i + ', true)">' +
      '<div><div class="ci-prot">' + escapeHtml(s.protocolo) + '</div>' +
      '<div class="ci-tema">' + escapeHtml(s.chaveTema ? t(s.chaveTema) : t('solicitacaoGenerica')) + '</div>' +
      '<div class="ci-meta">' + escapeHtml([t(s.chaveTipo), fmtDataBR(s.dataSugerida)].filter(Boolean).join(' · ')) + '</div></div>' +
      statusPill(s.status) +
      '</div>';
  }).join('');
}

function renderConsultaDetalhe(i, comVoltar) {
  var s = CONSULTA_RES[i];
  if (!s) return;
  var info = STATUS_INFO[s.status] || { cor: '#8b97a1' };
  var html = '';
  if (comVoltar) {
    html += '<button type="button" class="consulta-voltar" onclick="renderConsultaLista(\'\')">' + escapeHtml(t('voltarLista')) + '</button>';
  }
  html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px">' +
    '<div class="ci-prot" style="font-size:20px">' + escapeHtml(s.protocolo) + '</div>' + statusPill(s.status) + '</div>';
  html += '<div class="consulta-desc" style="color:' + corTexto(info.cor) + ';border-color:' + hexToRgba(info.cor, 0.4) + ';background:' + hexToRgba(info.cor, 0.07) + '">' +
    escapeHtml(descStatus(s.status)) + '</div>';
  html += '<div class="consulta-det-campos">' + camposSolicitacao(s).map(function (c) {
    return '<div class="modal-field"><span class="k">' + escapeHtml(c[0]) + '</span><span class="w">' + escapeHtml(c[1]) + '</span></div>';
  }).join('') + '</div>';
  el('consulta-out').innerHTML = html;
}

/* ---------------- Calendário da view Solicitar ---------------- */

function mudarMesSol(delta) {
  solMonth += delta;
  if (solMonth < 0) { solMonth = 11; solYear--; }
  if (solMonth > 11) { solMonth = 0; solYear++; }
  solSelectedDay = null;
  renderSolCal();
  listarDiaSol();
}

function renderSolCal() {
  var titulo = el('sol-cal-title');
  if (!titulo) return;
  titulo.textContent = mesesNome()[solMonth] + ' ' + solYear;

  var grid = el('sol-cal-grid');
  var html = '';
  var wds = t('diasSemanaAbrev');
  for (var w = 0; w < 7; w++) html += '<div class="wd">' + wds[w] + '</div>';

  var firstDow = new Date(solYear, solMonth, 1).getDay();
  var daysInMonth = new Date(solYear, solMonth + 1, 0).getDate();
  var hoje = todayStr();

  for (var i = 0; i < firstDow; i++) html += '<div></div>';
  for (var d = 1; d <= daysInMonth; d++) {
    var dateStr = solYear + '-' + ('0' + (solMonth + 1)).slice(-2) + '-' + ('0' + d).slice(-2);
    var dayEvents = EVENTS.filter(function (e) { return e.dates.indexOf(dateStr) !== -1; });
    var cls = 'day';
    if (dayEvents.some(function (e) { return e.type === 'FERIADO'; })) cls += ' holiday';
    if (dayEvents.some(isEvento)) cls += ' has-event';
    if (dateStr === hoje) cls += ' today';
    if (dateStr === solSelectedDay) cls += ' selected';
    var titles = dayEvents.map(function (e) { return tituloEvento(e); }).join(', ');
    html += '<div class="' + cls + '" title="' + escapeHtml(titles) + '" onclick="selecionarDiaSol(\'' + dateStr + '\')">' + d + '</div>';
  }
  grid.innerHTML = html;
}

function selecionarDiaSol(dateStr) {
  solSelectedDay = (solSelectedDay === dateStr) ? null : dateStr;
  renderSolCal();
  listarDiaSol();
}

function listarDiaSol() {
  var box = el('sol-day-list');
  if (!box) return;
  if (!solSelectedDay) {
    box.innerHTML = '<div class="sol-day-empty">' + escapeHtml(t('solSelecioneDia')) + '</div>';
    return;
  }
  var evts = EVENTS.filter(function (e) { return e.dates.indexOf(solSelectedDay) !== -1; });
  var p = solSelectedDay.split('-');
  var html = '';
  if (!evts.length) {
    html += '<div class="sol-day-empty">' + escapeHtml(t('solDataLivre')(fmtDiaMes(p[2], p[1]))) + '</div>';
  } else {
    evts.forEach(function (e) {
      var idx = EVENTS.indexOf(e);
      html += '<div class="mini-event" onclick="abrirModal(' + idx + ')">' +
        '<div class="t">' + escapeHtml(tituloEvento(e)) + '</div>' +
        '<div class="m">' + escapeHtml([e.city, e.unit].filter(Boolean).join(' · ') || e.type) + '</div>' +
        '<span class="badge ' + badgeClass(e.type) + '" style="margin-top:6px">' + escapeHtml(rotuloCat(e.type)) + '</span>' +
        '</div>';
    });
  }
  html += '<button type="button" class="sol-day-use" onclick="usarDataSol()">' +
    escapeHtml(t('solUsarData')(fmtDataISO(solSelectedDay))) + '</button>';
  box.innerHTML = html;
}

function usarDataSol() {
  if (!solSelectedDay) return;
  el('f-data').value = solSelectedDay;
  atualizarSLA();
}
