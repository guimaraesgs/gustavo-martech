<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="description" id="metaDesc" content="Dashboard demonstrativo · Empresa ABC · dados fictícios">
<title>Empresa ABC · Dashboard de Leads (Demo)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2300c46e'/><text x='16' y='22' font-size='15' text-anchor='middle' fill='%230a140d' font-family='Arial' font-weight='bold'>E</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#00c46e; --green-b:#25e07f; --green-d:#0a6b3f;
  --navy:#16232f; --teal:#2b8f9c; --pink:#d9657f; --gold:#f0c040;
  --ink:#e7edf2;
  --bg:#0a0f0d; --card:#111814; --card-2:#0a100d;
  --line:#1d2b25; --line-2:#1a2620;
  --muted:#5d6b77; --muted2:#8b97a1;
  --quente:#f0577a; --morno:#f0c040; --frio:#3bc9d6;
  --r:16px; --shadow:0 16px 40px rgba(0,0,0,.45);
  --display:'Work Sans',system-ui,sans-serif;
  --body:'Roboto',system-ui,sans-serif;
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{margin:0;}
body{font-family:var(--body);color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;}
::-webkit-scrollbar-track{background:transparent;}
.hero{position:relative;overflow:hidden;padding:32px 20px 26px;border-bottom:1px solid var(--line);
  background:radial-gradient(130% 120% at 22% 12%,#0e3a26 0%,#0a1a13 48%,#060d0a 100%);}
.hero-glow{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none;
  background:radial-gradient(600px 360px at 12% -10%,rgba(0,228,132,.35),transparent 60%);}
.hero-inner{position:relative;z-index:2;display:flex;align-items:flex-start;
  justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1200px;margin:0 auto;}
.hero-left{display:flex;align-items:flex-start;gap:16px;}
.brand{font-family:var(--display);font-weight:700;font-size:11px;
  letter-spacing:.3em;color:var(--green-b);margin-top:4px;}
.hero-title{font-family:var(--display);font-weight:300;text-transform:uppercase;
  font-size:32px;letter-spacing:-.02em;line-height:1;margin:0;color:var(--green-b);}
.hero-title b{font-weight:800;color:#fff;}
.hero-sub{color:#cfe8da;font-size:13px;margin:5px 0 0;}
.hero-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding-top:2px;}
.hero-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
.updated{font-size:11px;color:#8cb89e;}
.btn-refresh{display:flex;align-items:center;gap:7px;
  background:transparent;border:1px solid var(--green);
  color:var(--green-b);font-family:var(--display);font-weight:700;font-size:12px;
  padding:8px 16px;border-radius:8px;cursor:pointer;transition:background .15s;white-space:nowrap;
  text-transform:uppercase;letter-spacing:.04em;}
.btn-refresh:hover{background:rgba(0,196,110,.12);}
.btn-refresh svg{width:14px;height:14px;transition:transform .5s ease;}
.spinning svg{transform:rotate(360deg);}
.interruptor-idioma{display:flex;background:var(--card-2);border:1px solid var(--line);
  border-radius:10px;padding:2px;flex-shrink:0;}
.interruptor-idioma button{background:none;border:none;border-radius:8px;padding:6px 10px;
  font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--muted2);
  transition:all .15s;cursor:pointer;font-family:inherit;}
.interruptor-idioma button.ativo{background:var(--card);color:var(--green-b);
  box-shadow:0 2px 8px rgba(0,0,0,.12);}
.demo-tag{display:inline-block;font-family:var(--display);font-weight:700;font-size:9px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
  background:rgba(240,192,64,.12);border:1px solid rgba(240,192,64,.4);
  padding:3px 9px;border-radius:999px;}
.filters{background:rgba(10,15,13,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;}
.filters-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.filters-inner{display:flex;align-items:flex-end;gap:10px;padding:12px 20px;min-width:max-content;}
.fg{display:flex;flex-direction:column;gap:3px;}
.fg label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted2);}
.fg input,.fg select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;
  font-family:var(--body);font-size:13px;color:var(--ink);background:var(--card-2);min-width:120px;transition:border-color .15s;}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--green);}
.fg input::-webkit-calendar-picker-indicator{filter:invert(.7);}
.btn-clear{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 12px;
  font-size:12px;font-weight:700;color:var(--muted2);cursor:pointer;margin-top:auto;transition:all .12s;text-transform:uppercase;letter-spacing:.04em;}
.btn-clear:hover{border-color:var(--quente);color:var(--quente);}
.main{max-width:1200px;margin:0 auto;padding:24px 16px 56px;}
.section-title{font-family:var(--display);font-weight:700;font-size:13px;color:var(--muted2);
  text-transform:uppercase;letter-spacing:.14em;margin:0 0 14px;padding-left:10px;border-left:3px solid var(--green);}
.section-title span{border-left:0 !important;}
.section-title .sub{font-size:11px;font-weight:400;letter-spacing:0;
  text-transform:none;color:var(--muted2);}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:24px;}
.kpi{background:linear-gradient(180deg,#0a1712,#060f0b);border:1px solid var(--line);
  border-radius:20px;padding:26px 18px 22px;text-align:center;transition:border-color .15s,transform .1s;}
.kpi:active{transform:translateY(1px);}
.kpi[onclick]{cursor:pointer;}
.kpi[onclick]:hover{border-color:var(--green);}
.kpi-val{font-family:var(--display);font-weight:800;font-size:46px;line-height:1;
  background:linear-gradient(180deg,#6cf396,#18c06a 46%,#0a8048);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.kpi-lbl{font-size:12px;color:#cfe0d6;margin-top:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;}
.kpi-sub{font-size:11px;color:var(--green-b);font-weight:700;margin-top:6px;}
.temp-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
.temp-card{border-radius:var(--r);padding:22px 14px;text-align:center;cursor:pointer;transition:filter .15s,transform .1s;border:none;position:relative;overflow:hidden;}
.temp-card:hover{filter:brightness(1.08);}
.temp-card:active{transform:translateY(1px);}
.temp-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;}
.tc-quente{background:linear-gradient(160deg,#1a1013,#12100f);}
.tc-quente::before{background:var(--quente);}
.tc-morno{background:linear-gradient(160deg,#191510,#12100f);}
.tc-morno::before{background:var(--morno);}
.tc-frio{background:linear-gradient(160deg,#0e1719,#0f1412);}
.tc-frio::before{background:var(--frio);}
.tc-num{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;color:#fff;}
.tc-quente .tc-num{color:var(--quente);}
.tc-morno .tc-num{color:var(--morno);}
.tc-frio .tc-num{color:var(--frio);}
.tc-lbl{font-size:12px;color:#cfe0d6;font-weight:600;margin-top:4px;text-transform:uppercase;letter-spacing:.08em;}
.tc-pct{font-size:11px;color:var(--muted2);margin-top:4px;min-height:16px;}
.status-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px;}
.status-card{border-radius:var(--r);padding:22px 12px;text-align:center;cursor:pointer;
  background:var(--card);border:1px solid var(--line);transition:border-color .15s,transform .1s;position:relative;overflow:hidden;}
.status-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;}
.status-card:hover{transform:translateY(-1px);}
.status-card:active{transform:translateY(0);}
.sc-agen::before{background:var(--green);}
.sc-agen:hover{border-color:var(--green);}
.sc-and::before{background:var(--muted);}
.sc-and:hover{border-color:var(--muted);}
.sc-desc::before{background:var(--quente);}
.sc-desc:hover{border-color:var(--quente);}
.sc-sqo::before{background:var(--frio);}
.sc-sqo:hover{border-color:var(--frio);}
.sc-num{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;color:#fff;}
.sc-agen .sc-num{color:var(--green-b);}
.sc-desc .sc-num{color:var(--quente);}
.sc-sqo .sc-num{color:var(--frio);}
.sc-lbl{font-size:12px;color:#cfe0d6;font-weight:600;margin-top:4px;text-transform:uppercase;letter-spacing:.06em;}
.sc-pct{font-size:11px;color:var(--muted2);font-weight:600;margin-top:4px;min-height:16px;}
.sc-agen .sc-pct{color:var(--green-b);}
.sc-desc .sc-pct{color:var(--quente);}
.sc-sqo .sc-pct{color:var(--frio);}
.funnel{max-width:560px;margin:0 auto 24px;}
.fn-bar{margin:0 auto;color:#fff;border-radius:12px;padding:14px 18px;display:flex;
  align-items:center;justify-content:space-between;gap:14px;min-width:215px;box-shadow:var(--shadow);}
.fn-bar span{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;}
.fn-bar b{font-family:var(--display);font-weight:800;font-size:24px;}
.fn-conv{text-align:center;font-size:11px;color:var(--muted2);padding:6px 0;font-weight:600;}
.fn-conv b{color:var(--green-b);font-weight:800;}
.insf{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;margin-bottom:24px;}
.insf-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.insf-item{background:var(--card-2);border:1px solid var(--line-2);border-radius:12px;padding:14px;}
.insf-item .v{font-family:var(--display);font-weight:800;font-size:24px;color:#fff;line-height:1;}
.insf-item .l{font-size:11px;color:var(--muted2);margin-top:5px;font-weight:500;}
.insf-item.g .v{color:var(--green-b);}
.insf-item.r .v{color:var(--quente);}
.insf-item.t .v{color:var(--frio);}
.insf-top{margin-top:18px;}
.insf-top h4{font-family:var(--display);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted2);margin:0 0 12px;}
.insf-mot{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.insf-mot .rank{font-family:var(--display);font-weight:800;color:var(--muted);width:14px;flex-shrink:0;}
.insf-mot .mname{flex:1;min-width:0;white-space:normal;line-height:1.3;font-size:12.5px;color:#cfe0d6;}
.insf-mot .bar{flex:0 0 64px;width:64px;height:7px;background:var(--line-2);border-radius:999px;overflow:hidden;}
.insf-mot .bar>i{display:block;height:100%;background:var(--quente);border-radius:999px;}
.insf-mot .pctv{font-weight:700;font-size:12px;color:var(--quente);min-width:34px;text-align:right;flex-shrink:0;}
.charts-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:24px;}
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 14px;}
.main>.chart-card{margin-bottom:24px;}
.chart-card.clickable{cursor:pointer;transition:border-color .15s;}
.chart-card.clickable:hover{border-color:var(--green);}
.ch{display:flex;align-items:baseline;gap:8px;margin-bottom:14px;}
.ch h3{font-family:var(--display);font-weight:700;font-size:14px;margin:0;color:#fff;text-transform:uppercase;letter-spacing:.04em;}
.ch-hint{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.06em;}
.cw{position:relative;height:220px;}
.cw-sm{height:200px;}
.cw-motivos{height:320px;}
.chart-off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:14px;font-size:12px;color:var(--muted2);
  border:1px dashed var(--line);border-radius:12px;background:var(--card-2);}
.rank-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:24px;}
.rank-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;}
.rank-card h3{font-family:var(--display);font-weight:700;font-size:14px;margin:0 0 14px;color:#fff;text-transform:uppercase;letter-spacing:.04em;}
.rank-row{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:8px;cursor:pointer;transition:background .1s;margin-bottom:4px;}
.rank-row:hover{background:rgba(255,255,255,.04);}
.rpos{font-family:var(--display);font-weight:800;font-size:12px;color:var(--muted);width:16px;flex-shrink:0;}
.rname{font-size:13px;font-weight:500;min-width:90px;flex-shrink:0;color:#cfe0d6;}
.rbar-w{flex:1;height:22px;background:var(--card-2);border-radius:999px;overflow:hidden;}
.rbar{height:100%;min-width:28px;background:var(--green);border-radius:999px;display:flex;align-items:center;justify-content:flex-end;padding-right:9px;transition:width .3s ease;}
.rbar span{font-size:11px;font-weight:700;color:#0a140d;}
.rbar-hot{background:var(--quente);}
.rbar-hot span{color:#fff;}
.rank-empty{font-size:13px;color:var(--muted2);padding:14px;text-align:center;}
.loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:60;}
.spinner{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .75s linear infinite;margin-bottom:14px;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading p{font-family:var(--display);font-size:14px;color:var(--muted2);}
.empty{text-align:center;padding:72px 20px;max-width:340px;margin:0 auto;}
.empty h3{font-family:var(--display);font-weight:700;font-size:18px;margin:0 0 8px;color:#fff;}
.empty p{color:var(--muted2);font-size:14px;margin:0;}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0;}
.modal-box{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;max-height:min(88vh,720px);width:100%;display:flex;flex-direction:column;overflow:hidden;animation:slide-up .2s ease;box-shadow:var(--shadow);}
@keyframes slide-up{from{transform:translateY(100%);}to{transform:none;}}
.modal-close{position:absolute;top:12px;right:14px;width:30px;height:30px;border-radius:50%;background:var(--card-2);border:1px solid var(--line);font-size:18px;cursor:pointer;color:var(--muted2);z-index:1;}
.modal-close:hover{border-color:var(--quente);color:var(--quente);}
.pop-head{padding:20px 20px 14px;border-bottom:1px solid var(--line);flex-shrink:0;position:relative;}
.pop-head h2{font-family:var(--display);font-weight:700;font-size:19px;margin:0 32px 8px 0;color:#fff;}
.pop-head p{color:var(--muted2);font-size:13px;margin:0;}
.pop-kpis{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;}
.pk span{font-family:var(--display);font-weight:800;font-size:26px;display:block;color:#fff;}
.pk label{font-size:11px;color:var(--muted2);}
.pk.hot span{color:var(--quente);}
.pk.aud span{color:var(--frio);}
.pop-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px 20px;flex:1;min-height:0;max-height:min(72vh,560px);}
.pop-x{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.pop-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:14px;}
.pop-table th{text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted2);padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
.pop-table td{padding:8px 8px;border-bottom:1px solid var(--line-2);vertical-align:top;max-width:160px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#cfe0d6;}
.pop-table td.td-wrap{white-space:normal;overflow:visible;text-overflow:clip;max-width:340px;min-width:200px;}
.pop-table tr:hover td{background:rgba(255,255,255,.03);}
.link-a{display:inline-block;background:rgba(0,196,110,.14);color:var(--green-b);font-weight:700;font-size:11px;padding:3px 8px;border-radius:5px;text-decoration:none;white-space:nowrap;border:1px solid rgba(0,196,110,.3);}
.link-a:hover{background:rgba(0,196,110,.24);}
.badge{display:inline-block;padding:3px 9px;border-radius:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-family:var(--display);}
.bq{background:rgba(240,87,122,.12);color:var(--quente);border:1px solid rgba(240,87,122,.3);}
.bm{background:rgba(240,192,64,.12);color:var(--gold);border:1px solid rgba(240,192,64,.3);}
.bf{background:rgba(59,201,214,.12);color:var(--frio);border:1px solid rgba(59,201,214,.3);}
.bn{background:rgba(255,255,255,.06);color:var(--muted2);border:1px solid rgba(255,255,255,.12);}
@media(min-width:640px){
  .hero{padding:36px 32px 28px;}
  .hero-title{font-size:40px;}
  .main{padding:28px 28px 64px;}
  .kpi-grid{grid-template-columns:repeat(4,1fr);}
  .status-strip{grid-template-columns:repeat(4,1fr);}
  .insf-grid{grid-template-columns:repeat(3,1fr);}
  .charts-grid{grid-template-columns:1fr 1fr;}
  .rank-grid{grid-template-columns:1fr 1fr;}
  .modal-ov{align-items:center;padding:20px;}
  .modal-box{border-radius:20px;max-height:min(86vh,720px);max-width:860px;}
  @keyframes slide-up{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}
}
@media(min-width:1024px){ .kpi-grid{grid-template-columns:repeat(4,1fr);} }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-glow"></div>
  <div class="hero-inner">
    <div class="hero-left">
      <span class="brand">Empresa ABC</span>
      <div>
        <h1 class="hero-title" id="heroTitulo"></h1>
        <p class="hero-sub" data-i18n="heroSub"></p>
      </div>
    </div>
    <div class="hero-right">
      <span class="demo-tag" data-i18n="tagDemo"></span>
      <span class="updated" id="updated">—</span>
      <div class="hero-actions">
        <div class="interruptor-idioma" id="grupoIdioma" role="group" aria-label="">
          <button id="btnPT" onclick="definirIdioma('pt')">PT</button>
          <button id="btnEN" onclick="definirIdioma('en')">EN</button>
        </div>
        <button class="btn-refresh" id="btnRefresh" onclick="refreshData()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          <span data-i18n="btnAtualizar"></span>
        </button>
      </div>
    </div>
  </div>
</header>

<div class="filters" id="filtersBar" hidden>
  <div class="filters-scroll">
    <div class="filters-inner">
      <div class="fg"><label data-i18n="filtroDe"></label><input type="date" id="fDe"></div>
      <div class="fg"><label data-i18n="filtroAte"></label><input type="date" id="fAte"></div>
      <div class="fg"><label data-i18n="filtroResp"></label><select id="fResp"><option value="" data-i18n="optTodos"></option></select></div>
      <div class="fg"><label data-i18n="filtroInteresse"></label>
        <select id="fInt">
          <option value="" data-i18n="optTodos"></option>
          <option value="Q" data-i18n="tempQuente"></option>
          <option value="M" data-i18n="tempMorno"></option>
          <option value="F" data-i18n="tempFrio"></option>
        </select>
      </div>
      <div class="fg"><label data-i18n="filtroPapel"></label><select id="fPapel"><option value="" data-i18n="optTodos"></option></select></div>
      <div class="fg"><label data-i18n="filtroEtapa"></label><select id="fEtapa"><option value="" data-i18n="optTodas"></option></select></div>
      <button class="btn-clear" onclick="clearFilters()" data-i18n="btnLimpar"></button>
    </div>
  </div>
</div>

<main class="main" id="dashMain" hidden>

  <div class="kpi-grid" id="kpiGrid"></div>

  <p class="section-title" data-i18n="secTemperatura"></p>
  <div class="temp-strip">

// ---------- Datas conforme o idioma ----------
function fmtData(iso){
  if(!iso) return '—';
  var p = String(iso).split('-');
  if(p.length !== 3) return iso;
  return IDIOMA === 'pt' ? (p[2] + '/' + p[1] + '/' + p[0]) : (p[1] + '/' + p[2] + '/' + p[0]);
}
function fmtDiaMes(iso){
  var p = String(iso).split('-');
  if(p.length !== 3) return iso;
  return IDIOMA === 'pt' ? (p[2] + '/' + p[1]) : (p[1] + '/' + p[2]);
}
function fmtDataHora(d){
  var iso = d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
  return fmtData(iso) + ' ' + ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
}

// ---------- Filtros ----------
function valoresFiltros(){
  var resps = unico(allData.map(function(r){return r.respK;}));
  var papeis = unico(allData.map(function(r){return r.papelK;}));
  var etapas = {};
  allData.forEach(function(r){ r.etapasK.forEach(function(e){ etapas[e]=1; }); });
  return { resps:resps, papeis:papeis, etapas:Object.keys(etapas) };
}

function encherSelect(id, valores, rotular){
  var el = g(id), atual = el.value;
  while (el.options.length > 1) el.remove(1);
  valores.map(function(v){ return { v:v, l:rotular(v) }; })
    .sort(function(a,b){ return a.l.localeCompare(b.l, IDIOMA === 'pt' ? 'pt' : 'en'); })
    .forEach(function(o){ addOpt(id, o.v, o.l); });
  el.value = atual;
}

function preencherFiltros() {
  atualizarOpcoesFiltros();
  var ds = allData.map(function(r){return r.dataStr;}).filter(Boolean).sort();
  if (ds.length) { ['fDe','fAte'].forEach(function(id){ g(id).min=ds[0]; g(id).max=ds[ds.length-1]; }); }
}

function atualizarOpcoesFiltros(){
  var v = valoresFiltros();
  encherSelect('fResp', v.resps, nomeConsultor);
  encherSelect('fPapel', v.papeis, nomePapel);
  encherSelect('fEtapa', v.etapas, nomeSolucao);
}

function addListeners() {
  ['fDe','fAte','fResp','fInt','fPapel','fEtapa'].forEach(function(id){
    g(id).addEventListener('change', aplicarFiltros);
  });
}

window.clearFilters = function(){
  ['fDe','fAte'].forEach(function(id){ g(id).value=''; });
  ['fResp','fInt','fPapel','fEtapa'].forEach(function(id){ g(id).selectedIndex=0; });
  aplicarFiltros();
};

function aplicarFiltros() {
  var de=g('fDe').value, ate=g('fAte').value, resp=g('fResp').value,
      inter=g('fInt').value, papel=g('fPapel').value, etapa=g('fEtapa').value;
  filteredData = allData.filter(function(r){
    if(de    && r.dataStr<de) return false;
    if(ate   && r.dataStr>ate) return false;
    if(resp  && r.respK!==resp) return false;
    if(inter && r.tempK!==inter) return false;
    if(papel && r.papelK!==papel) return false;
    if(etapa && r.etapasK.indexOf(etapa)===-1) return false;
    return true;
  });
  renderTudo();
}

function renderTudo() {
  if (!filteredData.length) { g('dashMain').hidden=true; g('emptyState').hidden=false; return; }
  g('dashMain').hidden=false; g('emptyState').hidden=true;
  renderKPIs(); renderTemp(); renderStatus(); renderFunnel(); renderInsightsFunil();
  renderMotivos(); renderGraficos(); renderRankings();
}

function catDe(r){ return _src(r).tempK || ''; }
function papelDe(r){ var s=_src(r); return s.papelK?nomePapel(s.papelK):'—'; }

function _tempos(){
  function avg(a){ if(!a.length) return null; return Math.round(a.reduce(function(x,y){return x+y;},0)/a.length); }
  var da=[], dd=[];
  allRetorno.forEach(function(r){
    var ini=_src(r).dataStr, fim=r.dataStr;
    if(!ini||!fim) return;
    var a=new Date(ini), b=new Date(fim);
    if(isNaN(a)||isNaN(b)) return;
    var dias=Math.round((b-a)/86400000);
    if(dias<0) return;
    if(r.status==='DE') dd.push(dias); else da.push(dias);
  });
  return { agen:avg(da), desc:avg(dd) };
}

// Guarda: sem Chart.js (CDN bloqueada, arquivo ausente) a página segue renderizando.
function novoGrafico(chave, canvasId, cfg){
  var cv = g(canvasId);
  if (!cv) return null;
  if (!window.Chart) { graficoIndisponivel(cv); return null; }
  var aviso = cv.parentNode.querySelector('.chart-off');
  if (aviso) aviso.parentNode.removeChild(aviso);
  cv.style.display = '';
  destr(chave);
  charts[chave] = new Chart(cv, cfg);
  return charts[chave];
}

function graficoIndisponivel(cv){
  cv.style.display = 'none';
  var wrap = cv.parentNode, aviso = wrap.querySelector('.chart-off');
  if (!aviso) { aviso = document.createElement('div'); aviso.className = 'chart-off'; wrap.appendChild(aviso); }
  aviso.textContent = t('graficoIndisponivel');
}

function hbar(extra){

function rRow(x,i,max,hot){
  var p=Math.round(x.v/max*100), cl=hot?'rbar-hot':'';

    '<div class="rname">'+esc(nomeConsultor(x.k))+'</div><div class="rbar-w"><div class="rbar '+cl+'" style="width:'+p+'%"><span>'+x.v+'</span></div></div></div>';

// ---------- Utilitários de renderização ----------
function th(chave){ return '<th>'+esc(t(chave))+'</th>'; }
function vazioLinha(cols,msg){
  return '<tr><td colspan="'+cols+'" style="text-align:center;color:var(--muted2);padding:20px">'+esc(msg)+'</td></tr>';
}
function pk(v,lbl,cls){ return '<div class="pk '+cls+'"><span>'+v+'</span><label>'+esc(lbl)+'</label></div>'; }
function badge(r){ return badgeVal(r.tempK||''); }
function badgeVal(k){
  var m={'Q':'bq','M':'bm','F':'bf'};
  return k?'<span class="badge '+(m[k]||'bn')+'">'+esc(nomeTemp(k))+'</span>':'<span class="badge bn">—</span>';
}
function alink(r){
  if(!r.link) return '<span style="color:var(--muted)">—</span>';
  return '<a href="'+esc(r.link)+'" target="_blank" rel="noopener" class="link-a">'+esc(t('linkOuvir'))+'</a>';
}

function abrirModal(construtor){
  modalAtual = construtor;
  g('modalContent').innerHTML = construtor();
  g('modalOv').hidden = false;
  document.body.style.overflow = 'hidden';
}
function retraduzirModal(){
  if (!g('modalOv').hidden && modalAtual) g('modalContent').innerHTML = modalAtual();
}
window.closeModal=function(){ modalAtual=null; g('modalOv').hidden=true; document.body.style.overflow=''; };
window.handleOvClick=function(e){ if(e.target===g('modalOv')) window.closeModal(); };

function g(id){return document.getElementById(id);}
function esc(s){ return String(s===0?0:(s||'')).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function unico(a){var s={};return a.filter(function(x){return x&&!s[x]&&(s[x]=1);});}
function contarPor(a,fn){var m={};a.forEach(function(r){var k=fn(r);m[k]=(m[k]||0)+1;});return m;}
function ordenar(o){ return Object.keys(o).map(function(k){return{k:k,v:o[k]};}).sort(function(a,b){return b.v-a.v;}); }
function addOpt(id,v,rotulo){var o=document.createElement('option');o.value=v;o.textContent=rotulo;g(id).appendChild(o);}
function mostrarLoading(s){g('loading').hidden=!s;}
