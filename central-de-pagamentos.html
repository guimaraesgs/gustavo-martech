<script>
/* ============================================================
   DEMO — camadas extras: tema claro/escuro, pop-ups explicativos
   por etapa e importação simulada dos 3 arquivos fictícios.
   (Executa DEPOIS do script principal e sobrepõe comportamentos.)
   ============================================================ */

/* ----- tema claro/escuro com persistência ----- */
function aplicarTema(tema) {
  document.documentElement.setAttribute('data-theme', tema);
  try { localStorage.setItem('cp-demo-tema', tema); } catch (e) { }
  var btn = document.getElementById('btn-tema');
  if (btn) btn.textContent = tema === 'light' ? t('btnTemaClaro') : t('btnTemaEscuro');
}
(function initTema() {
  var salvo = null;
  try { salvo = localStorage.getItem('cp-demo-tema'); } catch (e) { }
  var tema = salvo || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  aplicarTema(tema);
})();

/* ----- pop-ups explicativos (um por etapa, com X para fechar) ----- */
function dicaTextos(n) {
  if (n === 0) return { passo: t('dica0Passo'), titulo: t('dica0Titulo'), html: t('dica0Html') };
  if (n === 1) return { passo: t('dica1Passo'), titulo: t('dica1Titulo'), html: t('dica1Html') };
  if (n === 2) return { passo: t('dica2Passo'), titulo: t('dica2Titulo'), html: t('dica2Html') };
  if (n === 3) return { passo: t('dica3Passo'), titulo: t('dica3Titulo'), html: t('dica3Html') };
  return null;
}
var dicasVistas = {};
function mostrarDica(n, aoFechar) {
  var d = dicaTextos(n);
  if (!d || dicasVistas[n]) { if (aoFechar) aoFechar(); return; }
  dicasVistas[n] = true;
  var fundo = document.createElement('div');
  fundo.className = 'dica-fundo';
  fundo.innerHTML = '<div class="dica">' +
    '<button class="dica-x" title="' + esc(t('tituloFechar')) + '">×</button>' +
    '<div class="dica-passo">' + esc(d.passo) + '</div>' +
    '<h3>' + esc(d.titulo) + '</h3>' + d.html +
    '<div class="dica-acoes"><button class="btn btn-primary btn-mini dica-ok">' + esc(t('btnEntendi')) + '</button></div>' +
    '</div>';
  document.body.appendChild(fundo);
  function fechar() {
    fundo.remove();
    if (aoFechar) aoFechar();
  }
  fundo.querySelector('.dica-x').onclick = fechar;
  fundo.querySelector('.dica-ok').onclick = fechar;
  fundo.addEventListener('click', function (e) { if (e.target === fundo) fechar(); });
}

/* etapa muda → mostra a dica daquela etapa (uma vez por visita à página) */
var __setEtapaOriginal = setEtapa;
setEtapa = function (n) {
  __setEtapaOriginal(n);
  mostrarDica(n);
};

/* ----- importação simulada (substitui o upload real) ----- */
function abrirModalUploadDemo() {
  if (App.det && App.det.documentos && App.det.documentos.length) {
    toast(t('avisoJaImportados'), 'alerta');
    return;
  }
  if (!App.det) { toast(t('avisoCrieAntes'), 'alerta'); return; }
  abrirModal(
    '<h3 class="modal-titulo">' + esc(t('tituloUploadDemo')) + '</h3>' +
    '<p style="color:var(--muted-2);font-size:13.5px;line-height:1.7">' + t('txtUploadDemo1') + '</p>' +
    '<div class="note" style="margin:14px 0">' + t('txtUploadDemoLista') + '</div>' +
    '<p style="color:var(--muted-2);font-size:12.5px">' + esc(t('txtUploadDemo2')) + '</p>' +
    '<div class="modal-acoes">' +
    '<button class="btn btn-secondary" id="up-cancelar">' + esc(t('btnCancelar')) + '</button>' +
    '<button class="btn btn-primary" id="up-importar">' + esc(t('btnImportarDemo')) + '</button>' +
    '</div>');
  document.getElementById('up-cancelar').onclick = fecharModal;
  document.getElementById('up-importar').onclick = function () {
    fecharModal();
    simularProgressoUpload();
  };
}

function simularProgressoUpload() {
  var passos = [t('passoUpload1'), t('passoUpload2'), t('passoUpload3')];
  var prog = document.getElementById('progresso');
  var txt = document.getElementById('progresso-txt');
  var barra = document.getElementById('barra-i');
  prog.style.display = 'block';
  var i = 0;
  function passo() {
    if (i < passos.length) {
      txt.textContent = passos[i];
      barra.style.width = Math.round((i / passos.length) * 100) + '%';
      i++;
      setTimeout(passo, 700);
      return;
    }
    barra.style.width = '100%';
    gs('carregarArquivosDemo').then(function (det) {
      prog.style.display = 'none';
      aplicarDetalhe(det);
      mostrarAvisos(det);
      toast(t('msgImportOk')(3));
    }).catch(function (e) {
      prog.style.display = 'none';
      toast(e.message, 'erro');
    });
  }
  passo();
}

/* troca as ações reais de upload pelas simuladas (remove os handlers originais).
   PRECISA rodar depois do ligarEventos() original — que é assíncrono, após o boot. */
function substituirUpload() {
  var dz = document.getElementById('dropzone');
  if (!dz) return;
  var clone = dz.cloneNode(true);
  dz.parentNode.replaceChild(clone, dz);
  clone.onclick = abrirModalUploadDemo;
  ['dragenter', 'dragover'].forEach(function (ev) {
    clone.addEventListener(ev, function (e) { e.preventDefault(); clone.classList.add('arrastando'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    clone.addEventListener(ev, function (e) {
      e.preventDefault();
      clone.classList.remove('arrastando');
      if (ev === 'drop') abrirModalUploadDemo();
    });
  });
}

/* visualização de documento: na demo não existe arquivo real */
visualizarDoc = function (id) {
  var d = docPorId(id);
  abrirModal(
    '<h3 class="modal-titulo">' + esc(t('tituloDocFicticio')) + '</h3>' +
    '<p style="color:var(--muted-2);font-size:13.5px;line-height:1.7">' + t('txtDocFicticio')(esc(d ? d.nomeOriginal : id)) + '</p>' +
    '<p style="color:var(--muted-2);font-size:12.5px">' + esc(t('txtDocFicticio2')) + '</p>' +
    '<div class="modal-acoes"><button class="btn btn-primary" id="vd-ok">' + esc(t('btnEntendi')) + '</button></div>');
  document.getElementById('vd-ok').onclick = fecharModal;
};

/* botão de tema */
(function ligarBotaoTema() {
  var btn = document.getElementById('btn-tema');
  if (!btn) return;
  aplicarTema(document.documentElement.getAttribute('data-theme') || 'dark');
  btn.onclick = function () {
    var atual = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    aplicarTema(atual);
  };
})();

/* boas-vindas após o carregamento inicial; ao fechar, entra a dica da Etapa 1 */
(function boasVindas() {
  var tentativas = 0;
  (function espera() {
    if (!window.App || !App.boot) {
      if (++tentativas > 50) return;
      return setTimeout(espera, 200);
    }
    substituirUpload(); // depois do ligarEventos() original
    mostrarDica(0, function () { mostrarDica(1); });
  })();
})();

</script>
