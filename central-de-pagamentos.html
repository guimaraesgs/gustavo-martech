<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Pagamentos — Demonstração Empresa ABC</title>
<meta name="description" content="Versão de demonstração da Central de Pagamentos (dados fictícios).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2300c46e'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' font-family='Arial' font-weight='bold' fill='%230a140d'%3ED%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   CENTRAL DE PAGAMENTOS DO MARKETING
   Folha de estilos — identidade visual digital (tema escuro padrão).
   Tokens do guia de identidade visual digital.
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Work+Sans:wght@300;400;500;600;700;800&display=swap');

:root{
  --green:#00c46e; --green-bright:#25e07f; --green-deep:#0a6b3f; --green-darker:#053c24;
  --navy:#16232f; --teal:#2b8f9c; --pink:#d9657f; --gold:#f0c040; --purple:#c267cc;
  --blue-soft:#a3c2dc; --green-light:#6cf396; --muted:#5d6b77; --muted-2:#8b97a1;
  --bg:#0a0f0d; --card:#111814; --card-2:#0a100d; --line:#1d2b25; --line-2:#1a2620;
  --text:#e7edf2;
  --display:'Work Sans',system-ui,sans-serif; --body:'Roboto',system-ui,sans-serif;
  --r-btn:8px; --r-card:18px; --r-soft:12px; --r-pill:999px;
  --shadow:0 16px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.55;font-size:14px}
h1,h2,h3,h4,h5{font-family:var(--display);margin:0}
a{color:var(--green-bright);text-decoration:none}
u{cursor:pointer}

/* ============ TOPBAR (sempre escura = marca) ============ */
.topbar{position:sticky;top:0;z-index:1000;background:rgba(10,15,13,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1440px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:20px}
.brand{display:flex;flex-direction:column;gap:3px}
.brand-nome{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.06em;color:#fff}
.brand-sub{font-family:var(--display);font-weight:600;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--green-bright);white-space:nowrap}
.topbar .doc-title{color:#aeb9c4;font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.04em;border-left:1px solid #24352c;padding-left:20px}
.topbar-acoes{margin-left:auto;display:flex;align-items:center;gap:10px}
.topbar-acoes .btn-ghost{white-space:nowrap}
.user-chip{font-family:var(--display);font-size:11.5px;font-weight:600;color:var(--text);background:var(--card-2);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:6px 14px;white-space:nowrap}
.interruptor-idioma{display:flex;background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:2px;flex-shrink:0}
.interruptor-idioma button{background:none;border:none;border-radius:8px;padding:6px 10px;font-size:11.5px;font-weight:800;
  letter-spacing:.06em;color:var(--muted-2);transition:all .15s;cursor:pointer;font-family:var(--display)}
.interruptor-idioma button.ativo{background:var(--card);color:var(--green-bright);box-shadow:0 2px 8px rgba(0,0,0,.12)}

/* ============ NAV ============ */
nav.tabs{position:sticky;top:55px;z-index:900;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs-inner{max-width:1440px;margin:0 auto;padding:10px 32px;display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{background:transparent;border:1px solid transparent;padding:9px 15px;border-radius:10px;cursor:pointer;
  font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-2);transition:all .18s ease}
nav.tabs button:hover{color:var(--text);border-color:var(--line)}
nav.tabs button.active{color:var(--green-bright);border-color:var(--green);background:rgba(0,196,110,.08)}

/* ============ LAYOUT ============ */
main{max-width:1440px;margin:0 auto;padding:0 32px 90px}
section.panel{display:none;animation:fade .3s ease}
section.panel.active{display:block}
.etapa{display:none;animation:fade .3s ease}
.etapa.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.sec-head{display:flex;align-items:baseline;gap:20px;border-bottom:1px solid var(--line);padding-bottom:16px;margin:34px 0 26px}
.sec-head .num{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.2em;color:var(--green);width:40px;flex-shrink:0}
.sec-head h2{font-weight:700;text-transform:uppercase;font-size:24px;letter-spacing:-.01em;color:var(--text)}
.sec-head .desc{margin-left:auto;color:var(--muted-2);font-size:13px;text-align:right;max-width:420px}

.eyebrow{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--green);
  margin:30px 0 14px;border-bottom:1px solid var(--line-2);padding-bottom:8px}
.note{background:var(--card-2);border:1px solid var(--line-2);border-left:3px solid var(--green);border-radius:var(--r-soft);
  padding:13px 16px;font-size:13px;color:var(--muted-2);margin:14px 0;line-height:1.6}
.note b{color:var(--text)}
.note.alerta{border-left-color:var(--gold)}
.note.erro{border-left-color:var(--pink)}
.hint-inline{font-size:12px;color:var(--muted-2)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:24px}
.grid{display:grid;gap:14px}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}

/* ============ BOTÕES ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 22px;border-radius:var(--r-btn);
  font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.04em;cursor:pointer;border:none;
  text-transform:uppercase;transition:transform .2s,opacity .2s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--green);color:#0a140d}
.btn-outline{background:transparent;color:var(--green-bright);border:1px solid var(--green)}
.btn-outline:hover{background:rgba(0,196,110,.1)}
.btn-secondary{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line)}
.btn-perigo{background:transparent;color:var(--pink);border:1px solid var(--pink)}
.btn-perigo:hover{background:rgba(217,101,127,.1)}
.btn-ghost{background:none;border:1px dashed var(--line);color:var(--green-bright);border-radius:10px;
  font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:9px 16px;cursor:pointer}
.btn-ghost:hover{border-color:var(--green)}
.btn-mini{padding:7px 13px;font-size:11.5px}
.acoes-linha{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* ============ FORMULÁRIO ============ */
.input{width:100%;background:var(--card-2);border:1px solid var(--line-2);border-radius:10px;padding:10px 13px;
  color:var(--text);font-family:var(--body);font-size:14px}
.input:focus{outline:none;border-color:var(--green)}
.input::placeholder{color:var(--muted)}
select.input option{background:var(--card);color:var(--text)}
.frm-label{display:block;font-family:var(--display);font-size:11.5px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--green-bright);margin-bottom:6px}
textarea.input{resize:vertical;min-height:90px;line-height:1.5}
input[type="date"].input,input[type="month"].input{color-scheme:dark}
.check-linha{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--text);cursor:pointer;margin:8px 0}
.check-linha input{width:16px;height:16px;accent-color:var(--green)}

/* ============ STEPPER ============ */
.stepper{display:flex;gap:8px;width:100%;margin-top:26px}
.step-dot{flex:1;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--line-2);
  background:var(--card-2);color:var(--muted-2);font-family:var(--display);font-size:11.5px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;cursor:default}
.step-dot span{width:20px;height:20px;border-radius:50%;background:var(--line-2);color:var(--text);
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.step-dot.active{border-color:var(--green);color:var(--green-bright)}
.step-dot.active span{background:var(--green);color:#0a140d}
.step-dot.done{cursor:pointer}
.step-dot.done span{background:rgba(0,196,110,.3);color:var(--green-bright)}
.step-dot em{font-style:normal}

/* ============ CABEÇALHO DO PROCESSO ============ */
.proc-cabecalho{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-soft);padding:12px 18px;margin-bottom:18px}
.proc-id{font-family:var(--display);font-weight:800;font-size:16px;color:var(--green-bright)}
.proc-meta{font-size:12.5px;color:var(--muted-2)}
.proc-meta b{color:var(--text)}

/* ============ DROPZONE / UPLOAD ============ */
.dropzone{border:2px dashed var(--line);border-radius:var(--r-card);background:var(--card-2);padding:34px 20px;
  text-align:center;cursor:pointer;transition:border-color .2s,background .2s;margin-bottom:14px}
.dropzone:hover,.dropzone.arrastando{border-color:var(--green);background:rgba(0,196,110,.05)}
.dz-icone{font-size:30px;color:var(--green-bright);margin-bottom:6px}
.dz-titulo{font-family:var(--display);font-weight:600;font-size:14px;color:var(--text)}
.dz-titulo u{color:var(--green-bright)}
.dz-sub{font-size:12px;color:var(--muted-2);margin-top:5px}
.progresso{margin:12px 0}
.progresso-txt{font-size:12.5px;color:var(--muted-2);margin-bottom:6px}
.barra{height:8px;border-radius:4px;background:var(--line-2);overflow:hidden}
.barra i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--green),var(--green-light));transition:width .25s}

/* checklist de documentos presentes/ausentes */
.checklist{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.chk-pill{display:inline-flex;align-items:center;gap:8px;border-radius:var(--r-pill);padding:7px 15px;
  font-family:var(--display);font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border:1px solid}
.chk-pill.ok{background:rgba(0,196,110,.1);border-color:rgba(0,196,110,.35);color:var(--green-bright)}
.chk-pill.falta{background:rgba(240,192,64,.08);border-color:rgba(240,192,64,.35);color:var(--gold)}

/* cards de documento */
.doc-card{display:flex;align-items:flex-start;gap:16px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-soft);padding:14px 18px;margin-bottom:10px;transition:border-color .2s}
.doc-card:hover{border-color:var(--muted)}
.doc-icone{width:42px;height:42px;border-radius:10px;background:var(--card-2);border:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:10px;
  color:var(--green-bright);flex-shrink:0;text-transform:uppercase}
.doc-corpo{flex:1;min-width:0}
.doc-nome{font-family:var(--display);font-weight:600;font-size:13.5px;color:var(--text);word-break:break-all}
.doc-meta{font-size:12px;color:var(--muted-2);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.doc-meta b{color:var(--text)}
.doc-acoes{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.doc-tipo-sel{width:auto;padding:6px 10px;font-size:12.5px}

/* ============ CARDS DE RESUMO (valores) ============ */
.grid-resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat-card{border-radius:22px;border:1px solid var(--line);background:var(--card);padding:16px 18px}
.stat-card .l{font-family:var(--display);font-size:10.5px;color:var(--muted-2);font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.stat-card .v{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.15;margin-top:7px;color:var(--text);word-break:break-word}
.stat-card .v.ok{background:linear-gradient(180deg,#6cf396,#18c06a 46%,#0a8048);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat-card .v.ruim{color:var(--pink)}
.stat-card .v.alerta{color:var(--gold)}
.stat-card .sub{font-size:11px;color:var(--muted-2);margin-top:5px}
.stat-card.destaque{border-color:rgba(0,196,110,.4)}

/* ============ BADGES E PÍLULAS DE STATUS ============ */
.status-pill{display:inline-block;font-family:var(--display);font-size:9px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;border-radius:var(--r-pill);padding:3px 9px;white-space:nowrap;border:1px solid}
.sp-cinza{color:var(--muted-2);border-color:#8b97a1;background:rgba(139,151,161,.1)}
.sp-ciano{color:#58c2cf;border-color:#58c2cf;background:rgba(88,194,207,.1)}
.sp-verde{color:var(--green-bright);border-color:#25e07f;background:rgba(0,196,110,.1)}
.sp-ambar{color:var(--gold);border-color:#f0c040;background:rgba(240,192,64,.1)}
.sp-rosa{color:var(--pink);border-color:#d9657f;background:rgba(217,101,127,.1)}
.sp-roxo{color:var(--purple);border-color:#c267cc;background:rgba(194,103,204,.1)}
.badge-conf{display:inline-block;padding:3px 9px;border-radius:6px;font-size:10px;font-family:var(--display);
  font-weight:600;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;border:1px solid}

/* ============ TOOLBAR E TABELAS ============ */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tb-busca{flex:2;min-width:220px}
.tb-sel{flex:1;min-width:150px;max-width:230px}
.toolbar-massa{background:var(--card-2);border:1px solid var(--line-2);border-radius:var(--r-soft);padding:9px 14px}
.sel-info{font-family:var(--display);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green-bright)}

.tabela-scroll{overflow:auto;max-height:65vh;border:1px solid var(--line);border-radius:var(--r-card);background:var(--card)}
table.tabela{width:100%;border-collapse:separate;border-spacing:0;min-width:1180px}
table.tabela th{position:sticky;top:0;z-index:5;background:var(--card-2);text-align:left;padding:10px;
  font-family:var(--display);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted-2);border-bottom:1px solid var(--line);white-space:nowrap;height:34px;box-sizing:border-box}
table.tabela td{padding:6px 10px;border-bottom:1px solid var(--line-2);font-size:12px;color:var(--text);vertical-align:middle;line-height:1.4}
table.tabela tr:last-child td{border-bottom:none}
table.tabela tbody tr:hover td{background:rgba(0,196,110,.04)}
table.tabela tr.sel td{background:rgba(0,196,110,.08)}
.th-num,.td-num{text-align:right !important;font-variant-numeric:tabular-nums;white-space:nowrap}
.th-check{width:34px}
.th-acoes{width:110px}
.td-campanha{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td-campanha:hover{white-space:normal;word-break:break-word}
.td-conta{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td-conta:hover{white-space:normal;word-break:break-word}
.td-per{white-space:nowrap;font-size:11px;color:var(--muted-2)}
.td-centro{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}
.td-regra{white-space:nowrap;font-size:11px;color:var(--muted-2)}

/* ordenação e filtros nas colunas */
th[data-sort]{cursor:pointer;user-select:none}
th[data-sort]:hover{color:var(--text)}
table.tabela thead tr.tr-filtros th{top:34px;padding:4px 6px;height:auto}
.filtro-col{width:100%;min-width:64px;background:var(--card-2);border:1px solid var(--line-2);border-radius:6px;
  padding:4px 7px;color:var(--text);font-family:var(--body);font-size:11px}
.filtro-col:focus{outline:none;border-color:var(--green)}
.filtro-col::placeholder{color:var(--muted)}

/* natureza editável na própria célula */
.td-natureza{cursor:pointer;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.td-natureza .nat-txt{border-bottom:1px dashed var(--line);padding-bottom:1px}
.td-natureza:hover .nat-txt{color:var(--green-bright);border-bottom-color:var(--green)}
.sel-inline{width:190px;font-size:12px;padding:4px 6px}
.mini-acao{background:none;border:1px solid var(--line);color:var(--muted-2);border-radius:7px;width:27px;height:27px;
  cursor:pointer;font-size:13px;line-height:1;transition:all .15s}
.mini-acao:hover{border-color:var(--green);color:var(--green-bright)}
.mini-acao.perigo:hover{border-color:var(--pink);color:var(--pink)}
.rodape-tabela{font-size:12px;color:var(--muted-2);margin-top:9px;display:flex;gap:18px;flex-wrap:wrap}
.vazio{padding:34px;text-align:center;color:var(--muted-2);font-size:13.5px}

/* ============ PAINÉIS DE DIVERGÊNCIA / AJUSTE ============ */
.painel-status{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-radius:var(--r-soft);padding:14px 18px;
  margin-bottom:14px;border:1px solid}
.painel-status.fechado{background:rgba(0,196,110,.07);border-color:rgba(0,196,110,.35)}
.painel-status.pendente{background:rgba(240,192,64,.06);border-color:rgba(240,192,64,.35)}
.painel-status.erro{background:rgba(217,101,127,.06);border-color:rgba(217,101,127,.35)}
.painel-status .ps-titulo{font-family:var(--display);font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.05em}
.painel-status.fechado .ps-titulo{color:var(--green-bright)}
.painel-status.pendente .ps-titulo{color:var(--gold)}
.painel-status.erro .ps-titulo{color:var(--pink)}
.painel-status .ps-info{font-size:13px;color:var(--muted-2)}
.painel-status .ps-info b{color:var(--text)}

.radio-linha{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.radio-linha label{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--text);cursor:pointer}
.radio-linha input{accent-color:var(--green)}

/* lista de distribuição do ajuste proporcional */
.dist-tabela{width:100%;border-collapse:collapse;margin-top:10px}
.dist-tabela td{padding:7px 10px;border-bottom:1px solid var(--line-2);font-size:12.5px}
.dist-tabela td:last-child{text-align:right;font-variant-numeric:tabular-nums}

/* ============ GATES DA CONFIRMAÇÃO ============ */
.gate{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.gate:last-child{border-bottom:none}
.gate .g-icone{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;flex-shrink:0;font-weight:700}
.gate.ok .g-icone{background:rgba(0,196,110,.15);color:var(--green-bright)}
.gate.falta .g-icone{background:rgba(240,192,64,.12);color:var(--gold)}
.gate.ok{color:var(--text)}
.gate.falta{color:var(--muted-2)}

/* ============ DETALHE / SUB-ABAS ============ */
.sub-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 16px}
.sub-tabs button{background:transparent;border:1px solid var(--line);padding:8px 14px;border-radius:10px;cursor:pointer;
  font-family:var(--display);font-weight:600;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-2)}
.sub-tabs button.active{color:var(--green-bright);border-color:var(--green);background:rgba(0,196,110,.08)}
.linha-info{display:flex;gap:10px;margin-bottom:8px;font-size:13.5px}
.linha-info .k{color:var(--green);font-family:var(--display);font-weight:600;width:210px;flex-shrink:0;font-size:12.5px}
.linha-info .v{color:var(--text);word-break:break-word}
.hist-item{padding:10px 0;border-bottom:1px solid var(--line-2);font-size:12.5px}
.hist-item:last-child{border-bottom:none}
.hist-meta{color:var(--muted-2);font-size:11.5px;margin-bottom:2px}
.hist-acao{color:var(--text);font-family:var(--display);font-weight:600}
.hist-det{color:var(--muted-2)}
.hist-det b{color:var(--text)}

/* ============ MODAIS ============ */
.modal-fundo{position:fixed;inset:0;background:rgba(4,8,6,.72);backdrop-filter:blur(3px);z-index:2000;
  display:flex;align-items:center;justify-content:center;padding:22px;animation:fade .2s ease}
.modal{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
  padding:28px;box-shadow:var(--shadow);width:100%;max-width:640px;max-height:92vh;overflow:auto}
.modal-larga{max-width:1000px}
.modal-x{position:absolute;top:10px;right:14px;background:none;border:none;color:var(--muted);font-size:26px;cursor:pointer;line-height:1}
.modal-x:hover{color:var(--text)}
.modal-titulo{font-family:var(--display);font-size:19px;font-weight:800;color:var(--text);margin-bottom:16px}
.modal .campo{margin-bottom:13px}
.modal-acoes{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.visualizador{width:100%;height:72vh;border:1px solid var(--line);border-radius:var(--r-soft);background:#000}

/* duplicidade */
.dup-box{background:rgba(240,192,64,.06);border:1px solid rgba(240,192,64,.35);border-radius:var(--r-soft);
  padding:13px 15px;margin-bottom:10px;font-size:13px}
.dup-box b{color:var(--gold)}
.dup-box .dup-meta{color:var(--muted-2);font-size:12px;margin-top:4px}

/* ============ TOASTS / OVERLAY ============ */
.toast-area{position:fixed;bottom:22px;right:22px;z-index:3000;display:flex;flex-direction:column;gap:9px;max-width:420px}
.toast{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:var(--r-soft);
  padding:13px 16px;font-size:13px;color:var(--text);box-shadow:var(--shadow);animation:fade .25s ease;white-space:pre-line}
.toast.erro{border-left-color:var(--pink)}
.toast.alerta{border-left-color:var(--gold)}
.overlay{position:fixed;inset:0;background:rgba(4,8,6,.6);backdrop-filter:blur(2px);z-index:4000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.overlay-txt{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2)}
.spinner{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ RESPONSIVO ============ */
@media(max-width:1320px){ .topbar .doc-title{display:none} }
@media(max-width:1000px){
  .topbar-inner,.tabs-inner{padding-left:16px;padding-right:16px}
  main{padding:0 16px 70px}
  .g-2,.g-3{grid-template-columns:1fr}
  .sec-head{flex-wrap:wrap}
  .sec-head .desc{margin-left:60px;text-align:left}
  .topbar .doc-title{display:none}
  .stepper{flex-direction:column}
  .linha-info{flex-direction:column;gap:2px}
  .linha-info .k{width:auto}
}

var IDIOMA = 'pt';

/** Texto da interface no idioma atual (cai para PT se faltar). */
function t(chave) {
  var v = (TEXTOS[IDIOMA] || TEXTOS.pt)[chave];
  if (v === undefined) v = TEXTOS.pt[chave];
  return v === undefined ? '' : v;
}

/** Traduz um valor canônico de dado (status, natureza contábil, regra…) só na exibição. */
function td(v) {
  if (v === null || v === undefined || v === '') return v;
  var m = t('mapDados');
  return (m && m[v] !== undefined) ? m[v] : v;
}

function localeAtual() { return IDIOMA === 'pt' ? 'pt-BR' : 'en-US'; }

/** Datas guardadas como DD/MM/AAAA (com hora opcional) viram MM/DD/YYYY em inglês. */
function fmtData(v) {
  var s = (v === null || v === undefined) ? '' : String(v);
  var m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})(.*)$/);
  if (!m) return s;
  return IDIOMA === 'pt' ? s : (m[2] + '/' + m[1] + '/' + m[3] + m[4]);
}

/** Período "01/07/2026 a 31/07/2026". */
function fmtPeriodo(v) {
  var p = String(v || '').split(' a ');
  if (p.length !== 2) return fmtData(v);
  return t('periodoDe')(fmtData(p[0]), fmtData(p[1]));
}

/** Troca o idioma da aplicação inteira e redesenha tudo que depende de texto. */
function definirIdioma(idioma) {
  IDIOMA = idioma;
  try { localStorage.setItem('demo_idioma', idioma); } catch (e) {}
  document.documentElement.lang = (idioma === 'pt' ? 'pt-BR' : 'en');
  document.getElementById('btnPT').classList.toggle('ativo', idioma === 'pt');
  document.getElementById('btnEN').classList.toggle('ativo', idioma === 'en');
  aplicarTextos();
  reconstruirInterface();
}

/** Escreve na tela todos os textos fixos marcados no HTML. */
function aplicarTextos() {
  document.title = t('tituloPagina');
  var meta = document.querySelector('meta[name="description"]');
  if (meta) meta.setAttribute('content', t('metaDescricao'));
  document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-html]').forEach(function (el) { el.innerHTML = t(el.getAttribute('data-i18n-html')); });
  document.querySelectorAll('[data-i18n-ph]').forEach(function (el) { el.placeholder = t(el.getAttribute('data-i18n-ph')); });
  document.querySelectorAll('[data-i18n-title]').forEach(function (el) { el.title = t(el.getAttribute('data-i18n-title')); });
  var ov = document.getElementById('overlay-txt');
  if (ov) ov.textContent = t('txtProcessando');
  if (typeof aplicarTema === 'function') aplicarTema(document.documentElement.getAttribute('data-theme') || 'dark');
}

/** Redesenha tudo que é gerado por JavaScript. */
function reconstruirInterface() {
  if (!window.App || !App.boot) return;
  popularSelectsBoot();
  if (App.det) {
    if (App.etapa === 1) renderEtapa1();
    else if (App.etapa === 2) renderEtapa2();
    else if (App.etapa === 3) renderEtapa3();
  }
  if (App.processos && App.processos.length) renderProcessos();
  var det = document.getElementById('view-detalhe');
  if (det && det.classList.contains('active') && App.det) renderDetalhe();
}

/** Primeiro carregamento: usa o salvo; sem escolha, detecta o idioma do navegador. */
function iniciarIdioma() {
  var idioma = 'pt';
  try {
    idioma = localStorage.getItem('demo_idioma') ||
      ((navigator.language || 'pt').toLowerCase().indexOf('pt') === 0 ? 'pt' : 'en');
  } catch (e) {}
  IDIOMA = idioma;
  document.documentElement.lang = (idioma === 'pt' ? 'pt-BR' : 'en');
  document.getElementById('btnPT').classList.toggle('ativo', idioma === 'pt');
  document.getElementById('btnEN').classList.toggle('ativo', idioma === 'en');
}
iniciarIdioma();

      lista.push(JSON.parse(JSON.stringify(anterior)));
      return lista;
    },
    gerarPreviaEmail: function () {
      var r = resumo();
      var grupos = r.porNaturezaCentro;
      var simples = grupos.length <= 1;
      var L = [];
      L.push(t('emailSaudacao'));
      L.push('');
      L.push(t('emailIntro')(simples, td(processo.plataforma), processo.competencia, fmtData(processo.dataPagamento)));
      L.push('');
      L.push(t('emailDadosTitulo'));
      L.push(t('emailLblFornecedor')(processo.fornecedor || td(processo.plataforma)));
      L.push(t('emailLblEstrategia')(td(processo.plataforma)));
      L.push(t('emailLblCompetencia')(processo.competencia));
      if (simples && grupos[0]) {
        L.push(t('emailLblNatureza')(td(grupos[0].natureza)));
        L.push(t('emailLblCentro')(td(grupos[0].centro)));
      }
      L.push(t('emailLblValorTotal')(fmtBRLx(r.valorOficial)));
      L.push(t('emailLblDataPagamento')(fmtData(processo.dataPagamento)));
      if (!simples) {
        L.push('');
        L.push(t('emailRateioTitulo'));
        grupos.forEach(function (g, i) {
          if (!g.valor) return;
          L.push('');
          L.push(t('emailNaturezaN')(i + 1));
          L.push(t('emailLblNatureza')(td(g.natureza)));
          L.push(t('emailLblCentro')(td(g.centro)));
          L.push(t('emailLblValor')(fmtBRLx(g.valor)));
        });
        L.push('');
        L.push(t('emailLblTotalLanc')(fmtBRLx(r.valorOficial)));
      }
      L.push('');
      L.push(t('emailAnexos'));
      L.push(t('emailPastaDemo'));
      L.push('');
      L.push(t('emailAtenciosamente'));
      L.push(t('emailAssinatura'));
      return {
        para: USUARIO, cc: '',
        assunto: t('emailAssunto')(simples, td(processo.plataforma), processo.competencia),
        corpo: L.join('\n'),
        anexos: docs.filter(function (d) { return d.status === 'Ativo'; }).map(function (d) {
          return { docId: d.id, nome: d.nomeSalvo, tamanhoKB: d.tamanhoKB, link: '#', incluido: true };
        }),
        avisoTamanho: '', limiteMB: 22
      };
    },
    enviarEmailLancamento: function (pid, pl) {
      if (pl.modo === 'rascunho') {
        return { ok: true, modo: 'rascunho', mensagem: t('msgRascunhoDemo'), excluidos: [] };
      }
      estado.status = 'E-mail enviado';
      processo.dataEmail = agoraDemo();
      processo.usuarioEmail = USUARIO;
      log('E-mail enviado (simulação)', { k: 'logPara', v: pl.para });
      var d = detalhe(); d.ok = true;
      d.mensagem = t('msgEmailDemo')(pl.para);
      d.excluidos = [];
      return d;
    },
    importarTextoColado: function () {
      var d = detalhe();
      d.avisos = [t('avisoTextoColado')];
      return d;
    }
  };

  // ----- ponte google.script.run -----
  function mk(succ, fail) {
    var h = {
      withSuccessHandler: function (s) { return mk(s, fail); },
      withFailureHandler: function (f) { return mk(succ, f); }
    };
    Object.keys(api).forEach(function (k) {
      h[k] = function () {
        var args = arguments;
        setTimeout(function () {
          try { succ(api[k].apply(null, args)); }
          catch (e) { (fail || function () { })({ message: e.message }); }
        }, 160);
      };
    });
    return h;
  }
  window.google = { script: { run: mk(function () { }, function (e) { console.error(e); }) } };
})();

</script>
<script>

/* ============================================================
   CENTRAL DE PAGAMENTOS DO MARKETING — Empresa ABC
   Script.html — lógica do front-end (SPA).
   ============================================================ */

var App = {
  boot: null,        // dados do getBootstrap
  det: null,         // detalhe do processo aberto {processo, documentos, itens, resumo, historico}
  etapa: 1,
  selecao: {},       // ids de itens selecionados
  processos: [],
  ocupado: false,
  ordenacao: { campo: '', dir: 1 }, // ordenação da tabela de rateio (clique no cabeçalho)
  filtrosCol: {}                    // filtros por coluna da tabela de rateio
};

/* ================= UTILITÁRIOS ================= */
function $(id) { return document.getElementById(id); }

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtBRL(n) {
  if (n === null || n === undefined || n === '' || isNaN(Number(n))) return '—';
  return Number(n).toLocaleString(localeAtual(), { style: 'currency', currency: 'BRL' });
}

function gs(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    var runner = google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(function (e) { reject(new Error(e && e.message ? e.message : String(e))); });
    runner[fn].apply(runner, args);
  });
}

/** Chamada ao servidor com overlay e proteção contra clique duplo. */
function chamar(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (App.ocupado) return Promise.reject(new Error(t('errOcupado')));
  App.ocupado = true;
  overlay(true);
  return gs.apply(null, [fn].concat(args)).finally(function () {
    App.ocupado = false;
    overlay(false);
  });
}

function overlay(on, txt) {
  $('overlay').style.display = on ? 'flex' : 'none';
  $('overlay-txt').textContent = txt || t('txtProcessando');
}

function toast(msg, tipo, ms) {
  var t = document.createElement('div');
  t.className = 'toast' + (tipo === 'erro' ? ' erro' : tipo === 'alerta' ? ' alerta' : '');
  t.textContent = msg;
  $('toast-area').appendChild(t);
  setTimeout(function () { t.remove(); }, ms || (tipo === 'erro' ? 9000 : 6000));
}

function mostrarAvisos(res) {
  if (res && res.avisos && res.avisos.length) {
    res.avisos.forEach(function (a) { toast(a, 'alerta', 10000); });
  }
}

function statusClasse(st) {
  var m = {
    'Rascunho': 'sp-cinza', 'Em revisão': 'sp-ciano', 'Divergente': 'sp-ambar', 'Fechado': 'sp-verde',
    'Confirmado': 'sp-verde', 'E-mail enviado': 'sp-cinza', 'Reaberto': 'sp-roxo',
    'Pendente': 'sp-ambar', 'Classificado automaticamente': 'sp-ciano', 'Revisão necessária': 'sp-ambar',
    'Não classificado': 'sp-rosa', 'Aprovado': 'sp-verde'
  };
  return m[st] || 'sp-cinza';
}
function pillStatus(st) { return '<span class="status-pill ' + statusClasse(st) + '">' + esc(st ? td(st) : '—') + '</span>'; }

function pillConfianca(c) {
  var cor = { 'Alta': ['#25e07f', 'rgba(0,196,110,.1)'], 'Média': ['#f0c040', 'rgba(240,192,64,.1)'],
    'Baixa': ['#d9657f', 'rgba(217,101,127,.1)'], 'Não identificado': ['#8b97a1', 'rgba(139,151,161,.1)'] }[c] || ['#8b97a1', 'rgba(139,151,161,.1)'];
  return '<span class="badge-conf" style="color:' + cor[0] + ';border-color:' + cor[0] + ';background:' + cor[1] + '">' + esc(c ? td(c) : '—') + '</span>';
}

/** Texto da campanha: itens de ajuste são remontados no idioma atual. */
function campanhaTxt(it) {
  if (it && it.ajuste) return t('rotuloAjuste')(td(it.ajuste.cat), it.ajuste.modo, it.ajuste.pct);
  return td(it ? it.campanha : '') || '';
}

/** Valor registrado no histórico: texto canônico ou frase com parâmetro. */
function logValor(v) {
  if (v && typeof v === 'object') {
    if (v.k === 'logPara') return t('logPara')(v.v);
    if (v.k === 'nItens') return t('nItens')(v.v);
    if (v.k === 'logMoeda') return t('logMoeda')(v.v);
    return '';
  }
  return td(v) || '';
}

function compParaMonth(comp) { // "08/2026" -> "2026-08"
  var m = String(comp || '').match(/^(\d{2})\/(\d{4})$/);
  return m ? m[2] + '-' + m[1] : '';
}
function monthParaComp(v) { // "2026-08" -> "08/2026"
  var m = String(v || '').match(/^(\d{4})-(\d{2})$/);
  return m ? m[2] + '/' + m[1] : '';
}
function dateParaBR(v) { // "2026-08-25" -> "25/08/2026"
  var m = String(v || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? m[3] + '/' + m[2] + '/' + m[1] : '';
}
function brParaDate(v) { // "25/08/2026" -> "2026-08-25"
  var m = String(v || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  return m ? m[3] + '-' + m[2] + '-' + m[1] : '';
}

/* ================= MODAIS ================= */
function abrirModal(html) {
  $('modal-conteudo').innerHTML = html;
  $('modal-fundo').style.display = 'flex';
}
function fecharModal() {
  $('modal-fundo').style.display = 'none';
  $('modal-conteudo').innerHTML = '';
}
function confirmarModal(titulo, msg, rotuloOk, perigo) {
  return new Promise(function (resolve) {
    abrirModal(
      '<h3 class="modal-titulo">' + esc(titulo) + '</h3>' +
      '<p style="color:var(--muted-2);font-size:13.5px;line-height:1.6;white-space:pre-line">' + esc(msg) + '</p>' +
      '<div class="modal-acoes">' +
      '<button class="btn btn-secondary" id="m-cancelar">' + esc(t('btnCancelar')) + '</button>' +
      '<button class="btn ' + (perigo ? 'btn-perigo' : 'btn-primary') + '" id="m-ok">' + esc(rotuloOk || t('btnConfirmar')) + '</button>' +
      '</div>');
    $('m-cancelar').onclick = function () { fecharModal(); resolve(false); };
    $('m-ok').onclick = function () { fecharModal(); resolve(true); };
  });
}

/** Normalização para comparação tolerante (igual à do servidor): sem acentos, caixa e pontuação. */
function normCli(s) {
  try {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();
  } catch (e) {
    return String(s || '').toLowerCase().trim();
  }
}

/**
 * Monta as <option> de uma lista, com o valor ATUAL selecionado (comparação
 * tolerante a acentos/formatação). Se o valor atual não estiver na lista, ele
 * entra como opção extra para não se perder. rotuloVazio null = sem opção vazia.
 */
function opcoesLista(lista, valorAtual, rotuloVazio) {
  var atualNorm = normCli(valorAtual);
  var achou = false;
  var h = (rotuloVazio === null) ? '' : '<option value="">' + esc(rotuloVazio) + '</option>';
  (lista || []).forEach(function (n) {
    var sel = atualNorm && normCli(n.rotulo) === atualNorm;
    if (sel) achou = true;
    h += '<option value="' + esc(n.rotulo) + '"' + (sel ? ' selected' : '') + '>' + esc(td(n.rotulo)) + '</option>';
  });
  if (valorAtual && !achou) {
    h += '<option value="' + esc(valorAtual) + '" selected>' + esc(t('sufForaLista')(td(valorAtual))) + '</option>';
  }
  return h;
}
function selectNaturezas(id, valorAtual, rotuloVazio) {
  return '<select class="input" id="' + id + '">' + opcoesLista(App.boot.naturezas, valorAtual, rotuloVazio === undefined ? t('optNaoAlterar') : rotuloVazio) + '</select>';
}
function selectCentros(id, valorAtual, rotuloVazio) {
  return '<select class="input" id="' + id + '">' + opcoesLista(App.boot.centros, valorAtual, rotuloVazio === undefined ? t('optNaoAlterar') : rotuloVazio) + '</select>';
}

/* ================= INICIALIZAÇÃO ================= */
window.addEventListener('load', function () {
  aplicarTextos();
  overlay(true, t('txtCarregando'));
  gs('getBootstrap').then(function (boot) {
    App.boot = boot;
    $('user-chip').textContent = boot.usuario;
    /* demo: sem fonte de dados externa */

    popularSelectsBoot();

    // competência padrão: mês atual; pagamento sugerido: dia configurado
    var hoje = new Date();
    var mesAtual = hoje.getFullYear() + '-' + ('0' + (hoje.getMonth() + 1)).slice(-2);
    $('f-competencia').value = mesAtual;
    sugerirDataPagamento();

    ligarEventos();
    overlay(false);
  }).catch(function (e) {
    overlay(false);
    document.body.innerHTML = '<div style="max-width:520px;margin:80px auto;background:#111814;border:1px solid #1d2b25;border-radius:18px;padding:36px;font-family:Roboto,sans-serif;color:#e7edf2">' +
      '<h2 style="font-family:\'Work Sans\',sans-serif;color:#25e07f;text-transform:uppercase;font-size:18px">' + esc(t('errTituloInicio')) + '</h2>' +
      '<p style="color:#8b97a1;font-size:13px">' + esc(t('errCorpoInicio')) + '</p></div>';
  });
});

/** (Re)constrói os selects alimentados pelo bootstrap, já no idioma atual. */
function popularSelectsBoot() {
  var boot = App.boot;
  if (!boot) return;
  function encher(sel, itens, rotuloVazio, valorPadrao) {
    if (!sel) return;
    var atual = sel.value || valorPadrao || '';
    sel.innerHTML = (rotuloVazio === null) ? '' : '<option value="">' + esc(rotuloVazio) + '</option>';
    itens.forEach(function (it) {
      var o = document.createElement('option');
      o.value = it.valor;
      o.textContent = it.rotulo;
      sel.appendChild(o);
    });
    sel.value = atual;
    if (!sel.value && rotuloVazio === null && sel.options.length) sel.selectedIndex = 0;
  }
  var plats = boot.plataformas.map(function (p) { return { valor: p, rotulo: td(p) }; });
  encher($('f-plataforma'), plats, null);
  encher($('c-plataforma'), plats, t('optPlataformaTodas'));
  encher($('c-status'), boot.statusProcesso.map(function (st) { return { valor: st, rotulo: td(st) }; }), t('optStatusTodos'));
  encher($('f-centro'), boot.centros.map(function (c) { return { valor: c.rotulo, rotulo: td(c.rotulo) }; }), null, boot.centroPadrao);
}

function sugerirDataPagamento() {
  var comp = $('f-competencia').value; // aaaa-mm
  if (!comp) return;
  var dia = ('0' + (App.boot ? App.boot.diaPagamentoPadrao : 25)).slice(-2);
  $('f-pagamento').value = comp + '-' + dia;
}

function ligarEventos() {
  $('nav-novo').onclick = function () { mostrarView('novo'); };
  $('nav-consulta').onclick = function () { mostrarView('consulta'); buscarProcessos(); };
  $('btn-recarregar-cfg').onclick = recarregarConfiguracoes;

  $('f-competencia').onchange = sugerirDataPagamento;
  $('btn-criar-processo').onclick = criarProcesso;
  $('btn-ir-revisao').onclick = function () { setEtapa(2); };
  $('btn-voltar-1').onclick = function () { setEtapa(1); };
  $('btn-ir-confirmacao').onclick = function () { setEtapa(3); };
  $('btn-voltar-2').onclick = function () { setEtapa(2); };

  // dropzone
  var dz = $('dropzone');
  dz.onclick = function () { $('input-arquivos').click(); };
  $('input-arquivos').onchange = function () {
    var files = Array.prototype.slice.call(this.files || []);
    this.value = '';
    importarArquivos(files);
  };
  ['dragenter', 'dragover'].forEach(function (ev) {
    dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add('arrastando'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove('arrastando'); });
  });
  dz.addEventListener('drop', function (e) {
    importarArquivos(Array.prototype.slice.call(e.dataTransfer.files || []));
  });

  // tabela de itens
  $('busca-itens').oninput = renderItens;
  $('filtro-status-item').onchange = renderItens;
  $('filtro-natureza-item').onchange = renderItens;
  $('filtro-centro-item').onchange = renderItens;
  $('btn-limpar-filtros').onclick = function () {
    $('busca-itens').value = ''; $('filtro-status-item').value = '';
    $('filtro-natureza-item').value = ''; $('filtro-centro-item').value = '';
    App.filtrosCol = {};
    App.ordenacao = { campo: '', dir: 1 };
    Array.prototype.forEach.call(document.querySelectorAll('#tabela-itens .filtro-col'), function (i) { i.value = ''; });
    renderItens();
  };

  // ordenação ao clicar no cabeçalho + filtros por coluna
  Array.prototype.forEach.call(document.querySelectorAll('#tabela-itens th[data-sort]'), function (th) {
    th.title = t('tituloOrdenar');
    th.onclick = function () {
      var campo = th.getAttribute('data-sort');
      if (App.ordenacao.campo === campo) App.ordenacao.dir = -App.ordenacao.dir;
      else App.ordenacao = { campo: campo, dir: 1 };
      renderItens();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('#tabela-itens .filtro-col'), function (inp) {
    inp.oninput = function () {
      App.filtrosCol[inp.getAttribute('data-col')] = inp.value;
      renderItens();
    };
  });
  $('check-todos').onchange = function () {
    var marcar = this.checked;
    itensFiltrados().forEach(function (it) {
      if (marcar) App.selecao[it.id] = true; else delete App.selecao[it.id];
    });
    renderItens();
  };
  $('btn-limpar-sel').onclick = function () { App.selecao = {}; renderItens(); };
  $('btn-aprovar-sel').onclick = function () { aprovarIds(Object.keys(App.selecao)); };
  $('btn-desaprovar-sel').onclick = function () { desaprovarIds(Object.keys(App.selecao)); };
  $('btn-massa-sel').onclick = abrirModalMassa;
  $('btn-aprovar-validos').onclick = aprovarValidos;
  $('btn-reclassificar').onclick = reclassificar;
  $('btn-item-manual').onclick = abrirModalItemManual;
  $('btn-colar-dados').onclick = abrirModalColarDados;

  // consulta
  $('btn-buscar').onclick = buscarProcessos;
  $('c-texto').onkeydown = function (e) { if (e.key === 'Enter') buscarProcessos(); };
  $('btn-filtros-avancados').onclick = function () {
    var f = $('filtros-avancados');
    f.style.display = f.style.display === 'none' ? 'flex' : 'none';
  };

  // modais
  $('modal-x').onclick = fecharModal;
  $('modal-fundo').addEventListener('click', function (e) { if (e.target === this) fecharModal(); });
  $('visualizador-x').onclick = fecharVisualizador;
  $('visualizador-fundo').addEventListener('click', function (e) { if (e.target === this) fecharVisualizador(); });

  // botão "Editar dados" do cabeçalho do processo (aparece em várias telas)
  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('.btn-editar-proc')) abrirModalEditarProcesso();
  });
  $('btn-novo-processo').onclick = function () {
    confirmarModal(t('tituloOutroProcesso'), t('msgOutroProcesso'), t('btnIniciarNovo'))
      .then(function (ok) { if (ok) resetWizard(); });
  };
}

function recarregarConfiguracoes() {
  chamar('limparCacheConfiguracoes').then(function () {
    return gs('getBootstrap');
  }).then(function (boot) {
    App.boot = boot;
    toast(t('msgConfigRecarregadas'));
  }).catch(function (e) { toast(e.message, 'erro'); });
}

/* ================= NAVEGAÇÃO ================= */
function mostrarView(nome) {
  ['novo', 'consulta', 'detalhe'].forEach(function (v) {
    $('view-' + v).classList.toggle('active', v === nome);
  });
  $('nav-novo').classList.toggle('active', nome === 'novo');
  $('nav-consulta').classList.toggle('active', nome === 'consulta' || nome === 'detalhe');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setEtapa(n) {
  if (n > 1 && !App.det) { toast(t('avisoCrieProcesso'), 'alerta'); return; }
  App.etapa = n;
  [1, 2, 3].forEach(function (i) {
    $('etapa-' + i).classList.toggle('active', i === n);
    var dot = document.querySelector('.step-dot[data-step="' + i + '"]');
    dot.classList.toggle('active', i === n);
    dot.classList.toggle('done', i < n);
  });
  document.querySelectorAll('.step-dot.done').forEach(function (d) {
    d.onclick = function () { setEtapa(Number(d.getAttribute('data-step'))); };
  });
  if (n === 1) renderEtapa1();
  if (n === 2) renderEtapa2();
  if (n === 3) renderEtapa3();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function aplicarDetalhe(det) {
  App.det = det;
  if (App.etapa === 1) renderEtapa1();
  else if (App.etapa === 2) renderEtapa2();
  else if (App.etapa === 3) renderEtapa3();
}

function cabecalhoProcessoHtml() {
  var p = App.det.processo;
  var editavel = ['Rascunho', 'Em revisão', 'Divergente', 'Fechado', 'Reaberto'].indexOf(p.status) >= 0;
  return '<span class="proc-id">' + esc(p.id) + '</span>' +
    '<span class="proc-meta"><b>' + esc(td(p.plataforma)) + '</b>' + (p.fornecedor ? ' · ' + esc(p.fornecedor) : '') + '</span>' +
    '<span class="proc-meta">' + t('lblCompetenciaProc')(esc(p.competencia)) + '</span>' +
    '<span class="proc-meta">' + t('lblPagamentoProc')(esc(fmtData(p.dataPagamento) || '—')) + '</span>' +
    pillStatus(p.status) +
    '<span style="flex:1"></span>' +
    (editavel ? '<button class="btn-ghost btn-mini btn-editar-proc">' + esc(t('btnEditarDados')) + '</button>' : '') +
    (p.linkPasta ? '<a class="btn-ghost btn-mini" href="' + esc(p.linkPasta) + '">' + esc(t('btnPastaDocs')) + '</a>' : '');
}

function abrirModalEditarProcesso() {
  var p = App.det.processo;
  abrirModal(
    '<h3 class="modal-titulo">' + esc(t('tituloEditarProcesso')(p.id)) + '</h3>' +

/* ---------- upload ---------- */
function lerArquivoBase64(file) {
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onload = function () { resolve(String(r.result).split(',')[1] || ''); };
    r.onerror = function () { reject(new Error(t('errLerArquivo')(file.name))); };
    r.readAsDataURL(file);
  });
}

function importarArquivos(files) {
  if (!App.det) { toast(t('avisoCrieAntes'), 'alerta'); return; }
  if (!files.length) return;
  var maxMB = App.boot.tamanhoMaxArquivoMB || 20;
  var validos = [];
  files.forEach(function (f) {
    var ext = (f.name.split('.').pop() || '').toLowerCase();
    if (['pdf', 'xlsx', 'csv', 'png', 'jpg', 'jpeg', 'zip'].indexOf(ext) < 0) {
      toast(t('errFormato')(f.name), 'erro');
    } else if (f.size > maxMB * 1024 * 1024) {
      toast(t('errTamanho')(f.name, Math.round(f.size / 1024 / 1024), maxMB), 'erro');
    } else validos.push(f);
  });
  if (!validos.length) return;

  var prog = $('progresso'); prog.style.display = 'block';
  var idx = 0, sucesso = 0, falha = 0;

  function proximo() {
    if (idx >= validos.length) {
      prog.style.display = 'none';
      if (falha) toast(t('msgImportParcial')(sucesso, falha), 'alerta');
      else toast(t('msgImportOk')(sucesso));
      return;
    }
    var f = validos[idx];
    $('progresso-txt').textContent = t('txtImportando')(idx + 1, validos.length, f.name);
    $('barra-i').style.width = Math.round(idx / validos.length * 100) + '%';

    lerArquivoBase64(f).then(function (b64) {
      return enviarArquivo({ nome: f.name, mimeType: f.type || 'application/octet-stream', base64: b64 });
    }).then(function () {
      sucesso++;
      idx++;
      $('barra-i').style.width = Math.round(idx / validos.length * 100) + '%';
      proximo();
    }).catch(function (e) {
      falha++;
      toast('"' + f.name + '": ' + e.message, 'erro');
      if (/não encontrado/i.test(e.message || '')) {
        toast(t('avisoProcessoInexistente'), 'alerta', 12000);
      }
      idx++;
      proximo();
    });
  }
  proximo();
}

function enviarArquivo(payload) {
  return gs('importarArquivo', App.det.processo.id, payload).then(function (res) {
    if (res && res.duplicidades && !res.importado) {
      return tratarDuplicidade(payload, res.duplicidades);
    }
    aplicarDetalhe(res);
    mostrarAvisos(res);
    return res;
  });
}

function tratarDuplicidade(payload, dups) {
  return new Promise(function (resolve, reject) {
    var h = '<h3 class="modal-titulo">' + esc(t('tituloDuplicidade')) + '</h3>';
    dups.forEach(function (d) {
      h += '<div class="dup-box"><b>' + esc(d.arquivo) + '</b> — ' + esc(d.motivo) + '.' +
        '<div class="dup-meta">' + t('txtDupRegistro')(esc(d.processoAnterior || '—')) +
        (d.dataAnterior ? esc(t('txtDupImportadoEm')(fmtData(d.dataAnterior))) : '') +
        (d.usuarioAnterior ? esc(t('txtDupPor')(d.usuarioAnterior)) : '') +
        (d.linkAnterior ? ' · <a href="' + esc(d.linkAnterior) + '">' + esc(t('linkDocAnterior')) + '</a>' : '') +
        '</div></div>';
    });
    h += '<div class="campo"><label class="frm-label">' + esc(t('lblJustDuplicidade')) + '</label>' +
      '<textarea class="input" id="dup-justificativa" placeholder="' + esc(t('phJustDuplicidade')) + '"></textarea></div>' +
      '<div class="modal-acoes">' +
      '<button class="btn btn-secondary" id="dup-cancelar">' + esc(t('btnCancelarImport')) + '</button>' +
      '<button class="btn btn-primary" id="dup-continuar">' + esc(t('btnImportarAssim')) + '</button>' +
      '</div>';
    abrirModal(h);
    $('dup-cancelar').onclick = function () {
      fecharModal();
      toast(t('msgImportCancelada')(payload.nome), 'alerta');
      resolve(null);
    };
    $('dup-continuar').onclick = function () {
      var j = $('dup-justificativa').value.trim();
      if (!j) { toast(t('avisoInformeJust'), 'alerta'); return; }
      fecharModal();
      payload.forcar = true;
      payload.justificativa = j;
      gs('importarArquivo', App.det.processo.id, payload).then(function (res) {
        aplicarDetalhe(res);
        mostrarAvisos(res);
        resolve(res);
      }).catch(reject);
    };
  });
}

function renderResumoCards() {

      '<div class="v ' + (classe || '') + '">' + valor + '</div>' +
      (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
  }
  var difClasse = r.diferenca === null ? '' : (Math.abs(r.diferenca) <= r.tolerancia ? 'ok' : 'ruim');
  var pct = (r.percentualDiferenca === null || r.percentualDiferenca === undefined) ? null : r.percentualDiferenca;
  var h = card(esc(t('cardBoleto')), fmtBRL(r.valorBoleto)) +
    card(esc(t('cardNota')), fmtBRL(r.valorNota)) +
    card(esc(t('cardFatura')), fmtBRL(r.valorFatura)) +
    card(esc(t('cardRelatorio')), fmtBRL(r.valorRelatorio)) +
    card(esc(t('cardValorOficial')), fmtBRL(r.valorOficial), 'ok', esc(r.valorOficialDefinido ? t('subDefinidoManual') : (r.oficialAutomatico ? t('subAdotadoAuto') : '')), true) +
    card(esc(t('cardTotalRateado')), fmtBRL(r.valorRateado)) +
    card(esc(t('cardDiferenca')), fmtBRL(r.diferenca), difClasse, esc(t('subDiferenca')(pct, fmtBRL(r.tolerancia))));
  $('cards-resumo').innerHTML = h;
}

function renderPainelOficial() {
  var r = App.det.resumo;

  var opcoes = [];
  if (r.valorBoleto !== null) opcoes.push(['boleto', t('optFonteBoleto')(fmtBRL(r.valorBoleto))]);
  if (r.valorNota !== null) opcoes.push(['nota', t('optFonteNota')(fmtBRL(r.valorNota))]);
  if (r.valorFatura !== null) opcoes.push(['fatura', t('optFonteFatura')(fmtBRL(r.valorFatura))]);

  if (!r.docsOficiaisDivergentes && r.valorOficial !== null && !r.valorOficialDefinido) {

    '<div class="ps-titulo">' + esc(titulo) + '</div>' +

function renderPainelDivergencia() {
  var r = App.det.resumo;

  var temAjustes = (r.impostosETaxas || 0) !== 0 || (r.descontosEAbatimentos || 0) !== 0 || (r.ajustesDiferenca || 0) !== 0;
  var botoes = '<div class="acoes-linha" style="margin-top:10px">' +

    (temAjustes ? '<button class="btn-ghost btn-mini" id="btn-remover-ajustes">' + esc(t('btnRemoverAjustes')) + '</button>' : '') +
    '</div>';

  var h = '';
  if (r.statusFechamento === 'Fechado') {
    h = '<div class="painel-status fechado"><div><div class="ps-titulo">' + esc(t('psFechado')) + '</div>' +
      '<div class="ps-info">' + t('psInfoFechado')(fmtBRL(r.valorOficial), fmtBRL(r.valorRateado), fmtBRL(r.diferenca)) + '</div>' +
      (temAjustes ? '<div class="ps-info">' + t('psInfoAjustes')(fmtBRL(r.impostosETaxas), fmtBRL(r.descontosEAbatimentos), fmtBRL(r.ajustesDiferenca)) + '</div>' : '') +

/* ---------- filtros e tabela de itens ---------- */
function popularFiltrosItens() {
  var stSel = $('filtro-status-item'), natSel = $('filtro-natureza-item'), cenSel = $('filtro-centro-item');
  var stAtual = stSel.value, natAtual = natSel.value, cenAtual = cenSel.value;
  var sts = {}, nats = {}, cens = {};
  App.det.itens.forEach(function (it) {
    if (it.status) sts[it.status] = 1;
    if (it.natureza) nats[it.natureza] = 1;
    if (it.centro) cens[it.centro] = 1;
  });
  function preencher(sel, obj, rotulo, atual) {
    sel.innerHTML = '<option value="">' + esc(rotulo) + '</option>';
    Object.keys(obj).sort().forEach(function (k) {
      var o = document.createElement('option'); o.value = k; o.textContent = td(k);
      if (k === atual) o.selected = true;
      sel.appendChild(o);
    });
  }
  preencher(stSel, sts, t('optStatusTodos'), stAtual);
  preencher(natSel, nats, t('optNaturezaTodas'), natAtual);
  preencher(cenSel, cens, t('optCentroTodos'), cenAtual);
}

function itensFiltrados() {
  var busca = ($('busca-itens').value || '').toLowerCase();
  var st = $('filtro-status-item').value;
  var nat = $('filtro-natureza-item').value;
  var cen = $('filtro-centro-item').value;
  var fc = App.filtrosCol || {};
  return App.det.itens.filter(function (it) {
    if (st && it.status !== st) return false;
    if (nat && it.natureza !== nat) return false;
    if (cen && it.centro !== cen) return false;
    if (busca) {
      var alvo = (campanhaTxt(it) + ' ' + td(it.conta) + ' ' + td(it.projeto) + ' ' + td(it.natureza) + ' ' + td(it.centro) + ' ' +
        (it.valorFinal === null ? '' : String(it.valorFinal).replace('.', ','))).toLowerCase();
      if (alvo.indexOf(busca) < 0) return false;
    }
    for (var col in fc) {
      var f = String(fc[col] || '').trim().toLowerCase();
      if (!f) continue;
      var v;
      if (col === 'valor') v = (it.valorFinal === null ? '' : String(it.valorFinal).replace('.', ',') + ' ' + fmtBRL(it.valorFinal));
      else if (col === 'campanha') v = campanhaTxt(it);
      else v = td(it[col]);
      if (String(v || '').toLowerCase().indexOf(f) < 0) return false;
    }
    return true;
  });
}

function renderItens() {
  var itens = itensFiltrados().slice();

  // ordenação pelo cabeçalho clicado
  var ord = App.ordenacao;
  if (ord && ord.campo) {
    itens.sort(function (a, b) {
      if (ord.campo === 'valorFinal') {
        var va = a.valorFinal === null ? -Infinity : a.valorFinal;
        var vb = b.valorFinal === null ? -Infinity : b.valorFinal;
        return (va - vb) * ord.dir;
      }
      var ca = ord.campo === 'campanha' ? campanhaTxt(a) : td(a[ord.campo]);
      var cb = ord.campo === 'campanha' ? campanhaTxt(b) : td(b[ord.campo]);
      return String(ca || '').localeCompare(String(cb || ''), IDIOMA === 'pt' ? 'pt' : 'en', { sensitivity: 'base' }) * ord.dir;
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('#tabela-itens th[data-sort]'), function (th) {
    var base = th.getAttribute('data-i18n') ? t(th.getAttribute('data-i18n')) : th.textContent;
    th.title = t('tituloOrdenar');
    th.textContent = base + (ord.campo === th.getAttribute('data-sort') ? (ord.dir > 0 ? ' ▲' : ' ▼') : '');
  });

  var tbody = $('tbody-itens');
  if (!itens.length) {
    tbody.innerHTML = '<tr><td colspan="13" class="vazio">' + esc(App.det.itens.length ? t('vazioItensFiltro') : t('vazioItens')) + '</td></tr>';
  } else {
    var h = '';
    itens.forEach(function (it) {
      var sel = !!App.selecao[it.id];
      var aprovado = it.status === 'Aprovado' || it.status === 'Confirmado';
      var nat = td(it.natureza), cen = td(it.centro), camp = campanhaTxt(it);
      var celNatureza = aprovado
        ? '<td class="td-natureza" title="' + esc(nat) + '">' + (nat ? esc(nat) : '—') + '</td>'
        : '<td class="td-natureza" data-natcell="' + esc(it.id) + '" title="' + esc(t('tituloAlterarNatureza')) + '">' +
          '<span class="nat-txt">' + (nat ? esc(nat) : '<span style="color:var(--pink)">' + esc(t('txtDefinir')) + '</span>') + '</span></td>';
      var celCentro = aprovado
        ? '<td class="td-centro" title="' + esc(cen) + '">' + esc(cen || '—') + '</td>'
        : '<td class="td-centro td-natureza" data-cencell="' + esc(it.id) + '" title="' + esc(t('tituloAlterarCentro')) + '">' +
          '<span class="nat-txt">' + (cen ? esc(cen) : '<span style="color:var(--pink)">' + esc(t('txtDefinir')) + '</span>') + '</span></td>';
      h += '<tr class="' + (sel ? 'sel' : '') + '">' +
        '<td><input type="checkbox" data-sel="' + esc(it.id) + '"' + (sel ? ' checked' : '') + '></td>' +
        '<td>' + pillStatus(it.status) + '</td>' +
        '<td class="td-conta" title="' + esc(td(it.conta)) + '">' + esc(td(it.conta) || '—') + '</td>' +
        '<td class="td-campanha" title="' + esc(camp) + '">' + esc(camp) + '</td>' +
        '<td>' + esc(td(it.projeto) || td('Matriz')) + '</td>' +
        '<td class="td-per">' + esc(it.periodo ? fmtPeriodo(it.periodo) : '—') + '</td>' +
        '<td class="td-num">' + fmtBRL(it.valorFinal) + (it.ajusteAplicado ? '<div style="font-size:10px;color:var(--muted-2)">' + esc(t('txtOriginal')(fmtBRL(it.valorOriginal))) + '</div>' : '') + '</td>' +
        celCentro +
        celNatureza +
        '<td>' + pillConfianca(it.confianca) + '</td>' +
        '<td style="font-size:11px;color:var(--muted-2);max-width:130px;overflow:hidden;text-overflow:ellipsis" title="' + esc(it.observacao) + '">' + esc(it.observacao || '') + '</td>' +
        '<td class="td-regra" title="' + esc(td(it.regra)) + '">' + esc(td(it.regra) || '—') + '</td>' +
        '<td>' +
          (aprovado
            ? '<button class="mini-acao" title="' + esc(t('tituloDesfazer')) + '" data-desaprovar="' + esc(it.id) + '">↩</button>'
            : '<button class="mini-acao" title="' + esc(t('tituloAprovar')) + '" data-aprovar="' + esc(it.id) + '">✓</button>' +
              '<button class="mini-acao" title="' + esc(t('tituloEditar')) + '" data-editar-item="' + esc(it.id) + '">✎</button>') +
          '<button class="mini-acao perigo" title="' + esc(t('tituloRemover')) + '" data-remover-item="' + esc(it.id) + '">🗑</button>' +
        '</td>' +
      '</tr>';
    });
    tbody.innerHTML = h;
  }

  Array.prototype.forEach.call(tbody.querySelectorAll('[data-sel]'), function (cb) {
    cb.onchange = function () {
      var id = this.getAttribute('data-sel');
      if (this.checked) App.selecao[id] = true; else delete App.selecao[id];
      atualizarSelInfo();
      this.closest('tr').classList.toggle('sel', this.checked);
    };
  });
  Array.prototype.forEach.call(tbody.querySelectorAll('[data-aprovar]'), function (b) {
    b.onclick = function () { aprovarIds([this.getAttribute('data-aprovar')]); };
  });
  Array.prototype.forEach.call(tbody.querySelectorAll('[data-desaprovar]'), function (b) {
    b.onclick = function () { desaprovarIds([this.getAttribute('data-desaprovar')]); };
  });
  Array.prototype.forEach.call(tbody.querySelectorAll('[data-editar-item]'), function (b) {
    b.onclick = function () { abrirModalEditarItem(this.getAttribute('data-editar-item')); };
  });
  Array.prototype.forEach.call(tbody.querySelectorAll('[data-remover-item]'), function (b) {
    b.onclick = function () { removerItemUi(this.getAttribute('data-remover-item')); };
  });
  Array.prototype.forEach.call(tbody.querySelectorAll('[data-natcell]'), function (td) {
    td.onclick = function () { editarCelulaInline(td, td.getAttribute('data-natcell'), 'natureza'); };
  });
  Array.prototype.forEach.call(tbody.querySelectorAll('[data-cencell]'), function (td) {
    td.onclick = function () { editarCelulaInline(td, td.getAttribute('data-cencell'), 'centro'); };
  });

  var r = App.det.resumo;
  $('rodape-itens').innerHTML =
    '<span>' + esc(t('rodapeExibidos')(itens.length, App.det.itens.length)) + '</span>' +
    '<span>' + t('rodapeAprovados')(r.itensAprovados, r.totalItens) + '</span>' +
    '<span>' + t('rodapeSemClass')(r.itensSemClassificacao, r.itensSemClassificacao ? 'var(--pink)' : 'var(--text)') + '</span>' +
    '<span>' + t('rodapeSoma')(fmtBRL(itens.reduce(function (s, i) { return s + (i.valorFinal || 0); }, 0))) + '</span>';
  atualizarSelInfo();
}

function itemPorId(id) {
  for (var i = 0; i < App.det.itens.length; i++) if (App.det.itens[i].id === id) return App.det.itens[i];
  return null;
}

/** Editor de natureza/centro dentro da própria célula da tabela. */
function editarCelulaInline(td, id, campo) {
  var it = itemPorId(id);
  if (!it || td.querySelector('select')) return;
  var ehNatureza = campo === 'natureza';
  var sel = document.createElement('select');
  sel.className = 'input sel-inline';
  sel.innerHTML = opcoesLista(ehNatureza ? App.boot.naturezas : App.boot.centros,
    ehNatureza ? it.natureza : it.centro,
    ehNatureza ? t('optSemNatureza') : t('optSemCentro'));
  td.innerHTML = '';
  td.appendChild(sel);
  sel.focus();
  var confirmado = false;
  sel.onchange = function () {
    confirmado = true;
    var v = sel.value;
    if (normCli(v) === normCli(ehNatureza ? it.natureza : it.centro)) { renderItens(); return; }
    var campos = {};
    campos[campo] = v;
    chamar('atualizarItem', App.det.processo.id, id, campos)
      .then(function (det) { aplicarDetalhe(det); toast(ehNatureza ? t('msgNaturezaAtualizada') : t('msgCentroAtualizado')); })
      .catch(function (e) { toast(e.message, 'erro'); renderItens(); });
  };
  sel.onkeydown = function (e) { if (e.key === 'Escape') { confirmado = true; renderItens(); } };
  sel.onblur = function () {
    setTimeout(function () { if (!confirmado) renderItens(); }, 150);
  };
}

/* ---------- ajustes (impostos, taxas, descontos, diferença) ---------- */
function abrirModalAjuste() {
  var r = App.det.resumo;
  var catOpts = App.boot.categoriasAjuste.map(function (c) {
    return '<option value="' + esc(c) + '">' + esc(td(c)) + '</option>';
  }).join('');
  var natMaior = r.porNatureza.length ? r.porNatureza[0].natureza : '';
  abrirModal(
    '<h3 class="modal-titulo">' + esc(t('tituloAjuste')) + '</h3>' +
    '<div class="grid g-2">' +
    '<div class="campo"><label class="frm-label">' + esc(t('lblCategoria')) + '</label><select class="input" id="aj-categoria">' + catOpts + '</select></div>' +
    '<div class="campo"><label class="frm-label">' + esc(t('lblValorRS')) + '</label><input class="input" id="aj-valor" placeholder="' + esc(t('phValorAjuste')) + '">' +
    (r.diferenca !== null ? '<button type="button" class="btn-ghost btn-mini" id="aj-usar-dif" style="margin-top:7px">' + esc(t('btnUsarFalta')(fmtBRL(r.diferenca))) + '</button>' : '') +
    '</div>' +
    '</div>' +
    '<div class="campo"><label class="frm-label">' + esc(t('lblComoAlocar')) + '</label>' +
    '<div class="radio-linha">' +
    '<label><input type="radio" name="aj-modo" value="principal" checked> ' + esc(t('optAjustePrincipal')) + '</label>' +
    '<label><input type="radio" name="aj-modo" value="proporcional"> ' + esc(t('optAjusteProporcional')) + '</label>' +
    '</div></div>' +
    '<div class="campo" id="aj-nat-box"><label class="frm-label">' + esc(t('lblNaturezaRecebe')) + '</label>' +
    selectNaturezas('aj-natureza', natMaior, natMaior ? null : t('optEscolher')) + '</div>' +
    '<div class="campo"><label class="frm-label">' + esc(t('lblCentroAjuste')) + '</label>' +
    selectCentros('aj-centro', App.det.processo.centroPrincipal, null) + '</div>' +
    '<div id="aj-previa"></div>' +
    '<div class="campo"><label class="frm-label">' + esc(t('lblObsObrigatoria')) + '</label>' +
    '<textarea class="input" id="aj-obs" placeholder="' + esc(t('phObsAjuste')) + '"></textarea></div>' +
    '<div class="modal-acoes"><button class="btn btn-secondary" id="aj-cancelar">' + esc(t('btnCancelar')) + '</button>' +
    '<button class="btn btn-primary" id="aj-aplicar">' + esc(t('btnAplicarAjuste')) + '</button></div>');

  var selCat = $('aj-categoria');
  function aoMudarCategoria() {
    // categoria "Diferença" pré-preenche com o que falta, mas o valor fica
    // sempre editável — dá para alocar valores PARCIAIS em naturezas diferentes
    var dif = selCat.value === 'Diferença / arredondamento';
    if (dif && !$('aj-valor').value && r.diferenca !== null) {
      $('aj-valor').value = String(r.diferenca).replace('.', ',');
    }
    atualizarPrevia();
  }
  selCat.onchange = aoMudarCategoria;
  $('aj-valor').oninput = atualizarPrevia;
  if ($('aj-usar-dif')) {
    $('aj-usar-dif').onclick = function () {
      $('aj-valor').value = String(r.diferenca).replace('.', ',');
      atualizarPrevia();
    };
  }
  Array.prototype.forEach.call(document.querySelectorAll('input[name="aj-modo"]'), function (rd) {
    rd.onchange = function () {
      $('aj-nat-box').style.display = this.value === 'principal' ? 'block' : 'none';
      atualizarPrevia();
    };
  });

  function atualizarPrevia() {
    var modo = document.querySelector('input[name="aj-modo"]:checked').value;
    var el = $('aj-previa');
    var v = parseFloat(String($('aj-valor').value).replace(/\./g, '').replace(',', '.'));
    if (modo !== 'proporcional' || isNaN(v) || !r.porNatureza.length) { el.innerHTML = ''; return; }
    // prévia com base nas naturezas atuais (excluindo os próprios ajustes o servidor recalcula com exatidão)
    var baseNat = {};
    var totalBase = 0;
    App.det.itens.forEach(function (it) {
      if (it.tipo === 'Ajuste' || !it.natureza || it.valorFinal === null) return;
      baseNat[it.natureza] = (baseNat[it.natureza] || 0) + it.valorFinal;
      totalBase += it.valorFinal;
    });
    if (!totalBase) { el.innerHTML = ''; return; }
    var h = '<table class="dist-tabela"><tr><td style="color:var(--muted-2)">' + esc(t('txtPreviaDist')) + '</td><td></td></tr>';
    Object.keys(baseNat).forEach(function (nat) {
      var pct = baseNat[nat] / totalBase;
      h += '<tr><td>' + esc(td(nat)) + ' <span style="color:var(--muted-2)">(' + (pct * 100).toFixed(2) + '%)</span></td>' +
        '<td>' + fmtBRL(v * pct) + '</td></tr>';
    });
    h += '</table>';
    el.innerHTML = h;
  }
  aoMudarCategoria();

  $('aj-cancelar').onclick = fecharModal;
  $('aj-aplicar').onclick = function () {
    var payload = {
      categoria: selCat.value,
      modo: document.querySelector('input[name="aj-modo"]:checked').value,
      naturezaPrincipal: $('aj-natureza') ? $('aj-natureza').value : '',
      centro: $('aj-centro') ? $('aj-centro').value : '',
      valor: $('aj-valor').value,
      observacao: $('aj-obs').value.trim()
    };
    if (!payload.observacao) { toast(t('avisoObsAjuste'), 'alerta'); return; }
    fecharModal();
    chamar('aplicarAjuste', App.det.processo.id, payload).then(function (det) {
      aplicarDetalhe(det);
      var alocs = (det.alocacoes || []).map(function (a) { return td(a.natureza) + ': ' + fmtBRL(a.valor); }).join('\n');
      toast(t('msgAjusteAplicado')(alocs));
    }).catch(function (e) { toast(e.message, 'erro'); });
  };
}

/** Linhas "Natureza N" com valor e CR — a mesma divisão natureza × centro do e-mail. */
function naturezaCentroHtml(r) {
  var grupos = (r.porNaturezaCentro && r.porNaturezaCentro.length) ? r.porNaturezaCentro : null;
  if (grupos) {
    return grupos.map(function (g, i) {
      return '<div class="linha-info"><span class="k">' + esc(t('lblNaturezaN')(i + 1)) + '</span><span class="v">' +
        esc(td(g.natureza)) + ' — <b>' + fmtBRL(g.valor) + '</b>' +
        '<br><span style="font-size:12px;color:var(--muted-2)">' + esc(t('txtCR')(td(g.centro))) + '</span></span></div>';
    }).join('');
  }
  return r.porNatureza.map(function (n, i) {
    return '<div class="linha-info"><span class="k">' + esc(t('lblNaturezaN')(i + 1)) + '</span><span class="v">' + esc(td(n.natureza)) + ' — <b>' + fmtBRL(n.valor) + '</b></span></div>';
  }).join('') || '<div class="linha-info"><span class="k">' + esc(t('lblNaturezasVazio')) + '</span><span class="v">—</span></div>';
}

/** Lista dos centros de resultado efetivamente usados no rateio. */
function centrosUsadosTexto(r, p) {
  var grupos = r.porNaturezaCentro || [];
  var vistos = {};
  var lista = [];
  grupos.forEach(function (g) { if (!vistos[g.centro]) { vistos[g.centro] = true; lista.push(td(g.centro)); } });
  return lista.length ? lista.join(' · ') : (td(p.centroPrincipal) || '—');
}

      '<td>' + pillStatus(p.status) + '</td>' +
      '<td style="font-size:12px;color:var(--muted-2)">' + esc(p.responsavel) + '</td>' +
      '<td><button class="mini-acao" title="' + esc(t('tituloAbrirDetalhes')) + '" data-abrir="' + esc(p.id) + '">→</button></td>' +
    '</tr>';
  });
  tbody.innerHTML = h;
  Array.prototype.forEach.call(tbody.querySelectorAll('[data-abrir]'), function (b) {
    b.onclick = function () { abrirDetalhe(this.getAttribute('data-abrir')); };

function renderDetalhe() {

  var editavel = ['Rascunho', 'Em revisão', 'Divergente', 'Fechado', 'Reaberto'].indexOf(p.status) >= 0;
  var confirmado = p.status === 'Confirmado' || p.status === 'E-mail enviado';

  var el = $('detalhe-conteudo');
  el.innerHTML =
    '<div class="sec-head"><div class="num">·</div><h2>' + esc(p.id) + '</h2>' +
    '<div class="desc">' + esc(td(p.plataforma)) + ' · ' + esc(p.competencia) + '</div></div>' +
    '<div class="proc-cabecalho">' + cabecalhoProcessoHtml() + '</div>' +
    '<div class="acoes-linha">' +
    '<button class="btn btn-secondary btn-mini" id="d-voltar">' + esc(t('btnVoltarConsulta')) + '</button>' +
    (editavel ? '<button class="btn btn-primary btn-mini" id="d-continuar">' + esc(t('btnContinuarEdicao')) + '</button>' : '') +
    (confirmado ? '<button class="btn btn-primary btn-mini" id="d-email">' + esc(t('btnEmailLanc')) + '</button>' : '') +
    (confirmado ? '<button class="btn-ghost btn-mini" id="d-reabrir">' + esc(t('btnReabrir')) + '</button>' : '') +
    (App.boot.linkPlanilha ? '<a class="btn-ghost btn-mini" style="text-decoration:none" href="' + esc(App.boot.linkPlanilha) + '">' + esc(t('btnControle')) + '</a>' : '') +
    '</div>' +
    '<div class="sub-tabs" id="d-tabs">' +
    '<button class="active" data-tab="resumo">' + esc(t('tabResumo')) + '</button>' +
    '<button data-tab="rateio">' + esc(t('tabRateio')(App.det.itens.length)) + '</button>' +
    '<button data-tab="docs">' + esc(t('tabDocumentos')(App.det.documentos.filter(function (d) { return d.status === 'Ativo'; }).length)) + '</button>' +
    '<button data-tab="historico">' + esc(t('tabHistorico')(App.det.historico.length)) + '</button>' +
    '</div>' +
    '<div id="d-corpo"></div>';

  $('d-voltar').onclick = function () { mostrarView('consulta'); };
  if ($('d-continuar')) $('d-continuar').onclick = function () {
    mostrarView('novo');
    setEtapa(p.status === 'Rascunho' ? 1 : 2);
  };
  if ($('d-email')) $('d-email').onclick = abrirModalEmail;
  if ($('d-reabrir')) $('d-reabrir').onclick = function () { abrirModalReabrir(p.id); };

  Array.prototype.forEach.call(document.querySelectorAll('#d-tabs button'), function (b) {
    b.onclick = function () {
      Array.prototype.forEach.call(document.querySelectorAll('#d-tabs button'), function (x) { x.classList.remove('active'); });
      this.classList.add('active');
      renderDetalheAba(this.getAttribute('data-tab'));
    };
  });
  renderDetalheAba('resumo');
}

      '<div class="linha-info"><span class="k">' + esc(t('lblValorRelatorioDet')) + '</span><span class="v">' + fmtBRL(r.valorRelatorio) + '</span></div>' +
      '<div class="linha-info"><span class="k">' + esc(t('lblValorOficialAdotado')) + '</span><span class="v"><b>' + fmtBRL(r.valorOficial) + '</b></span></div>' +

      '<div class="linha-info"><span class="k">' + esc(t('lblDiferenca')) + '</span><span class="v">' + fmtBRL(r.diferenca) + '</span></div>' +
      '<div class="linha-info"><span class="k">' + esc(t('lblStatusFechamento')) + '</span><span class="v">' + esc(td(r.statusFechamento)) + '</span></div>' +
      '</div><div class="card">' +
      natHtml +
      '<div class="linha-info"><span class="k">' + esc(t('lblImpostos')) + '</span><span class="v">' + fmtBRL(r.impostosETaxas || 0) + '</span></div>' +

      '</div></div>';
  }

  else if (aba === 'rateio') {

    App.det.itens.forEach(function (it) {
      h += '<tr><td>' + pillStatus(it.status) + '</td><td class="td-conta" title="' + esc(td(it.conta)) + '">' + esc(td(it.conta) || '—') + '</td>' +

        '<td class="td-centro" title="' + esc(td(it.centro)) + '">' + esc(td(it.centro) || '—') + '</td><td>' + esc(td(it.natureza) || '—') + '</td>' +

  else if (aba === 'docs') {
    var docs = App.det.documentos;
    if (!docs.length) { corpo.innerHTML = '<div class="vazio">' + esc(t('vazioDocumentos')) + '</div>'; return; }
    var hd = '';
    docs.forEach(function (d) {
      hd += '<div class="doc-card"><div class="doc-icone">' + esc((d.nomeOriginal.split('.').pop() || '').toUpperCase()) + '</div>' +
        '<div class="doc-corpo"><div class="doc-nome">' + esc(d.nomeSalvo || d.nomeOriginal) + (d.status !== 'Ativo' ? ' · <span style="color:var(--pink)">' + esc(d.status) + '</span>' : '') + '</div>' +
        '<div class="doc-meta"><span>' + esc(td(d.tipoConfirmado || d.tipoSugerido)) + '</span><span>' + t('lblValorDoc')(fmtBRL(d.valor)) + '</span>' +
        (d.numero ? '<span>' + t('lblNumCurto')(esc(d.numero)) + '</span>' : '') +
        '<span>' + esc(d.importadoPor) + ' · ' + esc(fmtData(d.dataImportacao)) + '</span>' + pillConfianca(d.confianca) + '</div></div>' +
        '<div class="doc-acoes">' +
        '<button class="mini-acao" title="' + esc(t('tituloVisualizar')) + '" data-dver="' + esc(d.id) + '">👁</button>' +

  else if (aba === 'historico') {
    if (!App.det.historico.length) { corpo.innerHTML = '<div class="vazio">' + esc(t('vazioHistorico')) + '</div>'; return; }
    var hh = '<div class="card">';
    App.det.historico.forEach(function (ev) {
      var novo = logValor(ev.novo);
      hh += '<div class="hist-item">' +

        '<div class="hist-acao">' + esc(td(ev.acao)) + '</div>' +
        ((ev.campo || ev.anterior || novo) ? '<div class="hist-det">' + (ev.campo ? esc(td(ev.campo)) + ': ' : '') +
          (ev.anterior ? '<b>' + esc(td(ev.anterior)) + '</b> → ' : '') + '<b>' + esc(novo) + '</b></div>' : '') +
        (ev.justificativa ? '<div class="hist-det">' + esc(t('lblJustificativa')(ev.justificativa)) + '</div>' : '') +
        '</div>';
    });

  }
}

function abrirModalReabrir(id) {
  abrirModal(
    '<h3 class="modal-titulo">' + esc(t('tituloReabrir')(id)) + '</h3>' +
    '<p style="color:var(--muted-2);font-size:13px">' + esc(t('txtReabrir')) + '</p>' +
    '<div class="campo"><label class="frm-label">' + esc(t('lblJustObrigatoria')) + '</label>' +
    '<textarea class="input" id="re-just"></textarea></div>' +
    '<div class="modal-acoes"><button class="btn btn-secondary" id="re-cancelar">' + esc(t('btnCancelar')) + '</button>' +
    '<button class="btn btn-perigo" id="re-ok">' + esc(t('btnReabrirOk')) + '</button></div>');
  $('re-cancelar').onclick = fecharModal;
  $('re-ok').onclick = function () {
    var j = $('re-just').value.trim();
    if (!j) { toast(t('avisoInformeJust'), 'alerta'); return; }
    fecharModal();
    chamar('reabrirProcesso', id, j).then(function (det) {
      App.det = det;
      toast(t('msgProcessoReaberto'));
      mostrarView('novo');
      setEtapa(2);
    }).catch(function (e) { toast(e.message, 'erro'); });
  };
}
